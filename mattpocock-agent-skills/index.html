<script id="post-data" type="application/json">
{
  "title": "AI 写代码为什么总翻车，这套开源 Skills 给了四个解法",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月15日 05:44",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我最近把 github.com/mattpocock/skills 这个仓库从头读了一遍，有点意思。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">作者 Matt Pocock 是 TypeScript 圈里很有名的那位，出了一堆课程和教程。他把自己每天在用的智能体技能整理成了一个开源仓库，名字很直白，<strong style=\"font-weight:bold;color:#2563eb;\">Skills For Real Engineers</strong>，给真正做工程的人。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它不是又一个「提示词大全」。它把软件工程里那些老规矩，做成了智能体可以直接调用的一条条技能。仓库里现在有 27 个，MIT 协议，谁都能拿去改。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/banner.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">仓库首页。作者给自己的定位是一句大实话，我每天用它做真正的工程，不是 vibe coding。（图源 github.com/mattpocock/skills）</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">先说清楚它到底想治什么。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">它治的是四个老毛病</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Matt 说，这堆技能是照着他自己在 Claude Code、Codex 上反复踩的坑做的。坑就四个。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">第一个，智能体没搞懂你要什么。</strong>你以为它懂了，等它把东西做完，你才发现它压根没理解。人跟人之间最常见的失败是沟通鸿沟，换到 AI 时代，只是把沟挪到了人和智能体之间。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">药方是 /grill-me。它反过来拷问你，把你脑子里还没想清楚的部分一条条逼出来。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">第二个，智能体太啰嗦。</strong>项目里的黑话它不懂，只能拿二十个词去说一个词的事。药方是一份共享语言，落在一个 GLOSSARY.md 里。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">有了共享词汇，代码里的命名跟着一致，智能体读代码更省力，连思考时都更省 token。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">第三个，写出来的代码跑不通。</strong>没有反馈回路，智能体就是在盲写。药方是 /tdd 和 /diagnosing-bugs。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">第四个，代码库越写越乱。</strong>智能体提速的同时，也在加速软件熵增。代码库变复杂的速度，前所未有。药方是 /improve-codebase-architecture，隔几天跑一次，把该加深的模块挑出来给你。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/mode-fix.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">四个坑，四组药方，一一对应。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">装它，就一段命令</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">安装不折腾，README 上标的是「30 秒安装」。你按自己用的智能体挑一条就行，别都装，都装会让每个技能出现两遍。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">Claude Code，一行。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">claude plugin install mattpocock-skills@claude-plugins-official</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">Codex，两行。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">codex plugin marketplace add mattpocock/skills<br/>codex plugin add mattpocock-skills@mattpocock</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">GitHub Copilot，CLI 和 VS Code 都能装。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">copilot plugin marketplace add mattpocock/skills<br/>copilot plugin install mattpocock-skills@mattpocock</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">装完还有一步，每个仓库跑一次 <strong style=\"font-weight:bold;color:#2563eb;\">/setup-matt-pocock-skills</strong>。它会问你三件事，用哪个工单系统，给工单打什么标签，写的文档存哪儿。答完就能用了。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例一，动手前先被拷问一轮</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最值得玩的是 /grill-me，也是仓库里最火的一个。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">用法很简单。你想做点什么，先别急着让它写代码，先让它问你。它会把你脑子里含糊的地方，一轮一轮问到没有退路。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它的问法很特别，按一棵「设计树」来走。每一轮，把「现在能问、且不依赖其他没定问题」的那些问题一次性列全，每条都带上它自己的推荐答案。等你答完，它再算下一轮。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">大概长这样。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.8;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-word;\">❓ Q1 · 登录态放哪儿？<br/>&nbsp;&nbsp;用 cookie 还是 localStorage，要不要记住我<br/>➡️ 建议 cookie，HttpOnly，默认记住 7 天<br/><br/>❓ Q2 · 失败几次锁账号？<br/>&nbsp;&nbsp;连错几次触发锁定，锁多久<br/>➡️ 建议 5 次，锁 15 分钟</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">注意它每一问都先给出自己的推荐答案。你想省事，回一句「听你的」，就能一路往下走。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一轮答完，它往下推。直到设计树上每个分支都被走过，<strong style=\"font-weight:bold;color:#2563eb;\">一个默认假定都不留</strong>，它才允许你动手。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">说白了，它把「反复返工」提前到了动笔之前。改动越大，这一步越值。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例二，让测试先红再绿</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">/tdd 把红绿循环那套纪律写死了。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它有几条硬规矩。测试写在公共接口的边界上，它管这叫 seam，不测内部实现。动手前先把要测的 seam 跟你确认，一个没确认的 seam，不许写测试。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一次只走一个切片，一个测试配一段最小实现，滚动着往前推。它还规定，重构不属于这个循环，那是审查阶段的事。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还专门列出三种要躲的写法。<strong style=\"font-weight:bold;color:#2563eb;\">实现耦合的测试</strong>，一重构就碎成一片。<strong style=\"font-weight:bold;color:#2563eb;\">同义反复的测试</strong>，用代码自己的算法去算期望值，怎么写都能过。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最隐蔽的是第三种，把所有测试先一口气写完，再写实现。那样你测的只是想象的形状，不是真实的行为。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;line-height:1.6;margin:30px 0;\">代码可以整个换掉，测试不该跟着碎。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例三，从一句话到一次审查</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">把上面几个串起来，就是一条完整链路。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/flow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">从对齐需求到复盘，每个斜杠命令负责一段。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">/grill-me 把需求问清楚，/to-spec 把聊过的内容顺手整理成一份规格，/to-tickets 拆成一张张可独立执行的工单，/implement 按工单实现，内部驱动 /tdd，最后 /code-review 收尾。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">code-review 有个我觉得很妙的点。它从一个固定基点开始，某个 commit 或分支，然后并行派两个子智能体。一个查代码守没守住仓库自己的规范，一个查代码有没有忠实实现当初那张工单。两个分开跑，互不污染，最后并排摆给你看。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">一个改动完全可能一边过、一边挂。</strong>规范全守住了，实现的却是错的东西，或者反过来。分开报，就不会让一个方向盖住另一个。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">两类技能，一条规矩</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">仓库里的技能只按一个维度分，谁能调用它。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一类是你亲手敲才触发的，叫 user-invoked。它们负责编排，比如 /grill-me、/to-spec、/implement。另一类是模型自己也能够着的，叫 model-invoked。它们装着可复用的纪律，比如 tdd、diagnosing-bugs、codebase-design。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/invocation.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">上层的技能可以调用下层，下层永远够不到上层。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">规矩只有一条。上层可以调用下层，下层永远不会偷偷调用上层。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这条设计是为了守住人的控制权。你没敲那个斜杠，它就不会自己开一个新流程。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">作者在 README 里提了一句，我觉得是整份文档里最重的话。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">现在有些流程工具，比如 GSD、BMAD、Spec-Kit，选择把整个研发流程接管过去。接管的同时，也把控制权从你手里拿走了。流程里一旦出 bug，你会很难拆开。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这个仓库反着来。它做小，好改，能拼。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#2563eb;line-height:1.6;margin:30px 0;\">小而好改，能拼能拆。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">AI 让写代码这件事变快了。但快从来不是终点。真正决定一个项目能走多远的，是它有没有在提速的同时，把该守的纪律一起带上。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">仓库和 newsletter 一起放在文末。他那个 newsletter 现在有大约 6 万开发者跟着，更新挺勤。</p>\n\n<p style=\"text-align:center;margin:30px 0 12px;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:bold;padding:10px 22px;border-radius:8px;\">github.com/mattpocock/skills</span></p>\n\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;line-height:1.7;margin:6px 0 24px;\">开源，MIT 协议。装上它，跑一次 /setup-matt-pocock-skills，就能开工。</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
