<script id="post-data" type="application/json">
{
  "title": "Cloudflare 开源了一个安全审计 skill，六阶段流水线，装完就能跑",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月26日 10:45",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 22px;\"><img src=\"assets/pipeline.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">六阶段流水线。每个阶段独立 agent，互不共享上下文。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Cloudflare 上周开源了一个东西，叫 security-audit-skill。它不是一个新的安全产品，是一个 skill。装到你常用的 coding agent 里，它就会自动把 agent 变成一个安全审计员。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">挺有意思的是它的起源。Cloudflare 自己的漏洞发现 harness 就是从这个 skill 演化出来的。原本是单仓库起点，后来长成了跨 fleet 的多阶段系统。现在它把起点公开了。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这篇先讲概念，再讲怎么用。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">它到底是什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它是一个 prompt 工程的集合，加上零依赖的验证脚本。合在一起形成一个有严格边界的安全审计工作流。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">核心思想是 <strong style=\"font-weight:bold;color:#1a5fb4;\">六阶段流水线 + 多隔离 agent</strong>。侦察、狩猎、验证、输出、复核、报告，每个阶段的 agent 都是 fresh context，看不到前面的对话。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">为什么要隔离上下文。因为同一个 agent 发现的漏洞，自己再去验证，很容易带着「我找到的一定对」的偏见。Cloudflare 的解法很简单。让验证者是另一个 agent，拿着候选漏洞去 disprove 它。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">整个 skill 大约 20 个 markdown 文件。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">SKILL.md</span> 是入口，定义原则和触发条件。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">RECONNAISSANCE.md</span> 管第一阶段，<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">HUNTING.md</span> 管第二阶段，依此类推。中间穿插 10 份不同目标的攻击类 prompts，外加 3 个 Node.js 小脚本做零依赖的 JSON schema 校验。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">六个阶段怎么走</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Phase 1，Reconnaissance。目标是搞清楚你要审计的仓库到底长什么样。产出 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">architecture.md</span>（信任边界、输入面、已有证据）和 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">coverage-ledger.json</span>（确定性覆盖清单）。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Phase 2，Coverage-led hunting。从 ledger 里拆出独立 hunting 单元，每个单元派一个 isolated hunter。另外有 coverage critic 专门找遗漏。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Phase 3，Candidate validation。每个候选漏洞发给 fresh verifier。它的唯一任务是 disprove 这个候选。能 disprove 就归为 rejected，不能归为 needs_validation，source-grounded 且能完全证明就 confirmed。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Phase 4，Structured output。把 confirmed、needs_validation、rejected 三类结果写进 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">findings.json</span>，然后用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">validate-findings.cjs</span> 跑一遍 schema 校验。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Phase 5，Independent record verification。fresh agents 再去复核 findings 里的 source 证据。发现 material replacement 还要再换一个 verifier。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Phase 6，Target-neutral reporting。根据 verified records 和 coverage ledger 生成 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">REPORT.md</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">FINDINGS-DETAIL.md</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">NEEDS-VALIDATION.md</span>。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/attack-matrix.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">十个 attack class，不同仓库自动加载不同 hunting prompts。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">六条设计原则</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这些原则是最有意思的部分。几乎每一条都在反直觉地对抗 AI 审计常见的错误。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">**只确认已建立的边界失败。** 有 source-grounded blocked lead 但还没彻底证实？一律归 needs_validation，并记录 exact unresolved fact。不准打擦边球。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">**对抗性验证。** 发现漏洞的 agent 永远不是验证它的 agent。这是整个 skill 最重要的隔离设计。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">**严重性需要 impact。** likelihood 乘以 impact，不是偏离 checklist 多远。光「应该有」没用，要真能造成后果。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">**纵深防御缺口 ≠ 漏洞。** Layer A 已经挡住了，Layer B 不在那里只是 hardening note，不算漏洞。这一条能砍掉大量告警噪音。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">**多次运行提高覆盖率。** Cloudflare 自己的测试里，单次运行只能发现最终发现总数的一半。新的 ledger 会基于上一次的 findings 定向覆盖缺口。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">**三段 verdicts。** confirmed 必须有完整 source trace + bounded observed result。needs_validation 有 exact unresolved fact 且没有 severity。rejected 记录 disproved candidate。三者不会混淆。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/principles.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">六条原则，每一条都在对抗 AI 审计最常见的错误来源。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">怎么装</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">需要两样东西。一个是支持 tool use 和 parallel sub-agents 的 coding agent（比如 Cursor、Claude Code、Cline）。另一个是 Node.js，用来跑那两个零依赖验证脚本。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">安装用 Skills CLI 一条命令：</p>\n\n<p style=\"background:#12141a;color:#e6e8ee;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">npx skills add https://github.com/cloudflare/security-audit-skill \\\n  --skill security-audit\n\n# 装到用户级（所有项目都能用）\nnpx skills add https://github.com/cloudflare/security-audit-skill \\\n  --skill security-audit --global</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">装完以后，skill 会在 agent 识别到 security audit / find vulnerabilities / pen-test 这类请求时自动激活。不需要你手动加载。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">怎么跑</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">启动你的 coding agent，指向你要审计的代码库，然后直接说：</p>\n\n<p style=\"background:#12141a;color:#e6e8ee;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\"># 三种触发句式\nsecurity audit this codebase\nfind security vulnerabilities in ./src\ndo a security review, output to ~/audits/my-project</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">触发后 skill 自动决定模式。完整代码库审计用 full audit mode，安全问答用 guidance mode。full audit 默认把产物写到 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">~/security-audit-skill/&lt;repo-name&gt;/run-&lt;N&gt;/</span>。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">产物目录里会有 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">architecture.md</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">coverage-ledger.json</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">findings.json</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">REPORT.md</span>。多次运行的话 ledger 会叠加，自动跳过已覆盖的地方。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/adoption.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">安装 → 一句话启动 → 产物目录自动生成。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">两个需要注意的地方</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第一，这个 skill 对 sandbox 有硬要求。目标如果需要编译、跑测试、起浏览器、跑 fuzzer，这些动作必须在 OS 级隔离里。没有隔离也能跑，但 workflow 会把 lead 都标成 needs_validation，不执行实际代码。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第二，它不替你做最后判断。confirmed 是有完整证据的，needs_validation 只是精确地记录了什么还没证实。要不要修复、怎么修复，还是人来做。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Cloudflare 的原文里有一句话，我觉得可以当总结。Agent 擅长穷举候选、系统地跑 checklist、发现边界情况。但对漏洞严重性、纵深防御是否生效、哪些告警该打哪些该忽略，人类的判断不可替代。</p>\n\n<p style=\"border-left:4px solid #1a5fb4;padding:14px 18px;background:#f3f7ff;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\n让 Agent 穷举候选，让隔离的 verifier 去 disprove，让人类决定什么值得修。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">如果你有一个没人审过的小仓库，装这个 skill 跑一次，输出里应该能看到一些你之前没注意的地方。MIT 协议，可以随便用。</p>\n"
}
</script>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
