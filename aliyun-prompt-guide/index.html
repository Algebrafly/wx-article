<script id="post-data" type="application/json">
{
  "title": "阿里云百炼文生文 Prompt 指南速查：六块框架 + 三个优化技巧",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月27日 14:23",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">阿里云百炼最近把文生文 Prompt 指南更到了 2026-10-10。整篇不长，但结构很清楚：先讲怎么写，再讲怎么优化。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">和市面上很多 prompt 教程不一样，这篇没有堆术语，而是给了一整套可复制的框架和三个直接能用的小技巧。我提炼完，这篇就是个速查版。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#ea580c;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">第一条铁律：写清再说话</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">模型像一个新人同事。你只给它「帮我推广一下新产品」，它能做的就是把这句话重说一遍。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">但如果你说清楚：公司叫什么、产品叫什么、想发在哪、突出哪些卖点、希望什么样的风格——它就不会跑偏。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/clarity.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">模糊的 → 模型泛化；清晰的 → 输出有针对性。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">指南里把这条放在最前面是有道理的。**Prompt 写得清晰具体，是发挥大模型能力的第一步，也是最重要的一步。** 后面的框架、技巧都是在这一步之上做优化。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#ea580c;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">Prompt 框架：六块积木</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">只说「写清」等于没说。阿里云给了一个现成的框架，六个块，按需增减。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/framework.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">背景、目的、风格、语气、受众、输出，六块积木。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">六个块分别是：</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">背景</span>：任务所处的环境。模型理解了上下文，输出才相关。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">目的</span>：让模型完成什么，最核心的指令。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">风格</span>：输出用名人、流派、专家的哪一路风格。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">语气</span>：正式？诙谐？温馨？关怀？不同场景选不同语气。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">受众</span>：写给谁看，决定语言深度。写给五岁小孩和写给专家，输出天差地别。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#ea580c;\">输出</span>：列表？JSON？报告？定死格式，后续才能直接用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">用起来是这样的：</p>\n\n<p style=\"background:#fff8ed;color:#444;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;border-left:4px solid #ea580c;margin:0 0 20px;word-break:break-all;\">#背景#\n为阿里云百炼的 Zephyr Z9 轻薄手机做推广\n#目的#\n写一条微博帖，500字内，引导点击购买\n#风格#\n科技公司新品发布的广告写作风格\n#语气#\n有说服力\n#受众#\n微博上关注数码产品的年轻用户\n#输出#\n微博帖子格式</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">相比「帮我写一条微博推广」，这套框架让模型想到了更多你没说出口但应该考虑的事——特别是风格、语气和受众这三块，通常是普通 prompt 里漏掉的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">框架不是硬性规定。任务简单时删掉几块也没事。任务复杂时还可以往里加。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#ea580c;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">三个优化小技巧</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">框架是地基。往上盖还有三件事能让输出更稳。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/three_tips.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">样例、步骤、分隔符，复杂度依次升级。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#ea580c;\">给模型输出样例。</span>告诉它你想要的格式、语气、文法，它会模仿。这个技巧最大的好处不是第一次输出更像样，而是**多次输出会更一致**。电商写种草笔记，把你喜欢的四五个「万能公式」贴进去，模型输出的稳定度会提升一大截。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#ea580c;\">给模型写完成步骤。</span>复杂任务——尤其是数学题、推理题、多步骤分析——如果只给问题，模型容易跳步或直接蒙一个答案。把步骤写清楚「先算 A、再算 B、最后算 C」，它会老老实实一步一步来，出错率低很多。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#ea580c;\">用分隔符区分单元。</span>复杂 prompt 里把不同部分用 `###`、`===`、`>>>` 隔开。这些符号在自然语言里不常见，模型一眼就知道「这是分隔符，不是内容本身」。prompt 越复杂，这条越重要。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">三个技巧可以叠加。给样例 + 写步骤 + 加分隔符，一个数学题 prompt 能从「模型瞎蒙」变成「按步骤算出正确答案」。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/stack.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">框架打底，技巧叠加，复杂度自己定。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#ea580c;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">一个完整示例</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">把框架和三个技巧叠起来，写成一个能直接复制的 prompt：</p>\n\n<p style=\"background:#fff8ed;color:#444;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;border-left:4px solid #ea580c;margin:0 0 20px;word-break:break-all;\">### 背景\n你是一名前端资深工程师。用户给了你一个需求，需要你用 React 实现。需求描述如下：\n>>> 用户描述\n一个任务管理应用，支持增删改查、拖拽排序、分组标签。\n>>>\n\n### 目的\n用 React + TypeScript 给出一个最小可运行实现\n\n### 风格\n业界主流开源项目的代码风格，可读性优先\n\n### 步骤\n1. 列出核心数据结构（TypeScript 类型定义）\n2. 写出核心 Hook（useTasks）\n3. 写出主要组件（TaskList / TaskItem / TaskForm）\n4. 说明状态管理方案和取舍\n\n### 输出\n分四个小节输出，每节配代码块。代码片段要可复制运行。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">框架打底、`###` 和 `>>>` 做分隔、`步骤` 告诉模型怎么分解任务。比只说「帮我写个 React 任务管理应用」效果好很多。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#ea580c;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">总结</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">阿里云百炼这篇文生文 Prompt 指南，核心内容可以收进一张便签：</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">1.</span> 写 prompt 像给新人派活：越具体越不容易跑偏。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">2.</span> Prompt 框架六块：背景 / 目的 / 风格 / 语气 / 受众 / 输出。任务简单时可减。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">3.</span> 三个优化技巧：给样例稳一致性、写步骤降出错率、加分隔符帮模型解析。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#ea580c;\">4.</span> 框架是地基，技巧是往上盖的楼层——任务有多复杂，就盖多高。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#ea580c;\">5.</span> 阿里云百炼还提供了 Prompt 一键优化工具，在控制台 Prompt 页面点「自动优化」就能自动扩写。</p>\n\n<p style=\"border-left:4px solid #ea580c;padding:14px 18px;background:#fff3e0;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\nPrompt 不是许愿，是指派任务。写清楚背景、目的、给谁看、输出长什么样，模型就不会瞎做。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">原文参考：<a href=\"https://help.aliyun.com/zh/model-studio/prompt-engineering-guide\" style=\"color:#ea580c;text-decoration:none;\">help.aliyun.com/zh/model-studio/prompt-engineering-guide</a></p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
