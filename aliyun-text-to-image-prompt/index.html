<script id="post-data" type="application/json">
{
  "title": "阿里云百炼文生图 Prompt 指南速查：两条公式 + 五大词典",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月27日 14:28",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">阿里云百炼的文生图 Prompt 指南在 10 月 10 号和文生文指南同一天更新。两篇是配套的姊妹篇。和文生文那篇的「六块框架 + 三个技巧」不同，文生图这篇的结构更直接——</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">参数 → 公式 → 词典。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它适用于万相 V1 和 V2，不过 V2 多了一个自动改写功能，开箱即用。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#3b82f6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">三个参数</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">文生图模型和 prompt 直接相关的参数就三个。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/params.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">三个参数，一个正向一个反向一个自动改写。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#3b82f6;\">prompt</span>：正向提示词，用文字描述你想生成的图片。支持中英文，这是本篇主要讲的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#f43f5e;\">negative_prompt</span>：反向提示词，写你不想在图里看到的东西。「人物」「畸形手指」「低分辨率」「水印」都是常见的反向词。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#10b981;\">prompt_extend</span>：V2 特有，开了之后大模型会自动扩写和优化你的 prompt。默认就是 true，**推荐保留默认配置**。你写得粗一点没关系，它帮你润色。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">所以 V2 用户的最佳做法是：prompt 写得有骨架（按公式），negative_prompt 写上几个典型瑕疵，prompt_extend 不开手动关。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#3b82f6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">两条公式，按需选</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">阿里云给了两条公式。基础公式给新手，进阶公式给想追求更高画质的。差别不是\"进阶更好\"，而是进阶**多了四类更丰富的描述**。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/formulas.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">基础打底，进阶往上盖。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#3b82f6;\">基础公式：主体 + 场景 + 风格。</span>够了。你第一次玩文生图，就按这三块写。「一只坐在咖啡店窗外的橘猫 + 雨后的城市街道 + 写实」这种结构，模型就能出像样的图。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#3b82f6;\">进阶公式</span>在基础之上再盖四层：主体和场景都加描述（「25 岁中国女孩、圆脸、穿民族服装」比「一个女孩」有用得多），再加上**镜头语言、氛围词、细节修饰**。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">进阶公式完整写法：</p>\n\n<p style=\"background:#0f172a;color:#e2e8f0;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">主体（主体描述）\n+ 场景（场景描述）\n+ 风格（定义风格）\n+ 镜头语言\n+ 氛围词\n+ 细节修饰</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">什么时候用基础、什么时候用进阶？看两件事：你的创意复杂度，以及你对结果的要求。只是想看看模型能出什么感觉——基础就好，自由度高、想象力强。已经知道要什么画面、想让图达到某种质感——往上盖进阶公式。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#3b82f6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">五大词典维度，每一项都有现成词</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">公式给了骨架，具体填什么词？阿里云在 Prompt 词典里列了五类常用维度和示例词。你可以直接抄，也可以当灵感自己找同义词。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/lexicon.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">五类维度，每类都有现成的示例词。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#f59e0b;\">景别</span>：特写、近景、中景、远景。想突出人脸表情用特写，想交代环境用远景。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#3b82f6;\">视角</span>：平视最日常，俯视适合表现整体规模，仰视能造高大感，航拍拍大场景。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#22d3ee;\">镜头类型</span>：微距拍细节、广角拍环境、长焦能虚化背景突出主体、鱼眼拍特殊扭曲感。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#10b981;\">风格</span>：阿里云词典列了写实、水彩、水墨、3D 卡通、粘土、废土、点彩画、超现实、折纸、工笔……远不止这些，模型还能理解更多。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#f43f5e;\">光线</span>：自然光最稳、逆光能勾轮廓、霓虹灯造都市夜景、氛围光铺浪漫。光线是决定氛围的那一层。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">五类词典词可以叠着写。比如「中景 + 平视 + 长焦 + 写实 + 自然光」，就是一套很具体的画面规格。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#3b82f6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">一个完整示例</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">把进阶公式和五类词典叠起来写，再加上反向词和 V2 的自动改写：</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/example.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">完整的 V2 prompt 结构。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">把它放进 API 调用里：</p>\n\n<p style=\"background:#0f172a;color:#e2e8f0;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">{\n  \"input\": {\n    \"prompt\": \"羊毛毡制成的大熊猫，头戴大檐帽，穿着蓝色警服马甲，\n               扎着腰带，携带警械装备，大步奔跑，毛毡效果，\n               动物王国街道，夜晚，路灯，皮克斯风格，\n               摄影镜头，居中构图，逆光\",\n    \"negative_prompt\": \"写实人物，畸形手指，低分辨率\"\n  },\n  \"parameters\": {\n    \"prompt_extend\": true\n  }\n}</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">prompt_extend 默认就是 true，你甚至可以不写。negative_prompt 里挑三五个最容易踩的瑕疵写上就行。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#3b82f6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">总结</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">阿里云百炼这篇文生图 Prompt 指南，核心就两件事：</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#3b82f6;\">1.</span> 两条公式打底。新手用「主体 + 场景 + 风格」，有经验往上盖「镜头语言 + 氛围词 + 细节修饰」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#3b82f6;\">2.</span> 五类词典词填空：景别、视角、镜头类型、风格、光线。每一类都有现成示例可以抄。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">再记两条细节：negative_prompt 写上几个常见瑕疵（畸形、低分辨率、水印），V2 的 prompt_extend 别关。</p>\n\n<p style=\"border-left:4px solid #3b82f6;padding:14px 18px;background:#eff6ff;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\n文生图 prompt 不是越长越好。先按公式搭骨架，再用词典填肉。骨架对了，自动改写会帮你润色。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">原文参考：<a href=\"https://help.aliyun.com/zh/model-studio/text-to-image-prompt\" style=\"color:#3b82f6;text-decoration:none;\">help.aliyun.com/zh/model-studio/text-to-image-prompt</a></p>\n"
}
</script>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
