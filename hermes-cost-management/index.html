<script id="post-data" type="application/json">
{
  "title": "花得值不值：用 Hermes 做成本管理的四个过程",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月9日 10:20",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">成本管理最常见的误解，是把它当成记账。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">记账是事后动作：钱花出去了，记一笔，月底汇总。而成本管理是事前判断加事中纠偏——花之前先想清楚值不值，花的过程中随时知道偏了多少，偏到一定程度能拿出对策。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">这两件事的差别，在一个具体场景里特别明显。项目做到第六周，财务说「预算用了 64%」，团队说「活干了 47%」。这两个数字放在一起，项目的结局其实已经写好了，只是当时没人算这道除法。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1f2430;line-height:1.6;margin:34px 0 34px;\">成本管理不是省钱，是让「花了多少」和「换回了多少」始终可比。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">这是十大领域系列的第三篇。范围管「做对的事」，进度管「按承诺到」，成本管「花得值不值」。三者是同一个三角，任何一个动了，另外两个都要重算。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">结构照旧：四个过程的输入输出、两个重点环节（估算和偏差监控）拆到底、六份文档模板、归档方式、四种群消息、SKILL 目录，最后是边界。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">但有件事要先说清楚：<span style=\"color:#b45309;font-weight:bold;\">成本管理是十大领域里数据最脏的一个</span>。工时要人填，采购要对账，云资源月底才出账单，分摊规则靠拍脑袋。所有分析都建立在这些数字上，数字不真，算得再准也是假的。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #b45309;color:#b45309;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b45309;margin:18px 0 26px;\">只有四个过程，但每一步都在改数字</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">PMBOK 里成本管理只有四个过程，是十大领域中最少的。少不代表简单，只是它把复杂度都压在了数据上。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">规划成本管理</span> 定规则。用什么方法估算、精度要求到哪一档、多久报一次、CPI 低于多少要升级、变更走什么流程。这份计划只有两页纸，但它决定了后面所有动作的尺度。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#c2410c;font-weight:bold;\">估算成本</span> 给数字。这是全篇的第一个重点。它的输出不只是「52 万」这个数，还包括一整套估算依据：怎么算的、参照了什么、假设了什么、误差有多大。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#15803d;font-weight:bold;\">制定预算</span> 立基准。把各活动的估算汇总、加上应急储备，形成成本基准；再往上加管理储备，形成项目预算。基准一旦确定，动它就必须走变更。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">控制成本</span> 盯偏差。四步里唯一贯穿全程的，也是第二个重点。它产出的是工作绩效信息、成本预测和变更请求——注意最后一项，它把整个链路闭合回估算和预算。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">和进度管理对比着看会更有意思。进度管理的六个过程里，估算是「估时间」，成本管理里的估算是「估钱」；但两者用的是同一批活动、同一个 WBS、同一套工时。所以<span style=\"color:#b45309;font-weight:bold;\">如果进度和成本各算各的，第一个出问题的必然是其中一个的数据源</span>。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/pipeline.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 1 · 四个过程的输入、技术、输出</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #c2410c;color:#c2410c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">估算：先说精度，再谈数字</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">「这个项目大概要多少钱？」——如果你只能给一个数字，那这个数字一定不靠谱。但只要在数字后面加一句「误差范围 ±100%」，它立刻变成了一个诚实的信息。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这就是精度分级的意义。同一份需求，在项目不同的阶段，需要不同精度的估算：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#be123c;font-weight:bold;\">粗略估算</span> 误差 -50% ~ +100%。项目刚启动，用来判断「要不要做」。这时候纠结 5% 的差别毫无意义</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#b45309;font-weight:bold;\">预算估算</span> 误差 -10% ~ +25%。立项审批用，要进财务预算，精度要够</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#15803d;font-weight:bold;\">确定估算</span> 误差 -5% ~ +10%。招标签约、对外承诺用，这时候错一点就是赔钱</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">精度和成本是反比关系。要到 ±10% 的精度，可能需要把 WBS 拆到第四层、每个活动单独询价，投入的估算成本本身就不低。<span style=\"color:#c2410c;font-weight:bold;\">所以正确的做法不是追求最准，是让精度匹配决策需要。</span></p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">方法上有四种，和进度估算基本对应：类比、参数、自下而上、三点。成本这里最常用的是参数估算——「每个接口 0.5 人日 × 单价 2000 = 1000 元」，或者「每万次调用 0.3 元 × 预估调用量」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">AI 在这里能做的事情比进度估算更多，因为它能拿到历史上真实的单价数据。同一个功能，过去一年在不同项目里的实际人日成本，它一查就有。估算模板因此可以变成这样：</p>\n\n<p style=\"background:#13100b;color:#e8ddc8;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nest_id: EST-2026-041<br/>\nscope: 分账功能（RTM 12 条）<br/>\nmethod: bottom_up + analogy<br/>\n<br/>\nlines:<br/>\n&nbsp;&nbsp;- 接口开发&nbsp;&nbsp;12 个 × 0.5 人日 × 2000 = 12000<br/>\n&nbsp;&nbsp;- 前端页面&nbsp;&nbsp;4 个 × 1.5 人日 × 1800 = 10800<br/>\n&nbsp;&nbsp;- 联调测试&nbsp;&nbsp;8 人日 × 1800 = 14400<br/>\n&nbsp;&nbsp;- 上线支持&nbsp;&nbsp;3 人日 × 1800 = 5400<br/>\n&nbsp;&nbsp;direct_cost = 42600<br/>\n<br/>\nanalogy:<br/>\n&nbsp;&nbsp;- PAY-3120: 38,000（相似度 0.8）<br/>\n&nbsp;&nbsp;- PAY-2980: 51,000（相似度 0.7）<br/>\n<br/>\ncontingency: 15%&nbsp;&nbsp;# 已知风险：第三方联调<br/>\nmanagement_reserve: 8%&nbsp;&nbsp;# 高层掌握<br/>\naccuracy: -10% ~ +25%&nbsp;&nbsp;# 预算级<br/>\nassumptions:<br/>\n&nbsp;&nbsp;- 复用现有清结算模块<br/>\n&nbsp;&nbsp;- 不涉及合规改造<br/>\n</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这份 YAML 里最有价值的两行，是 <span style=\"color:#c2410c;font-weight:bold;\">analogy 和 assumptions</span>。前者让估算可被质疑（「为什么跟 PAY-3120 比？它的复杂度低在哪？」），后者让估算可被追责（「假设复用清结算模块，但实际上没复用，所以超支」）。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">没有这两行的估算，一旦超支就只剩互相指责：你说需求变了，他说你估得不准。有了这两行，至少可以定位到是哪个假设没成立。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">储备也要分清。<span style=\"color:#c2410c;font-weight:bold;\">应急储备</span>应对「已知的未知」——你知道联调会出问题，但不知道出几个，预留 15%；它属于成本基准的一部分，项目经理可以动用。<span style=\"color:#7e22ce;font-weight:bold;\">管理储备</span>应对「未知的未知」——你完全没想到的事，由高层掌握，动用要走变更。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">两笔混着算是最常见的错误。混在一起，项目经理会以为自己有 23% 的余量，高管会以为项目还有 23% 的空间，实际上谁都说不清还剩多少。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/estimate.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 2 · 三种精度等级，与成本基准的堆叠关系</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #15803d;color:#15803d;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#15803d;margin:18px 0 26px;\">挣值：四个量，四个比值</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">挣值管理（EVM）被很多人当成财务指标，其实它是<span style=\"color:#15803d;font-weight:bold;\">把「钱」和「活」放在同一把尺子上量</span>。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">它只有三个基础量，但每一个都要说清楚：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#b45309;font-weight:bold;\">PV 计划价值</span> 到今天为止，按计划应该完成多少活，值多少钱</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#15803d;font-weight:bold;\">EV 挣值</span> 到今天为止，实际完成了多少活，按预算单价折算成钱</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#be123c;font-weight:bold;\">AC 实际成本</span> 到今天为止，实际花出去多少钱</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这三个数里，<span style=\"color:#15803d;font-weight:bold;\">EV 是唯一同时包含「进度」和「成本」信息的</span>。它既反映干了多少活，又用预算价把活折算成了钱。所以所有有意义的比值都绕着 EV 转。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">两组核心指标：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#be123c;font-weight:bold;\">CV = EV - AC</span> 成本偏差。负数就是超支，单位是钱</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#b45309;font-weight:bold;\">SV = EV - PV</span> 进度偏差。负数就是落后，单位也是钱（因为按预算价折算）</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#be123c;font-weight:bold;\">CPI = EV / AC</span> 成本绩效。小于 1 表示「花 1 块钱只换回不到 1 块钱的活」</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#b45309;font-weight:bold;\">SPI = EV / PV</span> 进度绩效。小于 1 表示「干了一天只推进了不到一天的量」</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">有一个容易踩的坑：<span style=\"color:#be123c;font-weight:bold;\">CV 为正不一定是好事</span>。如果团队少干了活，AC 自然低，CV 就为正——看起来省钱，实际是进度落后。所以必须和 SPI 一起看。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">四个组合对应四种处境：CPI 大于 1、SPI 大于 1，又省又快，罕见；CPI 大于 1、SPI 小于 1，省钱但慢，通常是活干少了；CPI 小于 1、SPI 大于 1，快但贵，多半在赶工；CPI 小于 1、SPI 小于 1，又慢又贵，必须马上介入。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">预测部分四个公式：</p>\n\n<p style=\"background:#13100b;color:#e8ddc8;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nEAC&nbsp;&nbsp;= BAC / CPI&nbsp;&nbsp;&nbsp;# 按当前效率干完，总共要花多少<br/>\nETC&nbsp;&nbsp;= EAC - AC&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 还需要再花多少<br/>\nVAC&nbsp;&nbsp;= BAC - EAC&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 完工偏差，负数为超支<br/>\nTCPI = (BAC - EV) / (BAC - AC)<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 剩余预算下，需要达到的成本效率<br/>\n<br/>\n例：BAC=114 万 · EV=53 万 · AC=73 万<br/>\nCPI&nbsp;&nbsp;= 53 / 73&nbsp;&nbsp;&nbsp;&nbsp;= 0.73<br/>\nEAC&nbsp;&nbsp;= 114 / 0.73&nbsp;&nbsp;= 156 万<br/>\nVAC&nbsp;&nbsp;= 114 - 156&nbsp;&nbsp;&nbsp;= -42 万<br/>\nTCPI = (114-53)/(114-73) = 1.49<br/>\n</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">TCPI 这个指标很多人不熟，但它最有决策价值。<span style=\"color:#15803d;font-weight:bold;\">1.49 意味着剩下的活要用比现在高 49% 的成本效率干完</span>——这基本不可能。它其实是在告诉你：不砍范围，就一定会超支，早点承认比晚点承认好。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">EAC 的算法有四种，取决于你相信什么假设。按 CPI 算是最保守的（相信现状会持续），按原预算算是最乐观的（相信偏差只是一次性的），还有按 CPI×SPI 算的（认为成本超支和进度落后会叠加）。<span style=\"color:#15803d;font-weight:bold;\">选哪种不重要，说清楚选了哪种才重要。</span></p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/evm.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 3 · 四个量、两个偏差、两个指数、四个预测</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #be123c;color:#be123c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#be123c;margin:18px 0 26px;\">偏差监控：三条线的间距说明一切</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">把 PV、EV、AC 三条线画在同一张图上，叫成本 S 曲线。它比任何一张表都更直观，因为你不需要看数字，只看间距。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· EV 在 PV 下方，说明进度落后，中间的距离就是 SV</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· AC 在 EV 上方，说明成本超支，中间的距离就是 CV</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· 两条间距都在扩大，说明问题在恶化，不是一次性波动</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">图 4 是第六周的典型状态：EV 落后 13 万，AC 超出 20 万，两条缝都在张开。CPI 0.73，EAC 156 万，比预算多 42 万。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">到这一步，问题已经不是「怎么省回来」，而是「砍哪些范围」。因为 42 万相当于总预算的 37%，靠效率提升补这个坑，现实中不会发生。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">根因通常落在四类里，AI 能做的是把它自动归到某一类，而不是只报一个数字：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#be123c;font-weight:bold;\">估算偏差</span> 一开始就估错了。特征：从第一天起 CPI 就低于 0.95，且曲线平行</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#be123c;font-weight:bold;\">范围蔓延</span> 活变多了。特征：EV 增长但 CPI 和 SPI 同时下滑</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#be123c;font-weight:bold;\">返工</span> 干了又推翻。特征：AC 飙升但 EV 不动，工时集中在某几个活动</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">资源低效</span> 人在等、环境在空转。特征：AC 平稳增长但 EV 几乎不动，且工时记录显示大量等待</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这四类的对策完全不同：估错了要改方法，蔓延要卡变更，返工要查质量，低效要调资源。如果只报「超支 42 万」，管理者只能凭猜；如果报「返工导致超支 28 万，集中在支付联调」，动作就明确了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">还有一点：<span style=\"color:#be123c;font-weight:bold;\">成本偏差要按周看，不要按月看</span>。月度粒度太粗，等看到数字时已经花掉了一个月的钱。周粒度虽然噪音大，但能早两周发现问题——两周的差距，往往就是能救和不能救的区别。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/monitor.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 4 · 成本 S 曲线与第六周判读</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #7e22ce;color:#7e22ce;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#7e22ce;margin:18px 0 26px;\">六份文档，六套字段</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">和前两篇一样，字段固定下来，AI 才能填空、标红、追问。成本管理对应六份文档。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#b45309;margin:24px 0 10px;\">成本管理计划</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">五个字段：估算方法与精度要求、报告频率、CPI 预警阈值、储备使用规则、变更流程。第三个字段最关键——它决定了什么时候该打扰谁，以及打扰到什么程度。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#c2410c;margin:24px 0 10px;\">成本估算与估算依据</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">七个字段：估算方法、分项明细、直接成本、应急储备、管理储备、精度区间、假设与参照。上一节的 YAML 就是这份文档的骨架。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这里要强调一项常被省略的内容：<span style=\"color:#c2410c;font-weight:bold;\">估算依据</span>。它不算「正式交付物」，所以很多人不写。但半年后回看，你会发现只有这份文档能回答「当时为什么觉得 5 万够」。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#15803d;margin:24px 0 10px;\">成本基准</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">四个字段：基准版本、按周/月的资金需求曲线、各工作包预算分配、应急储备余额。第三条要和进度网络图对齐——每个工作包的预算要落在它实际发生的那几周。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">资金需求曲线还有一个现实用途：<span style=\"color:#15803d;font-weight:bold;\">和财务的现金流对账</span>。项目说第六周需要 40 万，财务说账上没这么多，这种冲突越早发现越好。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#1d4ed8;margin:24px 0 10px;\">成本绩效报告</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">六个字段：PV / EV / AC 三个基础量、CPI / SPI、按活动维度的偏差排名、工时与实际支出的差异。最后一项最能说明问题——计划 8 人日实际 15 人日，比整体超支 20% 具体得多。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#be123c;margin:24px 0 10px;\">成本预测</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">五个字段：当前 EAC、EAC 算法与置信度、VAC、TCPI、完工日期预测。EAC 必须给出区间和算法说明，只给一个数就是在制造幻觉。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#7e22ce;margin:24px 0 10px;\">成本变更单</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">六个字段：变更编号、金额影响、对应范围变更、储备动用来源、批准人、执行后基线版本。第五项要写具体的人，不要写「领导审批」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">六份文档入库时同样加 front-matter：doc_id、doc_type、project、version、status、baseline_at、related。doc_type 取值为 cost_plan、cost_estimate、cost_baseline、cost_performance、cost_forecast、cost_change。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">成本类的组织过程资产，最有价值的不是计划，是<span style=\"color:#7e22ce;font-weight:bold;\">「估算 vs 实际」的对照记录</span>。每条记录包含：估算值、实际值、偏差率、根因分类。攒够一百条，你的估算能力就不再依赖个人经验了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">所以在归档时有个硬要求：<span style=\"color:#7e22ce;font-weight:bold;\">项目结束时必须回填实际成本，且按活动维度回填</span>。只填总数没用，因为下次估算需要知道「接口开发这一类活动，历史上平均超估还是低估」。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#c2410c;line-height:1.8;margin:30px 0 10px;\">估得准的组织，都是把偏差记下来过的组织。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #be123c;color:#be123c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#be123c;margin:18px 0 26px;\">群消息：四种，每种一个动作</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">成本话题天然敏感，消息设计要格外小心。只报数字会让人紧张，报了又不说怎么办更让人紧张。所以每一条都必须带一个明确的动作请求。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#be123c;margin:24px 0 10px;\">成本预警</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">每周一早上发。四行：CPI 与 EAC 超支额、主要根因（带金额）、次要问题、@ 谁在什么时候前做什么决策。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">根因要带金额，这是这条消息的核心。「联调返工 18 人日」比「成本超支」有用十倍，因为它直接指向了可以砍的地方。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#b45309;margin:24px 0 10px;\">估算评审</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">估算提交时发。核心是把区间、历史参照、储备构成摊开，最后落在一个决策上：按哪个数立项。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这条消息的目的不是通知，是<span style=\"color:#b45309;font-weight:bold;\">把「要不要留够余量」这个选择摆到台面上</span>。不留余量就按原数，那后面超支时别再问为什么。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#c2410c;margin:24px 0 10px;\">预算变更</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">变更单提交时发。四行：变更编号与金额、对基线的具体影响（旧值 → 新值）、对应的范围变化、审批人和截止时间。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">加一句「逾期按原基线执行」很重要。它有约束力，能防止变更为悬案、项目在模糊状态下继续烧钱。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#15803d;margin:24px 0 10px;\">成本健康度</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">每月 1 日发。一个分数、三个指标（预算消耗率、工作量完成率、不合理支出笔数）、一条根因、一个下月动作。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">「不合理支出」这一类要单列，比如闲置未释放的云资源、超配的测试环境、重复采购的工具。这些钱省下来最直接，改动也最小。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/message.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 5 · 四种消息，都是四行以内</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #b45309;color:#b45309;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #7e22ce;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b45309;margin:18px 0 26px;\">SKILL 结构与边界</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">和 scope-manager、schedule-manager 同一套骨架，换掉 templates 和 queries：</p>\n\n<p style=\"background:#13100b;color:#e8ddc8;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nskills/cost-manager/<br/>\n├─ SKILL.md<br/>\n├─ templates/<br/>\n│&nbsp;&nbsp;├─ cost-plan.md<br/>\n│&nbsp;&nbsp;├─ cost-estimate.md<br/>\n│&nbsp;&nbsp;├─ cost-baseline.md<br/>\n│&nbsp;&nbsp;├─ performance-report.md<br/>\n│&nbsp;&nbsp;├─ cost-forecast.md<br/>\n│&nbsp;&nbsp;└─ cost-change.md<br/>\n├─ queries/<br/>\n│&nbsp;&nbsp;├─ evm_weekly.sql&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# PV/EV/AC + CPI/SPI<br/>\n│&nbsp;&nbsp;├─ cost_by_activity.sql&nbsp;# 活动维度偏差排名<br/>\n│&nbsp;&nbsp;├─ hours_actual.sql&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 填报工时 vs 实际<br/>\n│&nbsp;&nbsp;└─ idle_resource.sql&nbsp;&nbsp;&nbsp;# 闲置资源识别<br/>\n└─ render/<br/>\n&nbsp;&nbsp;&nbsp;├─ warn.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 成本预警<br/>\n&nbsp;&nbsp;&nbsp;├─ estimate.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 估算评审<br/>\n&nbsp;&nbsp;&nbsp;├─ change.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 预算变更<br/>\n&nbsp;&nbsp;&nbsp;└─ health.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 成本健康度\n</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">三个定时任务：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#be123c;font-weight:bold;\">每周一 09:30</span> 算上周 EVM，CPI 低于 0.9 才发预警</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#b45309;font-weight:bold;\">每周五 18:00</span> 回填本周实际成本，更新 S 曲线数据点</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#15803d;font-weight:bold;\">每月 1 日 10:00</span> 生成健康度，同时对账上月云账单和工时差异</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">五条边界，比进度管理那篇更值得强调。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">工时数据是地基，不是细节。</span>如果团队周末补填、按项目分摊、或者干脆填 8 小时了事，所有的 EVM 分析都是假的。上这套东西之前，先把填报规则定下来，哪怕每周只填一次也比乱填好。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">别把 CPI 做成考核指标。</span>一旦和绩效挂钩，所有数字都会开始变得好看，然后彻底失去参考价值。成本分析的信任成本极高，破坏只需要一次。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">EAC 必须带假设。</span>同一个项目，按不同假设算出的 EAC 可能差 30%。只给一个数字，等于把「预测」伪装成「事实」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">砍范围要靠人谈。</span>AI 能算出砍哪几个需求能省 42 万，但它不知道哪个客户不能得罪、哪个功能是高层点名的。它只提供选项，不做选择。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">成本数据有敏感等级。</span>人力成本、供应商报价、毛利结构，不是所有人都能看。推送前要按角色过滤字段，别把整张表扔进大群。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">范围、进度、成本三篇下来，项目管理的骨架搭起了一半。这三个领域共享同一批数据——WBS、活动、工时——所以它们的分析结果天然可以互相校验：<span style=\"color:#b45309;font-weight:bold;\">如果进度说超前而成本说超支，一定有一个数据源是错的</span>。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">下一篇聊质量管理。那个领域的难点不在数据，在口径——什么叫「质量好」，不同角色能给出完全不同的定义。</p>\n"
}
</script>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
