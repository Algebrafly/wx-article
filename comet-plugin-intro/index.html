<script id="post-data" type="application/json">
{
  "title": "AI 能写代码，却管不住长任务。这个开源工具补上了后半程",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月14日 02:55",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 26px;\"><img src=\"assets/cover-comet.png\" style=\"width:100%;border-radius:8px;\" /></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">最近在 GitHub 上翻到一个开源项目，叫 Comet，挺有意思，让我把它的文档从头翻了一遍。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">它解决的是一个大家可能都有体会、但很少被拿出来单说的麻烦。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">用 AI 写代码这件事，早就不新鲜了。补一个函数、生成一个接口、随手改个 bug，几十上百行的活儿，现在的模型基本都能自己搞定。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">但真实的工程任务，很少是几十行。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">一个需求拆下来，可能是十几个文件、好几个接口、一堆边界条件，还要跑测试、过评审、写文档、最后归档。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">这种活儿丢给 AI，麻烦就来了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">上下文一满，它开始忘事。你关掉编辑器，第二天回来，它不知道该接着干啥。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">更麻烦的是，你压根没法判断它这次干的，到底比上次好还是差。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">Comet 想补的，就是这后半程。</p>\n\n<p style=\"background:#f4f4fb;border-left:4px solid #4f46e5;padding:14px 18px;margin:22px 0;font-size:15px;color:#333;line-height:1.8;\">它的官方定位只用了一句话：面向 Coding 的<strong style=\"color:#4f46e5;\">可恢复长程任务工作流与 Skill 平台</strong>。读着有点绕，翻成大白话是三件事——任务中断了能接着跑，干活的过程有状态、能检查，Skill 写得好不好有办法量化。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">三个入口，覆盖写、造、评</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">Comet 把能力收拢在很低的记忆门槛上。装完之后，你基本只需要记住三个词。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#4f46e5;\">/comet</strong>，进入项目配置的工作流，处理一个真实需求。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#4f46e5;\">/comet-any</strong>，组合任意 Skill，把它整理成可打包、可分发的 Bundle。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\"><strong style=\"color:#4f46e5;\">comet eval</strong>，评估任意 Skill 的实际效果。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">一句话概括。写需求用 /comet，造 Skill 用 /comet-any，评 Skill 用 comet eval。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">没有把文档写进备忘录，你也能上手。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">装它，就两行命令</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">前置条件很简单。Node.js 22.16+（或 24+）加一个 Git，就够了。它是纯 Node 的 runtime，Windows、macOS、Linux 都能跑，不依赖 Bash 或 WSL。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">安装一行搞定。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Monaco,'Courier New',monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;overflow-x:auto;\">npm install -g @rpamis/comet</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">然后进到你要用它的项目里初始化。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Monaco,'Courier New',monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;overflow-x:auto;\">cd your-project<br />comet init</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">初始化是交互式的，会介绍并让你在 <strong>Native、Classic、两者</strong> 之间做选择。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">这里要划个重点。Native 和 Classic 不是「轻量版」和「完整版」的关系，官方说得很明确，两者彼此独立，也不会互相升级。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong>Native</strong> 面向能自己规划、自己验证的强模型。确认需求后，计划、实现、测试、审查的方法交给模型自主判断，Comet 负责状态检查、验收和可恢复归档。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\"><strong>Classic</strong> 保留 OpenSpec 加 Superpowers 的完整五阶段方法，适合需要明确方法论和强约束的场景。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/comet-init-runner.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">左边是 /comet 在 Claude Code 里的入口说明，右边是 comet init 自动装好 OpenSpec 与 Superpowers 的输出</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">不想交互，也可以直接指定。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Monaco,'Courier New',monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;overflow-x:auto;\">comet init --workflow classic<br />comet init --workflow both</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">配置统一写进 <span style=\"background:#f0f0f5;color:#4f46e5;font-family:Consolas,Monaco,monospace;font-size:13px;padding:2px 6px;border-radius:4px;\">.comet/config.yaml</span>。/comet 只读这个文件，然后确定性地转发到对应工作流，不按任务大小瞎猜，也不把两边混着用。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">一个简单示例：从建需求到归档</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">光说概念太空。假设你的项目要加一个「短信验证码登录」。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">在你的 AI 编程工具里，直接说一句就够。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Monaco,'Courier New',monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;overflow-x:auto;\">/comet 给登录模块加一个短信验证码登录，并补齐单元测试</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">Comet 会接管往下的事。它先建一条 change（可以理解为「一个独立的需求单元」），再按你的选择准备一个隔离工作区，当前分支、独立分支或者 worktree 都行。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">然后，在 Native 模式下，它会放权给模型自己去规划、实现、测试、审查。Comet 不插手具体怎么写，只负责在关键节点做状态检查，判它有没有达标。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">整条过程，Agent 断开也能接着跑，因为状态是落在项目里的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">如果你更习惯敲命令，同一个需求也有等价的 CLI 写法。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Monaco,'Courier New',monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;overflow-x:auto;\">comet native new add-sms-login --task \"add SMS login\"<br />comet native status --json<br />comet native next add-sms-login --summary \"Shape confirmed\" --confirmed<br />comet native archive add-sms-login --dry-run</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">四行命令，对应的正是「建需求 → 看状态 → 确认边界 → 预演归档」。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">值得一提的是最后那步。归档不会上来就动手，它会先跑一次 dry-run，把唯一的续接命令、完成选项和阻塞路径都摆在你面前。</p>\n\n<p style=\"background:#f4f4fb;border-left:4px solid #4f46e5;padding:14px 18px;margin:22px 0;font-size:15px;color:#333;line-height:1.8;\">你确认，Runtime 才接管归档提交。不用重复查状态，也不用自己手工提交那些运行时文件。这套「先预演、再确认」的节奏，是它敢说自己「可恢复」的底气。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">两个加分项：多 Agent 协作与 Skill 考试</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">用下来，我觉得 Comet 最值得看的是两块。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">第一块，是复杂需求的并行交付，官方叫 Supervisor Change。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">当一个需求里包含多个能独立做、独立验的交付项时，它会把目标拆成带依赖的子 change，用 DAG 管理就绪顺序，再让 Codex 的多会话、或者 Claude Code 的 Agent Teams，去各自的独立 worktree 里并行实现和验证。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">调度、任务身份、验证、有序集成，最后父 change 的统一验收，全归 Runtime 管。你在界面上看到的是两个子任务在同时推进，背后其实是它把依赖关系理清楚了。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/comet-supervisor.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">Supervisor Change 为两个子任务并行派发 Builder，各自只在 Runtime 分配的 worktree 里工作</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">第二块，是给 Skill 配了套「考试系统」。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">写 Skill 最容易翻车的地方，是改完之后你只能凭感觉说「好像变好了」。Comet 用 Rubric 结构化评分，加上 Pass@k、Pass^k 两个指标，让 Skill 的演进有可比较的依据。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">评估一个本地 Skill，最短路径就三行。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Monaco,'Courier New',monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;overflow-x:auto;\">comet eval ./my-skill --collect<br />comet eval ./my-skill --html<br />comet eval ./my-skill --quick --html</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">--collect 只做静态发现和配置检查，不跑模型、不起容器，是最便宜的排错入口。--quick 则走一个固定的冒烟任务，适合低成本试水。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">它还把主执行和 LLM-as-Judge 拆成两套独立配置，默认用 local 套件，需要接企业环境时可以切到 LangSmith 或 Langfuse，让 run、rubric 反馈、成本和 Claude Code 轨迹都能追溯。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/comet-eval-rubric.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">0.4.0 与 0.3.9 的 Rubric 剖面对比，恢复韧性、阶段守门等维度的分差一目了然。来源：Comet 官方评估</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">一个双 Agent 架构，就能在你的生产环境里自动把评估跑完。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">最后，看几个数字</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">项目自己做了一组 Native 与 Classic 的对齐实验。16 个任务，每种模式各跑 48 次。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">在双方都通过的 41 组配对样本里，Native 的 <strong style=\"color:#4f46e5;\">总 Token 少了 76.8%</strong>，Agent 轮次少了 57.4%，耗时少了 47.4%。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">而在严格可靠性这个更难的指标上，Native 的 pass^3 达到 87.5%，比 Classic 高出 12.5 个百分点；两者的 pass@3 都是 100%。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/comet-eval-pass5.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">Pass@5 很快饱和，Pass^5 才能暴露严格可靠性上的差距。来源：Comet 官方评估</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">翻译一下。Pass@5 大体是「跑 5 次里有没有一次成」，多数方案都能满分，看不出差别。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\"><strong>Pass^k 要求 5 次全都成</strong>，这才是工程里真正关心的稳定性。图上能直接看到，No Comet 和 0.3.9 在 Overall pass^5 上是 0.00，只有 0.4.0 顶住了。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">除了这几个数字，还有两件事我记了一下。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">一是平台覆盖。comet init 一次支持 37 个 AI 编码平台，Claude Code、Cursor、Codex、Copilot、Trae 这些都在列。Skill 支持项目级和全局安装，还能按平台差异落到不同目录。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">二是它自带一个三栏 Dashboard，在浏览器里能看进度、看 Git worktree、看验收结果和归档记录，也能顺手管理个人记忆和项目知识。项目是 MIT 协议开源的。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/comet-dashboard.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 26px;\">Comet Dashboard：左侧切换工作区与工作流，中间看产物与门禁进度，右侧给下一步建议</p>\n\n<p style=\"font-size:16px;color:#4f46e5;font-weight:bold;text-align:center;margin:30px 0 10px;\">过去两年，AI 编程工具都在比谁写得更快。</p>\n<p style=\"font-size:16px;color:#4f46e5;font-weight:bold;text-align:center;margin:0 0 26px;\">Comet 比的是另一件事，谁能把整条链路，从头到尾稳稳地交出去。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">当然，它也不是没有门槛。Native 依赖强模型，弱模型未必撑得住自主规划；Classic 的五阶段更重，小改动反而显得繁琐。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">所以它更适合的场景，是那种一个人做不完、又必须做得可追溯的长任务。这种活儿，恰好是 AI 编程工具过去最不擅长的。</p>\n\n<p style=\"font-size:14px;color:#888;text-align:center;margin:36px 0 0;line-height:1.8;\">—— Comet<br />Agent Skill Harness，把想法变成可评估的工作流</p>\n\n<p style=\"margin:30px 0 14px;text-align:center;\"><a href=\"https://github.com/rpamis/comet\" style=\"display:inline-block;background:#4f46e5;color:#fff;font-size:15px;font-weight:bold;padding:12px 32px;border-radius:8px;text-decoration:none;\">👉 查看 Comet 项目主页</a></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 6px;line-height:1.7;\">项目地址：https://github.com/rpamis/comet</p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0;line-height:1.7;\">文档：https://docs.comet.rpamis.com</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
