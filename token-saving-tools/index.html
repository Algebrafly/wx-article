<script id="post-data" type="application/json">
{
  "title": "AI 编程烧 token 太快，这几款工具真能省下来",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月16日 03:17",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我最近在折腾一件有点抠门的事，省 token。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">真不只是为了省钱。上下文一满，智能体就开始忘事、开始犯错，前面交代过的规矩它转头就不认。<strong style=\"font-weight:bold;color:#2563eb;\">上下文窗口是它最金贵的资源，用光了就掉智商。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我把主打省 token 的插件和 skill 翻了一遍，挑出三款我觉得真能用的，配好给你。下面的命令我都对着各自官方文档核过一遍。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">先搞清楚，token 花在哪</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一次任务烧掉的 token，大致三个去向。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个是<strong style=\"font-weight:bold;\">读代码</strong>。为了看一个函数，它把整个文件读进上下文。仓库越大，这个洞越大。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个是<strong style=\"font-weight:bold;\">查文档</strong>。你把过时的文档贴进去，它照着旧版本给你写新代码。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">还有一个最容易被忽略，是<strong style=\"font-weight:bold;\">模型自己啰嗦</strong>。寒暄一句，把你的问题复述一遍，再顺手多加两层你根本没要的抽象。每一轮都重复一次。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/token-flow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">省 token 的插件，基本都在堵这三个洞里的一个。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">四款工具，各补一个洞</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一句话过一下。Serena 管读代码，Context7 管查文档，claude-token-efficient 管模型输出，Caveman 两头都管一点。下面逐款给配置。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/tools.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">挑一个最痛的先装，不必四款全上。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">第一款，让智能体按符号读代码</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Serena 来自 oraios 团队，开源。核心思路一句话，别让智能体 grep 一处、再把整个文件读进来，让它像人用 IDE 一样，按符号定位。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/symbol.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">同样改一个函数，两种读法差的是几百行上下文。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它底层跑的是真正的语言服务器，支持四十多种语言。找符号、看文件结构、找引用，全在符号这一层完成，不把整文件搬进上下文。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">安装，前提只有一个 uv。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">uv tool install -p 3.13 serena-agent</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">初始化。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">serena init</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">接进 Claude Code，一行搞定。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">serena setup claude-code</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">想手动控制，用这条给当前项目配。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">claude mcp add serena -- serena start-mcp-server --context claude-code --project \"$(pwd)\"</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">想全局给所有项目用，加两个参数。装完敲 /mcp 确认连上。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">claude mcp add --scope user serena -- serena start-mcp-server --context claude-code --project-from-cwd</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">官方还建议配一个 reminder 钩子，在它连续 grep 却不调用 Serena 工具时把它拽回来。这个钩子目前标着 alpha，介意的话先不装。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">许可要提一句，Serena 的 SolidLSP 部分是 MIT，应用本体是 GPL-3.0-or-later，商用前留意。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">第二款，用的时候才去拉文档</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Context7 解决的是文档问题。你不贴文档，模型就凭记忆写，容易写出过时 API。你贴文档，又白白占一大块上下文。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">它的做法是，用到的时候，现去拉。前提 Node 22.13 以上，一条命令配置。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">npx ctx7 setup --claude</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第一次运行它会问你选哪种模式，两种都有用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一种是 MCP server。装好之后，智能体自己就能调 resolve-library-id 和 query-docs 两个工具，需要什么文档自己去查，你不用管。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">另一种是 CLI + Skills。它不装 MCP，而是给你的智能体装一个 docs skill，让它走命令行去拉。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">ctx7 setup --cli --claude</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">配好之后，你自己在终端也能直接查。先按名字找到库，再按问题拿文档。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">ctx7 library prisma \"如何定义带级联删除的一对多关系\"<br/>ctx7 docs /prisma/prisma \"如何定义带级联删除的一对多关系\"</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">文档不进上下文的前提，是用的时候它才进。</strong>这一条其实比省下的 token 更值钱，它顺手把「模型凭记忆瞎写老 API」这个坑也堵了。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">第三款，一份文件管住啰嗦</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">claude-token-efficient 管的是模型自己的嘴。做法极简，就一个 CLAUDE.md 文件，丢进项目根目录。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">curl -o CLAUDE.md https://raw.githubusercontent.com/drona23/claude-token-efficient/main/CLAUDE.md</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它禁掉的那些毛病，你应该都眼熟。开头一句「好问题」，结尾一句「希望对你有帮助」，把你的问题原样复述一遍，用一堆破折号和智能引号，顺手加你没要的抽象，还有你明显说错了它仍然点头说对。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">这些全是 token，全都不产生任何价值。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它给了一个我很欣赏的坦白。作者自己的 benchmark 里写着，词数掉得比 token 稳，短提示词上基本持平，想净省，得看你的输出量够不够大。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">而且 CLAUDE.md 每一轮都要重新读进上下文，文件本身越长，反而越费。它自己就提醒，这个文件千万别写长。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;line-height:1.6;margin:30px 0;\">省 token 的文件，自己先得短。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">第四款，让智能体学原始人说话</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最后一款画风不太一样，它叫 Caveman，翻过来就是山顶洞人。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">思路直接到有点好笑，让智能体像原始人一样开口。仓库的口号是 <strong style=\"font-weight:bold;color:#2563eb;\">why many token when few do trick</strong>，能用几个词说清的事，别用一整句。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/caveman.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">同一件事，两种说法。数据、路径、报错一个字符都不动。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它 2026 年 4 月上线，本来是个玩笑，结果几天之内冲上 GitHub Trending 第一名，现在已经十万多颗星。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">装法很简单。通用安装一行，支持 30 多款智能体。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">npx skills add JuliusBrussee/caveman -g</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">Claude Code 插件，两行。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">claude plugin marketplace add JuliusBrussee/caveman<br/>claude plugin install caveman@caveman</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">用法就是在对话框里敲命令。不想用了，说一句 stop caveman 就回去。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.8;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">/caveman&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;开启，温和档<br/>/ultracave&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;更狠的一档<br/>/megacave&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;文言文模式<br/>/caveman status&nbsp;查看当前档位<br/>stop caveman&nbsp;&nbsp;&nbsp;&nbsp;关掉</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它不是把话说得没语法。<strong style=\"font-weight:bold;\">规矩写得很死</strong>，先给答案再给理由，砍掉寒暄、铺垫和收尾，能短就短，一句话只装一个意思。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">代码、命令、路径、报错，一个字符都不许改。安全警告、不可逆操作、需要你确认的步骤，它也会临时切回完整句子。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">它砍的是废话，不是信息。一个漏掉的 not，比省下的所有 token 都贵。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">顺手它还做了几件事。/caveman-commit 生成一行提交信息，/caveman-review 一行一条审查意见，/caveman-compress 专门压缩 CLAUDE.md 这类记忆文件。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">数字我照抄，不往大了说。在十个开发问题上，不设指令是 6983 个输出 token，加一句「回答简洁点」降到 4334，再叠上 /caveman 是 4119，换成 /ultracave 直接到 2693。<strong style=\"font-weight:bold;\">真正省下来的那部分，主要靠更狠的那一档。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还有一层叫 proxy，管的是智能体读进来的东西。日志、CSV、JSON、测试输出，过一遍能小掉 98.5% 到 99.1%，整场会话的输入 token 少 33.2%。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">JetBrains 拿 86 个真实任务做过 A/B，结论是没有可测的质量损失，输出 token 少 8.5%。<strong style=\"font-weight:bold;color:#2563eb;\">注意这个数字，比宣传里那个 75% 克制得多。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最后留一句它自己的提醒。Caveman 的规则本身大约有 1160 个 token，每一轮都会跟着走。你要按次计费，比如 Copilot 的高级请求，回答短了价钱也一样，这款就别装了。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">还有几件事，不装插件也能做</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Claude Code 官方文档里，还有一批白送的省法。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">用钩子先过滤。</strong>拿日志举例，别让模型去读一份一万行的日志，用一个钩子先把 ERROR 挑出来，只把命中行交给它。上下文能从几万 token 掉到几百。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">用 skill 预置领域知识。</strong>写一个 codebase-overview 的 skill，把架构、关键目录、命名约定写进去。模型一调用就拿到，不用满仓库乱翻去理解结构。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">切换任务就敲 /clear。</strong>别让上一摊无关内容一直跟着后面每一轮。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">提文件用 @ 挂上去。</strong>别光报个文件名让它自己去找，那又是一轮搜索。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">模型和思考档位开工前定好。</strong>中途改会打爆提示缓存，本来想省，结果更贵。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">用 /mcp 关掉这次用不到的 MCP 服务。</strong>关掉的服务器，花的 token 是零，这是投入产出最高的一步。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 24px;\">说了这么多工具，我想把一句更要紧的放在最后。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">上下文不是内存条，它更像一张工作台。桌面上堆的东西越多，你越难找到要用的那一件。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">省 token 省到最后，省的不是钱，是让智能体始终待在清醒的那一段里。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">桌面上只留这次要用的东西，它才不容易犯错。</p>\n\n<p style=\"text-align:center;margin:30px 0 12px;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:bold;padding:10px 22px;border-radius:8px;\">Serena · Context7 · claude-token-efficient · Caveman</span></p>\n\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;line-height:1.7;margin:6px 0 24px;\">四款都开源，命令取自各自官方文档。前两款装完记得敲 /mcp 确认连接。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
