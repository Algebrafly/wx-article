<script id="post-data" type="application/json">
{
  "title": "GPT Image 2 提示词写法：五个零件、五条模板、四个坑",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月27日 10:42",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">OpenAI 2026 年的图像生成旗舰模型已经换成了 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#8b5cf6;\">gpt-image-2</span>。它不是 DALL·E 3 的小迭代，而是专门攻两个老大难问题：长提示词的跟随度，和图中文字的可读性。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">如果你用过 Midjourney 做海报，一定被「文字乱码」折磨过；如果你用 DALL·E 3 写过五从句 prompt，也一定见过它漏掉其中两句。GPT Image 2 就是奔着这两件事来的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这篇按 AIPromptary 的指南整理。把 prompt 拆成五个零件，给你五条可复制模板，再列四个常见错误。看完可以直接用。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#8b5cf6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">一条好提示词的五个零件</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">GPT Image 2 吃长提示词，但「长」不等于「乱」。AIPromptary 的编辑把它拆成五个固定零件，每次写 prompt 就当 checklist 用。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/anatomy.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">按这个顺序写，漏一个，命中率就掉一档。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Subject 主体</span>，用具体名词。不要说「一个人」，要说「一位 30 岁、穿黑色围裙的男咖啡师」。具体性把模型的可能性空间压小，结果更接近你想要的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Style 风格</span>，只选一种视觉语言。电影感、3D 渲染、矢量扁平、水彩、铅笔素描，都是明确的 register。一条 prompt 里混两种风格，通常只会得到一团糊糊。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Composition 构图</span>，写机位、焦距、景别。「85mm 镜头、浅景深、特写人像」比「很酷的角度」可靠一百倍。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Lighting 光线</span>，承担 60% 的情绪。用技术词：「黄金时段侧光」「柔光箱主光、右侧轮廓光」「阴天漫射日光」。GPT Image 2 都听得懂。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Detail anchors 锚点</span>，把不能模糊的东西钉死：画幅比例、配色、图中文字内容。比如「3:2 画幅、青橙配色、 headline 为 Late Autumn 2026」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">把五个零件串起来，大概长这样：</p>\n\n<p style=\"background:#17131f;color:#e8e2ff;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">A cinematic portrait of a 30-year-old male barista in a black apron, standing behind a coffee machine, shot on Arri Alexa Mini with a 50mm anamorphic lens, shallow depth of field, golden-hour side light through window, muted teal and amber color grade, photorealistic, 35mm film grain, aspect ratio 16:9.</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#8b5cf6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">五条可以复制的模板</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">如果你不知道怎么开头，先套模板跑一次。模板的价值不是让你照抄，而是让模型先理解你想要的结构。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/templates.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">替换 {} 里的占位符，直接粘贴。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最实用的是这三条：</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">电影感人像</span></p>\n<p style=\"background:#17131f;color:#e8e2ff;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:14px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">Cinematic still of {SUBJECT}, shot on Arri Alexa Mini with a 50mm anamorphic lens, shallow depth of field, golden-hour side light, dust particles in the air, muted teal and amber color grade, photorealistic, high detail, 35mm film grain, aspect ratio 16:9.</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">产品样机</span></p>\n<p style=\"background:#17131f;color:#e8e2ff;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:14px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">Studio product photography of {PRODUCT}, soft three-point lighting with a large softbox key, seamless paper backdrop in {COLOR}, slight reflection on a polished surface, hyper-detailed, photorealistic, 50mm lens, 4k. Aspect ratio 1:1, brand-clean composition.</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">字体海报</span></p>\n<p style=\"background:#17131f;color:#e8e2ff;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:14px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">Bold modernist movie poster for a film called \"{TITLE}\", featuring {SUBJECT} in dramatic silhouette. Rendered in flat vector style with a single accent color {COLOR}. The headline \"{TITLE}\" is centered at the top in a heavy sans-serif typeface. Tagline \"{TAGLINE}\" sits at the bottom in smaller weight. Aspect ratio 2:3.</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">模板里 {} 越少越好。先把结构定下来，再逐步替换主体和配色。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#8b5cf6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">四个常见错误</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">AIPromptary 说避掉这四个坑，命中率能从 30% 跳到 80%。我没有精确验证过这个数字，但每条都确实是自己踩过的。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/mistakes.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">左边是坑，右边是修。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">塞太多主体。</span>「一只猫、一只狗、一只鹦鹉在面包店里穿燕尾服看夕阳」——模型会随机挑其中两个，剩下的当它不存在。 fix：每条 prompt 只放一个主角，其他元素留到第二次生成。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">用模糊形容词。</span>「美丽」「高质量」「惊艳」都是噪声，模型不知道它们长什么样。换成技术词：photorealistic、oil painting、isometric 3D。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">混搭不兼容风格。</span>「写实动漫」或「扁平 3D」会让模型 confusion。想要 hybrid，不如出两张图，后期合成。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">不写画幅比例。</span>GPT Image 2 默认出正方形。你要 16:9 或 4:5，必须在 prompt 里写，同时把 API 的 size 参数也设对。只靠 prompt 说 ratio，图可能还是方的。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#8b5cf6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">两条入口，尺寸别只靠 prompt</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">怎么用？两条路。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/access.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">ChatGPT 零代码，API 批量生产。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">ChatGPT</span>：Plus / Pro / Team / Enterprise 用户默认就有。直接粘贴 prompt，说一句「光线再暖一点」就能迭代。适合设计师和内容创作者。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Images API</span>：POST 到 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#8b5cf6;\">/v1/images/generations</span>，model 设为 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#8b5cf6;\">gpt-image-2</span>。你能控制 size、quality、n。适合批量和产品集成。</p>\n\n<p style=\"background:#17131f;color:#e8e2ff;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">curl https://api.openai.com/v1/images/generations \\\n -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n -H \"Content-Type: application/json\" \\\n -d '{\n \"model\": \"gpt-image-2\",\n \"prompt\": \"A cinematic portrait of a cyberpunk samurai...\",\n \"size\": \"1024x1024\",\n \"quality\": \"high\"\n }'</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">尺寸方面，API 目前给的是 1:1（1024×1024）、2:3 竖版（1024×1536）、3:2 横版（1536×1024）。标准质量最便宜，高画质和宽图更贵。ChatGPT Plus 用户大约每 3 小时能生成 30-50 张。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">商业使用上，OpenAI 目前允许你对生成内容拥有完整权利，包括商用。但上线客户项目前，最好再核对一次最新条款。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#8b5cf6;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">总结</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">写好 GPT Image 2 的 prompt，本质上是在写一份镜头脚本。不是越短越好，而是越具体越好。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 10px;\">记住这几点：</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#8b5cf6;\">1.</span> 主体用具体名词，越具体，模型空间越小。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#8b5cf6;\">2.</span> 风格只定一种 register，别混。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#8b5cf6;\">3.</span> 构图、光线用技术词，少用「酷」「好看」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#8b5cf6;\">4.</span> 结尾必须钉死画幅、配色和图中文字。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#8b5cf6;\">5.</span> API 调用时 size 参数要和 prompt 里的 ratio 一致。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#8b5cf6;\">6.</span> 先套模板，再微调，比从零写长 prompt 稳定得多。</p>\n\n<p style=\"border-left:4px solid #8b5cf6;padding:14px 18px;background:#f5f3ff;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\n提示词不是许愿，是一份视觉指令。你写得越像分镜，模型出图越稳。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">原文参考：aipromptary.com/guides/gpt-image-2-prompts-guide。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
