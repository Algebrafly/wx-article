<script id="post-data" type="application/json">
{
  "title": "AI 不缺能力，缺的是你们公司那本手册",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月23日 09:15",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:24px 0 0;\"><img src=\"assets/cover.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">我给一个做销售的朋友演示 Claude 时，他说了一句：\"ask todd to do the PSR for oracle\"。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Claude 答得很认真，也很没用。它不知道 todd 是谁，不知道 PSR 是什么文档，更不知道 oracle 指的是正在跟的那笔 230 万美元的单子。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这不是模型能力问题。你把这句话翻译成完整中文再问，它答得很好。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">问题在于：<b>模型知道世界上的一切，唯独不知道你们公司怎么说话、活在哪个系统里、事情该按什么流程办。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Anthropic 开源的 <b>knowledge-work-plugins</b> 就是解决这个的。11 个按岗位划分的插件，把\"这个角色该怎么干活\"写成文件，连同公司的术语、系统、流程一起喂给 Claude。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>插件不是提示词，是岗位说明书<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">很多人第一反应是\"把公司资料丢进知识库不就行了\"。不够。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">知识库解决的是\"信息在哪\"，插件解决的是\"拿到信息之后怎么处理\"。以销售场景为例，同样是\"准备见客户\"，一个资深销售会做的事是：</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 先看 CRM 里这个客户现在的阶段和金额</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 翻上一次通话记录，找出没被回答的问题</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 查一下最近的邮件和群里有没有新进展</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 翻竞争对手最近有没有发新东西</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 最后按公司的模板出一页 brief，重点写该问的三个问题</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这套顺序、这些判断标准、这个模板，才是插件里真正装的东西。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">所以我更愿意把它理解成<b>一份可以被执行的岗位说明书</b>：不是告诉 AI \"我们公司有什么\"，而是告诉它\"在我们公司，这件事该这么做\"。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>拆开看：一个插件只有四样东西<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/anatomy.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">整个仓库 1000 多个文件，全部是 markdown 和 JSON</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">没有一行代码，没有构建步骤，没有依赖要装。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>plugin.json</b>：身份。名字、版本、一句话说明。就 286 字节，productivity 插件的全文。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>skills/</b>：领域知识。每个 skill 一个目录，一个 SKILL.md，开头是 YAML（名字 + 什么时候该用），正文是流程。这些是<b>自动触发</b>的——你说\"帮我准备明天的会\"，它自己判断该用 call-prep。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>commands/</b>：显式动作。写成 <code style=\"background:#f7f2ec;padding:1px 5px;border-radius:3px;font-size:14px;\">/sales:call-prep</code> 这样，你手动敲。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>.mcp.json</b>：连接器。把 Slack、Notion、Salesforce 这些系统通过 MCP 接进来。这是唯一涉及\"外部世界\"的部分。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">我翻了几份 SKILL.md，有个细节挺有意思：sales 的 call-prep 开头不是流程，而是一段<b>\"规则\"</b>。</p>\n\n<p style=\"background:#fff7ed;border-left:4px solid #d97706;padding:16px 20px;margin:16px 0;font-size:15px;line-height:1.9;color:#7c2d12;\">不要虚构字段名，以 CRM 实际 schema 为准；每个引用的值都要能链回原记录；用户没让你改的东西，展示出来让他自己决定。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这类规则比流程重要。流程决定它做得好不好，规则决定它会不会闯祸。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>装起来：两行命令<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">两个入口。用 Cowork（Anthropic 的桌面端）的，直接在 claude.com/plugins 里点安装。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">用 Claude Code 的，两行：</p>\n\n<p style=\"background:#f7f4f0;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1c1917;line-height:2;\">claude plugin marketplace add anthropics/knowledge-work-plugins<br/>claude plugin install sales@knowledge-work-plugins</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第一行是加市场（把仓库索引拉下来），第二行才装具体插件。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">装完不用做任何配置，插件自动生效：skill 在该触发时触发，命令在当前会话里就能用。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">唯一需要动手的是连接器授权。首次调用某个系统时，它会让你 OAuth 登录一次。比如 productivity 插件里配了 Slack、Notion、Asana、Linear、Jira 等七八个，用到哪个授权哪个，不用全开。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这里建议一开始只装一个。装三个角色插件再加十个连接器，Claude 光在\"我该用哪个 skill\"上就会犹豫，你也会被各种权限弹窗烦到。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>11 个插件，分别管什么<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:13.5px;\">\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;background:#f7f4f0;font-weight:bold;color:#1c1917;width:26%;\">插件</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;background:#f7f4f0;font-weight:bold;color:#1c1917;\">解决的问题</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">productivity</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">任务、日历、职场记忆：少重复解释自己</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">sales</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">客户调研、电话准备、pipeline 复盘、外联草稿、竞品战卡</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">customer-support</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">工单分级、回复草稿、升级打包、把已解决的转成知识库</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">product-management</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">写 spec、排路线图、汇总调研、同步干系人</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">marketing</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">内容、campaign、品牌语气约束、竞品简报、渠道复盘</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">legal</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">合同审阅、NDA 分级、合规导航、风险判断</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">finance</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">分录、对账、报表、差异分析、月结、审计支持</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">data</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">写 SQL、统计分析、搭看板、分享前自检</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">enterprise-search</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">一个查询跨邮件、聊天、文档、wiki</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">bio-research</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">文献检索、基因组分析、靶点优先级</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#b45309;font-weight:bold;\">plugin-management</td>\n<td style=\"border:1px solid #e7e0d8;padding:9px 11px;color:#2b2b2b;\">造新插件、改现有插件，给没覆盖的角色用</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">最后那个 plugin-management 值得单说。它本身不解决业务问题，但它能帮你把\"我们公司特有的一套流程\"写成插件——这是整套东西从\"能用\"到\"好用\"的分水岭。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">另外，bio-research 是个信号。它接的是 PubMed、ChEMBL、ClinicalTrials.gov、Benchling 这类专业库，说明 Anthropic 想做的不是通用助手套壳，而是真的按行业往里钻。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>最能说明设计思路的，是 productivity<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/memory.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">两层记忆，四个文件，全部可读可改</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它的记忆分成两层，这个设计很实用。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>CLAUDE.md 是工作记忆</b>：你是谁、团队有谁、当前优先级、常用缩写。内容短，每次对话都会读。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>memory/ 是深度记忆</b>：按人、项目、术语分文件。内容长，需要时才去翻。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">为什么要分两层？因为上下文窗口是有限的预算。<b>把所有资料塞进每一次对话，等于每次都从头读一遍公司史。</b>分成两层之后，日常对话只花几百 token 的\"索引\"，真需要细节再去查具体文件。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这跟 SKILL.md 的\"渐进式披露\"是同一个思路：主文件保持精简，细节拆到 references 里按需加载。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">配套的还有两个文件。<b>TASKS.md</b> 是待办清单，Claude 读、写、照着执行；<b>dashboard.html</b> 是本地看板，跟 markdown 双向同步——你拖卡片，文件会变；你改文件，看板也会变。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">全是 markdown 和 HTML，不用数据库，不用同步服务。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这个选择的理由很实在：<b>markdown 能进 git，人也能直接改，AI 和同事看到的是同一份东西。</b>换成数据库，你就得先做一个界面，然后才是同步，然后是权限——一个任务管理插件会长成一个内部系统。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>真正值钱的是改，不是装<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">README 里有一句话说得挺直白：这些插件只是通用的起点，真正有用是在你按公司实际情况改过之后。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>一、换连接器。</b>改 <code style=\"background:#f7f2ec;padding:1px 5px;border-radius:3px;font-size:14px;\">.mcp.json</code>，把 Salesforce 换成你们自建的 CRM，把 Notion 换成本地 wiki。这一步是接线。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>二、灌公司语境。</b>把内部术语、组织架构、审批流程写进 skill 文件。同事说\"走一下 T2 流程\"，AI 得知道 T2 是什么、找谁签、卡在哪一步。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>三、改流程。</b>把教材里的标准做法，换成你们团队实际的做法。哪怕你们的做法\"不规范\"——AI 该学的是你们真实的流程，不是教科书。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>四、造新的。</b>用 plugin-management 插件，把没被覆盖的岗位写成新插件。市场准入、供应链、招聘，都是空白。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这四步里，第一步是技术活，后面三步是业务活。而后面三步才是决定成败的部分。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">一个团队如果只是装完就用，得到的回答会\"很专业但很通用\"；把术语和流程灌进去之后，才能得到\"这就是我们公司那个人说的话\"。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>三个要提前想清楚的问题<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>权限不在插件里，在连接器里。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">SKILL.md 里那句规则写得很明确：权限归各连接器自己管（每个工具可以设允许、询问、阻止），插件不额外加限制，也不替你拒绝你明确要求的事。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">意思是：<b>你给 Slack 连接器的读写权限，Claude 就能读你所有频道。</b>\"插件会不会乱来\"这个问题，答案在连接器的授权页面上，不在插件文件里。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>数据会出网。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">所有连接器都是云端 MCP，客户信息、合同、财务数据都会被送到对应服务商和模型。法务和合规如果对这一点没有明确结论，先别急着全公司推。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这也是为什么它更适合\"个人先用起来\"——一个人管好自己的授权范围，风险可控；全员铺开之前，得先把数据边界谈清楚。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>它不是自动化工具。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它不会帮你定时跑批、不会在后台盯着 pipeline 变化。每一次都是你在会话里发起，它在会话里完成。想做成自动化，得自己在外面套一层调度。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">反过来看，这也是它的安全边界：<b>所有动作都由人发起，AI 只在一次会话的生命周期里工作。</b></p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;margin:46px 0 22px;line-height:1.4;\"><span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-right:12px;\"></span>一个可以照抄的落地顺序<span style=\"display:inline-block;width:5px;height:19px;background:#b45309;vertical-align:-2px;margin-left:12px;\"></span></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">如果你打算在团队里试，我建议这个顺序：</p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>第一周</b>：一个人装 productivity，把团队人名、项目代号、常用缩写填进 CLAUDE.md。先用一周，感受\"AI 记得住上下文\"是什么体验。</p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>第二周</b>：换成你们业务最痛的那个角色（通常是销售或客服），装上对应插件，接一个最核心的系统。看它出的东西能不能直接用。</p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>第三周</b>：把上一周你觉得\"不对味\"的地方改掉。这一步最花时间，也最值钱。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>之后</b>：把改好的插件提交到团队仓库，让同事用同一份。从\"我知道怎么问\"变成\"我们都会这么问\"。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;line-height:1.7;padding:28px 0 6px;\">模型的通用能力，<br/>已经够用了。<br/>缺的是你公司那本手册。</p>\n\n<p style=\"margin:14px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这套插件最值得抄的不是那 11 个目录，而是它的组织形式：<b>把岗位知识写成文件，用 git 管理，让人和 AI 读同一份。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这件事的投入产出比，在很长一段时间里都会高于换一个更强的模型。</p>\n\n<p style=\"background:#f7f4f0;border-radius:8px;padding:16px 20px;margin:32px 0 0;font-size:14px;line-height:2;color:#2b2b2b;\">\n<b>相关链接</b><br/>\n· 仓库：github.com/anthropics/knowledge-work-plugins<br/>\n· Cowork：claude.com/product/cowork<br/>\n· 插件市场：claude.com/plugins<br/>\n· 许可：Apache-2.0\n</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->

    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
