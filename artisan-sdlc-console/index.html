<script id="post-data" type="application/json">
{
  "title": "AI 只帮你写代码就够了吗？这个控制台把 AI 铺进了研发全流程",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月13日 10:59",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">最近翻一个内部原型，看到一个挺有意思的东西。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">一个叫 <strong style=\"color:#2563eb;\">ARTISAN SDLC CONSOLE</strong> 的 AI 研发协作控制台。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">有意思在哪呢。现在市面上 AI 编程工具一堆，Cursor、Copilot、各种 Agent，全盯着「写代码」这一段使劲。但一个软件从需求到上线，中间要过多少关，干过研发的都心里有数。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\"><strong style=\"color:#2563eb;\">需求怎么拆。架构怎么定。测试怎么跑。发布怎么卡门禁。出了故障谁来兜底。</strong></p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">这些环节，AI 其实还没真正渗透进去。大部分团队还是靠人脑、靠文档、靠微信群里来回 @。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">ARTISAN 干的事，是把 AI 嵌进了 <strong>研发生命周期的六个环节</strong>，从需求澄清一直到运维观测，一整条链子串起来。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#9a8c6a;margin:46px 0 0;\">— 01 —</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">六个环节，AI 全程在场</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/dashboard-overview.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">总览驾驶舱：Sprint 24 迭代概览 + AI 研发生命周期六环节</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">打开控制台，第一眼看到的是一个 Sprint 的全貌。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">承诺点数 96 SP，已完成 65 SP，团队产能 104 SP，迭代完成度 68%。每个数字下面还挂着一句人话解释，不是冷冰冰的指标墙。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">再往下，六个环节一字排开。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#16a34a;\">需求澄清 S1</strong>。业务方口述，AI Brainstorm 追问，最后产出结构化 PRD 与验收标准。环节进度 100%，在制 0。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#16a34a;\">架构设计 S2</strong>。限界上下文划分、组件与接口契约冻结、任务自动拆解。也是 100%。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#dc2626;\">编码实现 S3</strong>。AI 结对编码、单测同步生成、人工评审后合入主干。这里在制 14，进度 74%，状态标了「阻塞」。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#f59e0b;\">测试验证 S4</strong>。AI 生成用例、测试计划执行、缺陷闭环、测试报告签发。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong style=\"color:#f59e0b;\">部署发布 S5</strong>。流水线构建、六道门禁、灰度分批、全量与回滚。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\"><strong style=\"color:#f59e0b;\">运维观测 S6</strong>。指标/日志/链路三支柱采集，AI 根因分析与自愈建议。</p>\n\n<p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:14px 18px;margin:22px 0;font-size:15px;color:#333;line-height:1.8;\">以前 AI 只在 S3 晃悠。ARTISAN 想干的，是让 S1 到 S6 每一步都有 AI 搭把手，而且六步之间的数据是通的。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#9a8c6a;margin:46px 0 0;\">— 02 —</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">从一句话需求到可点击原型</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">我最感兴趣的是「AI 原型工坊」这个模块。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/ai-prototype-workshop.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">AI 原型工坊：输入需求 ID，选保真度和目标设备，一键生成</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">流程很直白。你给一个需求 ID，比如 REQ-2404「订单查询性能达标：3000 TPS 且 P99 <...」。选保真度——低、中、高。目标设备勾上桌面 1440、平板 834、移动 390。生成模式选「全量重建」，模型挑 Claude 3.7 Sonnet。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">点一下开始生成。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">系统告诉你预计耗时 35 分 46 秒，消耗 130,900 tokens，然后 7 步生成进度回放在下面跑。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">出来的不是一张静态图，是一个 AxHub 项目号，能在多断点上点。高保真还会额外产出视觉稿与暗色变体。</p>\n\n<p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:14px 18px;margin:22px 0;font-size:15px;color:#333;line-height:1.8;\">说实话，把「需求澄清」和「原型生成」打通，比单卖一个 AI 画图工具有价值得多。因为原型直接绑定了需求 ID，后续的架构、编码、测试都能追溯到这一条线上。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#9a8c6a;margin:46px 0 0;\">— 03 —</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">项目、版本、知识库，一个都没落下</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/project-management.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">项目管理：健康分、预算偏差、人员利用率、风险条数</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">项目管理这页给我的感觉是「老板视角」。每个项目一张卡，绿黄红健康分一眼能扫完。预算偏差、人员利用率、风险条数全在上面。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">比如「支付渠道统一接入」，健康分 88，预算 545/560 万，偏差 -1.8%，6 个人利用率 82%，0 条风险。绿灯，健康。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">旁边那个「履约与售后链路建设」就黄了，健康分 63，5 个人利用率才 34%，挂着 1 条风险。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/version-management.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">版本管理：v2.3、v2.4 已发布，v3.0-rc1 候选发布中</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">版本管理更细。每个版本卡下面挂着需求数、任务数、缺陷数、特性数，还有 G1 到 G6 六道门禁的通过状态。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">v2.3 Halcyon 已发布，特性 18 个，门禁全绿。v2.4 Kestrel 把 12 个下游的自定义 JSON 协议统一换成 CloudEvents 1.0，还交付了死信队列回放工具。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">v3.0-rc1 标了「破坏性」，正在候选发布。</p>\n\n<p style=\"margin:24px 0 14px;\"><img src=\"assets/knowledge-base.png\" style=\"width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);\" /></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0 0 22px;\">企业知识库：自动归档 45%，入库成功率 85.7%</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">知识库这块我觉得是被低估的一环。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">近 30 日 20 篇文档，45% 是事件驱动自动归档的，55% 来自人工上传或存量同步。入库成功率 85.7%。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">还有检索质量指标：recall@10、MRR、答案忠实度、幻觉率、缓存命中率、平均检索时延。这些数字不是摆着好看的，它直接决定 AI 在前面五个环节里回答得靠不靠谱。</p>\n\n<p style=\"background:#f8fafc;border-left:4px solid #2563eb;padding:14px 18px;margin:22px 0;font-size:15px;color:#333;line-height:1.8;\">知识库质量不行，前面 AI 生成的 PRD、原型、代码全是空中楼阁。ARTISAN 把这块单独拎出来做指标，算是想明白了。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#9a8c6a;margin:46px 0 0;\">— 04 —</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">几个让我觉得「对路」的细节</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">原型里有几个小地方，能看出设计者是真干过研发的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong>管理者视角开关。</strong> 右上角一个按钮，切完之后同一套数据换成管理者关心的维度。这个细节不大，但很多同类产品懒得做。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong>在制数和健康状态。</strong> 每个环节卡片上都标了「在制 X」和健康/风险/阻塞。不是只给个进度条，而是告诉你这一步卡在哪、有没有人在处理。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\"><strong>分配给我的待办。</strong> 发布、缺陷、阻塞、门禁、评审，按类型分 tab，每条都带优先级 P0/P1 和截止时间。研发最怕的不是活多，是不知道先干啥。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\"><strong>模型调用可观测。</strong> 近 7 日 18,420 次模型调用，GPT-5 单模型采纳率最高 88.3%，私有化 Llama-3 70B 最低 71.5%。Sonnet 独占成本 67.3%，私有化模型仅 2.4%。这些数字直接关系到钱花在哪了。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:5px;color:#9a8c6a;margin:46px 0 0;\">— 05 —</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">最后说点实在的</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">我看完这个原型的感受是，AI 编程工具的下半场，可能不在「写代码写得更快」。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">代码只是研发链条上的一环。需求模糊、架构扯皮、测试覆盖不全、发布卡门禁、线上故障没人背锅——这些才是团队每天真正头疼的事。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">ARTISAN 把 AI 铺到六个环节，让数据从需求一路流到运维，中间不落地、不掉线。这个方向我觉得是对的。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 18px;\">当然，原型毕竟是原型。真正落地的时候，多模型调度的成本、自动归档的准确率、六道门禁能不能真拦住问题，都还得靠时间验证。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.85;margin:0 0 26px;\">但至少它问对了问题。</p>\n\n<p style=\"font-size:16px;color:#2563eb;font-weight:bold;text-align:center;margin:30px 0 10px;\">AI 不该只在编辑器里帮你补全代码。</p>\n<p style=\"font-size:16px;color:#2563eb;font-weight:bold;text-align:center;margin:0 0 26px;\">它该在整个研发流程里，帮你把事办成。</p>\n\n<p style=\"font-size:14px;color:#888;text-align:center;margin:36px 0 0;line-height:1.8;\">—— ARTISAN SDLC CONSOLE<br />让 AI 贯穿研发生命周期的每一个环节</p>\n\n<p style=\"margin:36px 0 14px;text-align:center;\"><a href=\"https://algebrafly.github.io/ai-sdlc-console-prototypes/ai-sdlc-console/\" style=\"display:inline-block;background:#2563eb;color:#fff;font-size:15px;font-weight:bold;padding:12px 32px;border-radius:8px;text-decoration:none;\">👉 点击体验 ARTISAN 原型</a></p>\n<p style=\"font-size:13px;color:#888;text-align:center;margin:0;line-height:1.7;\">原型地址：<br />https://algebrafly.github.io/ai-sdlc-console-prototypes/ai-sdlc-console/</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
