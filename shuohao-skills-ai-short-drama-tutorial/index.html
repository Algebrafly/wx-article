<script id="post-data" type="application/json">
{
  "title": "AI 短剧不踩坑：用 shuohao-skills 跑通全流程（附 50+ 道质量门详解）",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月13日 09:48",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">我最近在啃一套开源工具，叫 <strong>shuohao-skills</strong>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它是给 AI 短剧（包括漫剧）做**全流程生产**的 skill 集合——从一本小说，到直接丢给视频生成管线的分镜提示词包，七个环节全部覆盖。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">最值钱的不是提示词模板，是 <span style=\"color:#0a84ff;font-weight:bold;\">50+ 道确定性质量门</span>：大纲 14 道、剧本 10 道、分镜 18 道，全部由 Node.js 脚本执行，不靠 AI 自觉。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">零依赖、零 API key、Apache 2.0 开源。只要 Node ≥ 18 和一个能读 SKILL.md 的 Agent（Claude Code、Codex、Trae 都行）。</p>\n\n<p style=\"margin:0 0 40px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这篇是完整使用教程——我实际跑通后的经验整理，不是 README 翻译。</p>\n\n<!-- 章节 01 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">环境准备</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">先列清楚前置条件，免得装到一半报错。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>必需的：</strong></p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· Node.js ≥ 18（只用标准库，不用 npm install）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 一个能读 SKILL.md 的 Agent（Claude Code、Codex、Trae 都兼容）</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 模型额度（用当前会话的，不需要额外 API key）</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>唯一例外：</strong>只有 character-refs（真出角色参考图的 skill）需要出图模型，四选一：ComfyUI（Qwen Image）、codex 内置出图、OpenAI Images API、自定义命令。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">安装就是三行命令：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\ngit clone https://github.com/eternityspring/shuohao-skills.git<br/>\ncd shuohao-skills<br/>\n./scripts/install.sh\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">安装脚本会自动检测 Claude Code 和 Codex，创建软链接——之后 git pull 立刻生效，不用重装。只装某一个 skill 也行：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\n./scripts/install.sh novel-outline &nbsp;&nbsp;// 只装大纲 skill<br/>\n./scripts/install.sh --uninstall &nbsp;&nbsp;// 取消软链\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">国内直连 GitHub 不通的话，走 gh-proxy.com 镜像下载压缩包即可。</p>\n\n<!-- 章节 02 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">7 个 Skill + 完整流水线</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">整个流水线分成 <strong>六个制作阶段 + 一个独立出图 skill</strong>：</p>\n\n<p style=\"background:#fafafa;border-left:4px solid #0a84ff;padding:16px 20px;margin:16px 0;font-size:15px;line-height:2;color:#2b2b2b;\">\n小说原文 → <strong>novel-outline（改编大纲）</strong><br/>\n&nbsp;&nbsp;&nbsp;&nbsp;→ <strong>novel-characters（角色设定）</strong> + <strong>novel-art（美术设定）</strong> + <strong>novel-script（剧本）</strong><br/>\n&nbsp;&nbsp;&nbsp;&nbsp;→ <strong>novel-staging（开场站位）</strong><br/>\n&nbsp;&nbsp;&nbsp;&nbsp;→ <strong>novel-storyboard（分镜）</strong><br/>\n&nbsp;&nbsp;&nbsp;&nbsp;→ 视频投产包（可直接喂给 H3、Seedance 等视频模型）\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>character-refs</strong> 可以独立用——它是唯一真出图的 skill，给任何故事的角色出参考图，不依赖小说原文。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">五个核心 skill 的接力关系：</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:15px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">Skill</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">产出 JSON</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">回答什么问题</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-outline</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-family:Menlo,monospace;font-size:13px;\">outline.json</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">什么结构、多少集</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-characters</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-family:Menlo,monospace;font-size:13px;\">cast.json</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">谁、长什么样</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-art</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-family:Menlo,monospace;font-size:13px;\">art.json</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">哪里、什么场景</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-script</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-family:Menlo,monospace;font-size:13px;\">script.json</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">演什么戏、节拍台词</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-storyboard</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-family:Menlo,monospace;font-size:13px;\">storyboard.json</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">怎么拍、镜头提示词</td>\n</tr>\n</table>\n\n<p style=\"margin:20px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">五份 JSON 各自独立可跑，改完喂回各自的 validate/render，互不干扰。</p>\n\n<!-- 章节 03 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">逐环节使用教程</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">下面按实际跑的顺序讲。每个环节我只讲**最关键的触发指令、输入输出、质量门怎么跑**——完整细节看 SKILL.md。</p>\n\n<!-- 子章节 大纲 -->\n<p style=\"font-size:18px;font-weight:bold;color:#1a1a1a;margin:30px 0 16px;border-bottom:2px solid #0a84ff;padding-bottom:8px;\">▎ 第一步：novel-outline · 改编大纲</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>触发指令（跟 Agent 说）：</strong></p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\n把这本《XXX》改编成 30 集 × 2 分钟的短剧大纲，题材是都市逆袭\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Agent 会按 SKILL.md 的 Step 0 到 Step 7 执行，自动跑 14 道质量门校验。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>14 道质量门（脚本自动检查）：</strong></p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 主角组 1–5 人、重要配角 ≤ 10、功能性角色 ≤ 10</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 主场景不超上限（随集数动态，60 集 → 10 个）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 叙事道具 ≤ 8 件</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <span style=\"color:#ff3b30;font-weight:bold;\">爽点间隔 ≤ 3 集无真空</span></p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 第 1 集有钩子、大爆点不压最后一集</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 三人同框必须有拆解方案</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 所有引用完整、无失业角色、无空转场景</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 梗概是叙述体，出现对白直接拦</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>实测踩坑：</strong>爽点间隔那个门是真拦得住——我第一次写的大纲 7 集连续憋屈，validate 直接报错。按\"当众、当场、当脸打脸\"重写后，爽感达标集数从 6 集拉到 20 集。\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>体检模式（贴已有大纲进来诊断）：</strong></p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\nnode skills/novel-outline/scripts/novel-outline.mjs checkup outline.json\n</p>\n\n<!-- 子章节 character-refs -->\n<p style=\"font-size:18px;font-weight:bold;color:#1a1a1a;margin:30px 0 16px;border-bottom:2px solid #0a84ff;padding-bottom:8px;\">▎ 第二步：character-refs · 真出角色参考图</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这是仓库里<strong>唯一真出图的 skill</strong>。其余 skill 只交提示词，因为出图那一刻才能决定模型和画风。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>核心机制：一张锚点，全组参考</strong>——先出正面全身锚点（文生图），大头照、90° 侧面、背面、细节图都只参考这张锚点，互不参考，所以任何一张出坏了单独重出就行，不会连锁。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>前置配置（第一次用，一次搞定）：</strong></p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\nnode skills/character-refs/scripts/character-refs.mjs config --show<br/>\nnode skills/character-refs/scripts/character-refs.mjs config --model codex --confirm-anchor yes\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">四个模型选项：</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>qwen</strong>（ComfyUI，每张 25–45 秒，不吃订阅额度）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>codex</strong>（GPT 内置，吃订阅额度，每张 80–160 秒）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>openai</strong>（GPT Image 2，按量计费）</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>custom</strong>（自己写的出图命令）</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>触发指令：</strong></p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\n给我出一个 28 岁都市职场女性的角色参考图，黑长直、白色职业装、带金丝眼镜\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>出图分档：</strong></p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>Tier 1</strong>：只有正面全身锚点</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>Tier 2（默认）</strong>：正面全身 + 大头照 + 90° 侧面 + 背面</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>Tier 3</strong>：再加细节图（头发、领口、袖口、鞋，最多 8 张）</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>Tier 4</strong>：45° 大头照（默认不出）</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>实测踩坑：</strong>只给正面全身，服装和背影都对，但脸会走样。加一张大头照，脸最接近。锚点是全组的根，强烈建议配置\"锚点确认 = yes\"，出完锚点先停，人看过再继续。\n</p>\n\n<!-- 子章节 分镜 -->\n<p style=\"font-size:18px;font-weight:bold;color:#1a1a1a;margin:30px 0 16px;border-bottom:2px solid #0a84ff;padding-bottom:8px;\">▎ 第三步：novel-storyboard · 出分镜 + 投产包</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">分镜是管线里第一个直接面对视频模型的层。<strong>核心规则：镜头是生成的，多切一镜成本几乎为零</strong>，所以上限只有一个——视频模型单段生成的时长（默认 15 秒）。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>三层结构：</strong></p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>段</strong>（一次视频生成，≤ 15 秒，不跨场）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>分镜</strong>（段内 2–5 秒的剪切，认领剧本节拍）</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <strong>分镜图</strong>（每切一张关键帧，主分镜图钉 0.00 秒，子分镜图钉切点时刻）</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>关键机制：镜头认领节拍</strong>——每个镜头声明它覆盖剧本某场的哪几个连续节拍，镜头不许跨场次。剧本改了重跑 validate，失效的镜头当场点名。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>18 道质量门（部分）：</strong></p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 节拍全覆盖（恰好一次、按顺序、连续）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 段 0 < 总秒 ≤ 15，<span style=\"color:#ff3b30;font-weight:bold;\">每切 2–5 秒</span></p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 台词装得进分镜（逐镜检查，不是拍脑袋）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 每集总时长在剧本目标 ±15% 内</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <span style=\"color:#ff3b30;font-weight:bold;\">视频提示词不含角色名</span>（用 C01、S01 代替）</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· H3 对齐指令由分镜结构推导，逐字对账</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 认领台词逐字进 `<d>[Chinese] ...</d>` 块</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>export 一键出投产包：</strong></p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\nnode skills/novel-storyboard/scripts/novel-storyboard.mjs export storyboard.json --frames ./storyboard &nbsp;&nbsp;// H3 投产包<br/>\nnode skills/novel-storyboard/scripts/novel-storyboard.mjs export storyboard.json --protocol seedance &nbsp;&nbsp;// Seedance 投产包\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">产出是 `manifest.json` + `E01-01/`、`E01-02/` 每段一个文件夹，里面有 prompt.md（完整视频提示词）和 f1..fN.png（分镜图，下游出完放进来）。</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>实测踩坑：</strong>把段文件夹塞进 `segments/` 目录，报告里的图全变成\"未生成\"占位。分镜报告里的图走相对路径 `<段号>/f<切序>.png`，段文件夹必须跟报告 HTML 同级。\n</p>\n\n<!-- 章节 04 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">质量门：为什么它是整套工具的核心</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">shuohao-skills 和市面上其他 prompt 模板最大的区别——</p>\n\n<p style=\"margin:0 0 16px;font-size:24px;font-weight:bold;color:#0a84ff;text-align:center;line-height:1.6;padding:20px 0;\"><strong>50+ 道质量门，全部由代码执行，不靠 AI 自觉。</strong></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">AI 写东西天生凑活——大纲爽点间隔 5 集也敢交、分镜切 7 秒也不提醒、台词塞进镜头超时没反应。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">shuohao-skills 的做法是：模型写完 → Node.js 脚本跑 validate → 过了才往下走，没过逐条报错、改完重跑。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><strong>质量门分布：</strong></p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:15px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">Skill</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">质量门数量</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">自测断言数</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-outline</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#ff3b30;font-weight:bold;\">14 道</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">249</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-characters</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-weight:bold;\">—</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">—</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-art</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-weight:bold;\">10 道</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">—</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-script</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#0a84ff;font-weight:bold;\">10 道</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">—</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">novel-storyboard</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#ff3b30;font-weight:bold;\">18 道</td>\n<td style=\"border:1px solid #e5e5ea;padding:12px 14px;color:#2b2b2b;\">336</td>\n</tr>\n</table>\n\n<p style=\"margin:16px 0 0;font-size:14px;line-height:1.8;color:#8e8e93;\">* novel-characters、novel-staging、character-refs 各自有质量门，详细数量见对应 SKILL.md。</p>\n\n<p style=\"margin:20px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">每道门都有<strong>击穿用例</strong>——novel-outline 的 14 道门对应 249 个自测断言，novel-storyboard 的 18 道门对应 336 个断言。跑一遍就知道它真的会拦。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">改完脚本先跑自测：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\nfor f in skills/*/scripts/selftest.mjs; do node \"$f\"; done\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">跑一次 1 秒，不调模型、不花额度。比等 CI 快得多。</p>\n\n<!-- 章节 05 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">工作目录约定 + 五个报告合成</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">跑完整流水线后会产出大量 JSON、MD、HTML——别平铺在根目录，按六个 skill 各建一个目录归档：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.8;\">\n&lt;demo&gt;/<br/>\n├── outline/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← novel-outline 产出<br/>\n├── characters/ &nbsp;← novel-characters 产出<br/>\n├── art/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← novel-art 产出<br/>\n├── script/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← novel-script 产出<br/>\n├── staging/ &nbsp;&nbsp;&nbsp;&nbsp;← novel-staging 产出<br/>\n├── storyboard/ &nbsp;← novel-storyboard 产出 + 投产包<br/>\n├── docs/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 自己写的使用说明、PR 草稿<br/>\n└── scripts/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 跑管线的辅助脚本\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">想把五个阶段的报告合成一张单页（左侧导航切换，支持数字键 1–5 切面板，Cmd+F 全局搜索）：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:14px;color:#1d1d1f;line-height:1.8;\">\nnode scripts/report.mjs --from &lt;demo目录&gt; --out report.html\n</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它是组装器，不侵入任何 skill——调各自的 render 拿产物再拼装，处理了样式串味、脚本串味、图片路径三个坑。</p>\n\n<!-- 章节 06 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">实测踩坑合集（每条值回票价）</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这些坑不是 shuohao-skills 文档里写的，是我和其他跑过的人实际踩出来的。</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>① AI 画面写字必乱码。</strong>招牌、传单、投屏、弹幕全部留空后期贴字。AI 写字 10 次 9 次乱码，这是行业共识。\n</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>② 语速快是台词密度问题不是配音问题。</strong>4.5 字/秒是硬上限，超了拆镜不砍字。一个字不用砍，只需重新分秒拆镜。\n</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>③ 角色锚点句换一个字就换脸。</strong>锚点确认过的正面全身图，之后所有派生图都只参考这一张。锚点改了，派生图全部标过期。\n</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>④ 爽点间隔超过 3 集观众就划走。</strong>大纲质量门拦得住，剧本改之前也建议自己扫一眼。连续憋屈超过 1 集就不行。\n</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>⑤ 段文件夹别多套一层目录。</strong>分镜报告里的图走相对路径 &lt;段号&gt;/f&lt;切序&gt;.png，段文件夹必须跟报告 HTML 同级，多套一层报告不会报错，但图全变成\"未生成\"占位。\n</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>⑥ GitHub 直连不通。</strong>走 gh-proxy.com 镜像下载压缩包，或者用 curl 的代理。\n</p>\n\n<p style=\"background:#fff3e0;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;line-height:1.8;color:#e65100;\">\n<strong>⑦ 国产短剧建议用 Tier 3 细节图。</strong>只给正脸大头照不够——领口、发饰、袖口、鞋这些细节，才是让同一个角色在不同镜头里认出来的关键。\n</p>\n\n<!-- 章节 07 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">总结</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">shuohao-skills 的价值，我觉得不是\"AI 做短剧\"——那市面上一大堆。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它真正解决的问题是：<span style=\"color:#0a84ff;font-weight:bold;\">AI 天生凑活，人类没精力逐镜盯质量。</span></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">50+ 道质量门把\"逐镜盯\"这件事自动化了——模型写完 → 代码校验 → 过了才往下走，没过逐条报错。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">七块 JSON 接力、各自独立可跑、改完喂回 validate——这是一条可以**批量生产 AI 短剧**的管线，不是单部剧的 prompt 模板。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">零依赖、零 API key、Apache 2.0 开源。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">如果你也在折腾 AI 短剧，去试试。</p>\n\n<!-- 资源链接 -->\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:40px 0 0;font-size:15px;line-height:2;color:#2b2b2b;\">\n<strong>相关链接：</strong><br/>\n· GitHub 仓库：github.com/eternityspring/shuohao-skills<br/>\n· 项目作者（微信 hao_dev，备注 github）<br/>\n· 付费交流群 ReelBench AI 视频工作台<br/>\n· APIMart 低价 AI 图片/视频生成 API\n</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
