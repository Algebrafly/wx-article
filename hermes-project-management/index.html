<script id="post-data" type="application/json">
{
  "title": "把项目经理拆成三层来配：Hermes 与十大管理领域",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月9日 09:28",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">项目管理有十大领域。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">范围、进度、成本、质量、资源、沟通、风险、采购、干系人，再加上把它们串起来的整合管理。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">任何一个考过证的人都背得出来。但真到了项目上，这十个词往往变成了十份文档：范围说明书、进度计划、成本基线、质量检查表、风险登记册……做完放进共享盘，再也没人打开。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">不是这些文档没价值，是维护它们的成本太高。项目一忙，第一件被砍掉的事就是「更新管理文档」。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1f2430;line-height:1.6;margin:34px 0 34px;\">十大领域不是十份文档，是十个问题。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">这篇想聊的是：如果把 Hermes 当成一个项目经理来配，配好一个 ai-pm 的 Profile、一份 SOUL 人设、一套 project-manager 技能，让它每天主动回答这十个问题，并把答案按固定格式发到项目群里，会发生什么。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">先说明白：这一篇只搭骨架。十大领域每一个都值得单独展开，后面会一个一个写。今天要解决的是三件事——<span style=\"color:#4f46e5;font-weight:bold;\">怎么分职责、怎么接数据、怎么把结果讲成人话</span>。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #4f46e5;color:#4f46e5;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #db2777;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 26px;\">三层结构：人设、技能、Profile</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">很多人第一反应是写一段很长的提示词：「你是一位有 10 年经验的高级项目经理，负责范围管理、进度管理……」。写完一测，感觉还行，用一周就发现不对。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">因为一件事塞进一段话里，三样东西被混在了一起：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#4f46e5;font-weight:bold;\">它怎么想</span> 面对冲突的需求，优先保哪个</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#db2777;font-weight:bold;\">它怎么做</span> 拉哪张表、算什么、按什么模板输出</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#0891b2;font-weight:bold;\">它能做什么</span> 能碰哪些项目、能发到哪些群</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这三件事的变更频率完全不同。判断标准几个月才调一次，查询模板每周都在改，权限几乎不动。混在一起，改一处就全乱。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">所以要拆成三层：<span style=\"color:#4f46e5;font-weight:bold;\">SOUL.md 管怎么想，Skill 管怎么做，Profile 管能不能做。</span></p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这个拆法还有个隐性好处：<span style=\"color:#4f46e5;font-weight:bold;\">同一份人设可以挂到不同的 Profile 上</span>。测试项目的 PM、交付项目的 PM、内部平台的项目经理，判断标准是共通的，能访问的项目和群不一样。一份 SOUL，三个 Profile，不用复制三遍。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/framework.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 1 · 人设定判断，技能定动作，Profile 定权限</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #db2777;color:#db2777;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #0891b2;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#db2777;margin:18px 0 26px;\">SOUL.md：人设写的是判断，不是简历</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">先看一个反例。「你是一位有 15 年经验的资深项目经理，精通 PMP，擅长跨部门沟通，有很强的责任心。」</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这段话没有任何约束力。它描述的是一个期望形象，不是一个行为准则。真要它判断某事，它还是按模型的默认倾向来。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">有用的人设要写三样东西：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#db2777;font-weight:bold;\">第一，判断标准。</span>遇到取舍时按什么排序。这个必须写成有序的规则，不能写成「综合考虑」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#db2777;font-weight:bold;\">第二，表达方式。</span>先给结论还是先给分析，数字要不要带单位，用不用敬语。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#db2777;font-weight:bold;\">第三，禁止事项。</span>什么话不能说，什么事不能替人决定。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">第三点最容易被忽略，但其实最关键。<span style=\"color:#db2777;font-weight:bold;\">一个不写「不许做什么」的人设，等于给了 AI 无限授权。</span>它会在群里替你做范围承诺，会点名批评某个同事，会用「我建议关注一下」这种谁都不会行动的话打发你。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">还有一句要写进去：<span style=\"color:#db2777;font-weight:bold;\">不确定的事标「待确认」，不猜。</span>PM 最怕的不是不知道，是不知道却装作知道。模型有这个倾向，因为「给出答案」比「承认不确定」看起来更专业。人设里必须明确禁止。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0891b2;color:#0891b2;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0891b2;margin:18px 0 26px;\">十大领域：十个提问角度</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是本文的核心视图。十大领域听起来像十套方法论，实际落地时，它们只是十个提问角度，共用一份数据底座。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#4f46e5;font-weight:bold;\">整合管理</span> 这周该先推哪件事。它不是某个具体动作，而是把所有信息合到一起做取舍。输出通常是一句话排序加两条理由。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0891b2;font-weight:bold;\">范围管理</span> 哪些在范围内，哪些是镀金。靠对比需求单和 PRD 基线，识别「本周新增但没走变更流程」的需求。这是最容易失控的一个领域。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">进度管理</span> 关键路径有没有被拖。只看两件事：关键路径剩余天数，和浮动时间被消耗的速度。别去看甘特图好不好看。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#db2777;font-weight:bold;\">成本管理</span> 预算烧到哪一步了。人日是最直观的度量，比金额更早暴露问题。超支 8% 的时候还有救，等到 30% 就只能砍范围。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#059669;font-weight:bold;\">质量管理</span> 缺陷密度和返工率在恶化吗。看趋势不看绝对值——每周 5 个缺陷可能正常，从 2 涨到 8 就是信号。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#4f46e5;font-weight:bold;\">资源管理</span> 谁满负荷，谁在空转。工时数据能直接回答，但要小心「填了 8 小时不代表干了 8 小时」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0891b2;font-weight:bold;\">沟通管理</span> 该通知的人通知到了吗。检查关键决策有没有落到该落的群，有没有约到该约的人。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">风险管理</span> 哪三个风险最可能爆。风险登记册往往写完就冻结，真正有用的是每周重排一次概率和影响。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#db2777;font-weight:bold;\">采购管理</span> 合同和验收节点是否对齐。付款节点和交付节点错位，是很多项目现金流出问题的根源。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#059669;font-weight:bold;\">干系人管理</span> 谁的支持在减弱。这个最难量化，但可以从会议出席率、变更请求频次、回复时长的变化里看出端倪。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">注意看这十条的共同点：它们全都在回答「现在怎么样，接下来干什么」。没有一条是「请生成一份 XX 文档」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这就是这套东西和传统项目管理的根本差别。传统做法是<span style=\"color:#b45309;font-weight:bold;\">先产出文档，再从文档里提取结论</span>；这里是<span style=\"color:#b45309;font-weight:bold;\">直接从数据里给结论，文档只是留痕</span>。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/domains.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 2 · 十个领域各回答一个问题，共用一份数据底座</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #b45309;color:#b45309;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #059669;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b45309;margin:18px 0 26px;\">数据底座：四个源，覆盖十个领域</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">十个领域听起来要接十套数据，其实只有四个源。想清楚这四路怎么接，剩下都是 SQL 和模板的事。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#4f46e5;font-weight:bold;\">第一路，项目平台。</span>禅道、Jira、PingCode、云效。任务是进度和范围的来源，缺陷是质量的来源，迭代是节奏的来源。这一路覆盖了十个领域里的六个。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0891b2;font-weight:bold;\">第二路，代码仓库。</span>GitLab、云效 Codeup。提交频率反映真实进度，MR 评审时长反映协作效率，代码变更范围反映范围蔓延。任务状态可以造假，提交记录很难。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">第三路，工时与财务。</span>工时系统、采购合同、付款节点。成本和采购两个领域全靠这一路。没有工时数据，成本管理只能靠估。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#059669;font-weight:bold;\">第四路，IM 与会议。</span>企微群、飞书群、会议纪要。沟通和干系人管理靠这一路，风险管理的一部分也在这里——群里反复被提起但没进台账的事，往往才是真风险。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">四路数据的质量差别很大。项目平台最规范但最容易失真（状态随手改），代码仓库最真实但看不懂业务，工时最主观，IM 最鲜活但最杂乱。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">所以有个原则：<span style=\"color:#b45309;font-weight:bold;\">关键结论至少要有两个源交叉验证</span>。任务说完成了，看提交；提交有了，看部署；部署了，看验收。单源结论一律标「待确认」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">数据权限也要提前想。项目平台用只读 API token，代码仓库用只读 deploy key，工时系统走数据视图，IM 只读指定群。这四路一个都不能给写权限。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #059669;color:#059669;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #4f46e5;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#059669;margin:18px 0 26px;\">输出：群里发的不是报表，是结论</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是整件事最容易做废的一环。生成一份二十页的项目周报，格式完美，没人看。生成一张漂亮的甘特图，大家点个赞，然后继续问「所以现在到底什么情况」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">群消息的读者是在地铁上、在会议间隙、在客户现场看这行字的。他需要的不是全面，是<span style=\"color:#059669;font-weight:bold;\">能在十五秒内做决定</span>。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">三段式，够用：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#059669;font-weight:bold;\">第一段，一句判断。</span>四十字以内，说清好坏和主因。「进度可控，但成本超支 8%，主因是退款模块两次返工」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#059669;font-weight:bold;\">第二段，三条事实。</span>从十个领域里挑出本周最关键的三条，每条带数字带口径。不要平均用力——十个领域各写一条，等于什么都没说。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#059669;font-weight:bold;\">第三段，一个请求。</span>明确写需要谁、在什么时候、做什么决定。没有请求的汇报等于没汇报。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">四条铁律，写进模板里：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· 一句话结论，不超过四十字</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· 数字必须带口径，写「108 人日 / 预算 100 人日」，不写「成本偏高」</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· 风险必须带动作，写「需要借 1 个前端」，不写「存在资源风险」</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· 全文控制在一千五百字内，超了就把细节放链接</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">企微 markdown 消息上限 4096 字节，飞书富文本宽一些但也别滥用。超长的消息会被截断，而截断的周报比没发更糟糕——因为它看起来像发完了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">还有一个细节：<span style=\"color:#059669;font-weight:bold;\">发群和发个人要分开</span>。个人看的版本可以带排序、带优先级、带「今天最该拒绝的一件事」；群里的版本只留对团队有意义的部分。把个人的待办清单刷到项目群，是一种噪音。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/output.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 3 · 三段式周报，加四条格式铁律</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #4f46e5;color:#4f46e5;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #db2777;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#4f46e5;margin:18px 0 26px;\">配置：四个文件，三个动作</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">整套东西落到磁盘上只有四个文件，全部可以进 Git，全部可以 review。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">Profile 里写死三件事：挂哪个模型、接哪些 MCP、能访问哪些项目和群。这一层是硬边界，不靠提示词约束。</p>\n\n<p style=\"background:#12101a;color:#e6e0ea;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/profiles/ai-pm.yaml<br/>\nname: ai-pm<br/>\nmodel: default<br/>\nsoul: pm.SOUL.md<br/>\nskills: [project-manager]<br/>\nmcp:<br/>\n&nbsp;&nbsp;- zentao&nbsp;&nbsp;&nbsp;&nbsp;# 只读 token<br/>\n&nbsp;&nbsp;- jira&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 只读 token<br/>\n&nbsp;&nbsp;- pingcode<br/>\n&nbsp;&nbsp;- gitlab&nbsp;&nbsp;&nbsp;&nbsp;# 只读 deploy key<br/>\nscope:<br/>\n&nbsp;&nbsp;projects: [pay-platform, order-center]<br/>\n&nbsp;&nbsp;groups: [pay-project, pay-ops]<br/>\n&nbsp;&nbsp;allow_write: false&nbsp;&nbsp;# 只读，不允许改平台状态\n</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">Skill 里放的是「怎么做」：每个领域一个查询模板、一个判定规则、一个输出片段。十个领域不是一个巨大的技能文件，是十个独立的模板段，按需加载。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">三个动作值得先做，性价比最高：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#4f46e5;font-weight:bold;\">晨间巡检。</span>每天早上七点半跑一次，只看三件事：今天到期的任务、昨天新增的阻塞、风险台账里概率上升的项。有异常才推到群里，没异常就静默。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#db2777;font-weight:bold;\">周报生成。</span>每周五下午五点跑，覆盖全部十个领域，按三段式压缩成一条消息。同时生成一份完整版 HTML 存到网盘，消息里放链接。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#0891b2;font-weight:bold;\">按需提问。</span>任何时候在群里问「退款模块现在什么进度」，它当场查、当场答。这条比前两个都重要——因为它决定了大家会不会真的用。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">晨间巡检的静默机制是设计重点。<span style=\"color:#4f46e5;font-weight:bold;\">天天推「一切正常」，三周后这个群就会被静音。</span>只在有异常时说话，才能保证它说话时有人看。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/config.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 4 · 四个文件：Profile / SOUL / Skill / cron</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #db2777;color:#db2777;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#db2777;margin:18px 0 26px;\">落地路线：先跑一个领域</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">别一开始就上十个领域。十个领域一起上，结果一定是每个都做得半生不熟，群里收到的周报长到没人看完。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">建议这么走：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#b45309;font-weight:bold;\">第一周</span> 只做进度管理。就回答一个问题：这周能不能按时交付。数据只接项目平台一路。输出只发私聊，不发群。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#b45309;font-weight:bold;\">第二到三周</span> 加范围管理和风险管理。这两个领域最容易被投诉——「你说的新增需求，我明明走过变更了」。把误报率压到可接受，再往下走。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#b45309;font-weight:bold;\">第四周</span> 开始发群。先发给最熟悉这个项目的那个群，让他们挑毛病。挑出来的每一条都写进 SOUL 或模板里。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#b45309;font-weight:bold;\">第二个月</span> 补齐十个领域，加成本和质量。这两个需要工时数据，通常要单独找财务或 HR 要权限，周期长，早点启动。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">还有一个反直觉的建议：<span style=\"color:#b45309;font-weight:bold;\">先别做自动建单、自动改状态</span>。让它只读、只发消息，跑两个月。等团队真的信任它给出的判断了，再考虑让它动手。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0891b2;color:#0891b2;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #059669;\">8</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0891b2;margin:18px 0 26px;\">边界：它管不了的事</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">五条，说清楚。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#db2777;font-weight:bold;\">它不会替你跟人吵架。</span>项目里最难的部分从来不是算进度，是说服某个部门让出资源、是拒绝老板临时加的需求。这些事只能人做。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#db2777;font-weight:bold;\">它的历史判断质量取决于历史数据。</span>一个从来没认真填过工时、任务状态随手改的项目，接进来只会得到一堆看起来很专业的错话。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#db2777;font-weight:bold;\">它不懂组织政治。</span>某个需求为什么一直排不进去，某个人为什么突然不配合了，这些信息不在任何系统里。它能告诉你「这个人这两周没怎么提交」，但不知道为什么。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#db2777;font-weight:bold;\">别让它做承诺。</span>范围承诺、交付日期承诺、成本承诺，一律由人签字。AI 可以草拟、可以算、可以提示风险，但不能对外落锤。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#db2777;font-weight:bold;\">最危险的是它说得太顺。</span>一份格式完美、逻辑通顺、数字齐全的周报，会让人下意识地相信。而它可能只是把三个不可靠的数据源拼在了一起。所以每条结论后面挂来源链接，是最后的保险。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">写到这里，这篇文章的骨架就算搭完了。三层结构、十个提问角度、四路数据、一种输出格式、一条落地路线。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">接下来的系列会一个一个拆开：范围管理怎么写变更识别规则，进度管理怎么算关键路径和浮动时间，成本管理怎么和工时系统对接，风险管理怎么从群里提取没进台账的隐忧，干系人管理怎么量化「支持度在减弱」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">每一个都会给出可跑的配置、可抄的模板、以及踩过的坑。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">但无论拆到多细，有一点不会变：项目管理的核心从来不是产出文档，是<span style=\"color:#0891b2;font-weight:bold;\">在信息不完整的时候做出一个还能接受的决定</span>。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#4f46e5;line-height:1.8;margin:30px 0 10px;\">AI 能把信息补到八分，最后那两分，还是得你来。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
