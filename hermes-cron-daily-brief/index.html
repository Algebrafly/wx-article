<script id="post-data" type="application/json">
{
  "title": "Hermes 定时任务：四个研发平台的状态，每天九点自己走进项目群",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 09:24",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#e4e7ec;margin:10px 0 4px;\">四个研发平台，二十个项目</p>\n<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#818cf8;margin:0 0 30px;\">每天早上九点自己走进各自的群</p>\n\n<p style=\"font-size:16px;color:#98a2b3;line-height:1.85;margin:0 0 22px;\">先说一个很常见的早间动作：</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 打开 Jira，把 8 个项目的看板逐个翻一遍，数一数谁手上还有几个没动</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 切到禅道，另 5 个项目，状态码叫法和 Jira 完全不一样</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 再登 PingCode 和云效，剩下几个项目散在这两个地方</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 22px;\">· 凭记忆整理成一段话，挨个贴到七个项目群里</p>\n\n<p style=\"font-size:15px;color:#667085;line-height:1.85;margin:0 0 26px;\">这套动作每天吃掉 40 分钟，而且做久了必然会偷工减料——昨天推到群里的是不是复制前天改个日期，自己心里清楚。</p>\n\n<p style=\"font-size:16px;color:#e4e7ec;line-height:1.88;margin:0 0 12px;\">这篇要解决的正是这个：<span style=\"color:#fbbf24;font-weight:bold;\">让 Hermes 的定时任务在每天固定时刻，把四个平台的状态拉下来、对齐成同一套语言、按项目和人统计好、再自动推到各自的群。</span></p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 30px;\">全程零人工，只在\"有变化的时候\"才说话。</p>\n\n\n<!-- 第 1 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #818cf8;color:#818cf8;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fbbf24;\">1</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#818cf8;margin:18px 0 26px;\">概念：Hermes 的 Cron 到底是个什么东西</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">Hermes 的定时任务不是系统级的 crontab，也不是独立的调度服务，它<span style=\"color:#34d399;font-weight:bold;\">挂在 Gateway 守护进程里</span>。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">Gateway 每 <span style=\"color:#fbbf24;\">60 秒</span> tick 一次，读 <span style=\"font-family:Consolas,Menlo,monospace;color:#818cf8;\">~/.hermes/cron/jobs.json</span>，比对每个任务的 <span style=\"font-family:Consolas,Menlo,monospace;\">next_run_at</span>，把到期的任务拎出来，在<span style=\"color:#34d399;\">全新的隔离会话</span>里执行，跑完投递结果、写回下次运行时间。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\">所以它有个前提条件，很多人第一次用会踩：<span style=\"color:#fb7185;font-weight:bold;\">Gateway 必须活着</span>。`hermes gateway` 没起、或者起了但进程挂了，cron 一分钟都不会跑。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">三套时间写法，挑一种顺手的</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\"><span style=\"color:#818cf8;font-weight:bold;\">一次性</span> — `30m`、`2h`，多久之后跑一次就完事</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\"><span style=\"color:#818cf8;font-weight:bold;\">固定间隔</span> — `every 30m`，每半小时一次，不看钟点</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 22px;\"><span style=\"color:#818cf8;font-weight:bold;\">标准 cron</span> — `0 9 * * *`，每天早上九点整，跟 Linux crontab 一样的五段式</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#34d399;margin:20px 0 10px;\">两种执行模式，这是省钱的关键</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 14px;\"><span style=\"color:#34d399;font-weight:bold;\">Agent 模式</span>（默认）：起一个完整 AIAgent 会话，能调工具、能推理、能写自然语言。适合\"需要判断和归纳\"的任务。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 14px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">无 Agent 模式</span>（`--no-agent --script xxx.sh`）：直接执行脚本，把 stdout 原样当消息投递，<span style=\"color:#34d399;\">零 token、零模型调用、零 provider 回退</span>。适合\"数据搬运和格式化\"的任务。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\">我们这个场景——拉接口、算统计、拼字符串、发 webhook——<span style=\"color:#fbbf24;font-weight:bold;\">全是确定性计算，一句话都不需要 LLM 生成</span>。所以主链路走无 Agent 模式，一天跑几十次也不花一分钱。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">投递目标：一个参数决定发到哪</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 16px;word-break:break-all;\">\n--deliver local&nbsp;&nbsp;&nbsp;&nbsp;# 只存本地 ~/.hermes/cron/output/<br/>\n--deliver wecom&nbsp;&nbsp;&nbsp;&nbsp;# 企微主频道<br/>\n--deliver feishu&nbsp;&nbsp;&nbsp;&nbsp;# 飞书主频道<br/>\n--deliver wecom,feishu&nbsp;&nbsp;# 扇出到两个平台<br/>\n--deliver all&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 所有已连的主频道，触发时才解析\n</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 28px;\">注意这里只有\"主频道\"这个概念。我们后面要按项目分群推送，靠的不是 `--deliver`，而是脚本内部自己发 webhook——原因在第五章会讲清楚。</p>\n\n\n<!-- 第 2 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #fbbf24;color:#fbbf24;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #2dd4bf;\">2</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#fbbf24;margin:18px 0 26px;\">架构：为什么拆成四层</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">最容易写废的做法，是把\"拉数据 + 算统计 + 拼消息 + 发群\"全塞进一个 200 行的脚本，挂一个 cron 上。第一版能跑，第二个月就没人敢改了。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\">拆成四层的好处很朴素：<span style=\"color:#2dd4bf;font-weight:bold;\">每一层都能单独跑</span>。采集挂了不影响渲染，渲染模板想换配色不用碰接口，加个项目只改路由表一行。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/arch.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 1 · 四层架构：采集 → 归一 → 聚合渲染 → 投递</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#818cf8;font-weight:bold;\">采集层</span>：只做一件事，调四个平台的接口，把原始数据落到 <span style=\"font-family:Consolas,Menlo,monospace;\">~/.hermes/state/raw/</span>。不转换、不判断、不改名。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fbbf24;font-weight:bold;\">归一化层</span>：把四套完全不同的状态码翻译成统一枚举，输出 <span style=\"font-family:Consolas,Menlo,monospace;\">status.json</span>。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">聚合渲染层</span>：按项目分组、按人汇总、跟昨天快照做 diff，生成每个项目一段 Markdown。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#34d399;font-weight:bold;\">投递层</span>：查路由表，把每个项目的卡片 POST 到对应的群机器人 webhook。</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 28px;\">关键设计：<span style=\"color:#e4e7ec;\">采集和渲染跑两个不同频率的 cron</span>。采集每 30 分钟一次（状态会变），渲染每天早上九点一次（人只需要看一次）。中间靠 <span style=\"font-family:Consolas,Menlo,monospace;\">status.json</span> 这个文件解耦。</p>\n\n\n<!-- 第 3 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #2dd4bf;color:#2dd4bf;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fb7185;\">3</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2dd4bf;margin:18px 0 26px;\">归一：四套状态码对齐成五个枚举</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">这是整篇文章技术含量最高、也最容易做错的地方。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">四个平台对\"一个任务走到哪了\"这件事，各说各话：</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\">Jira 叫 <span style=\"color:#818cf8;\">To Do / In Progress / Done</span>；禅道叫 <span style=\"color:#fbbf24;\">wait / doing / done / pause / closed</span>；PingCode 用 <span style=\"color:#2dd4bf;\">unstarted / started / completed / closed</span>；云效用中文的 <span style=\"color:#fb7185;\">待处理 / 处理中 / 已完成 / 已关闭</span>。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/status_map.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 2 · 四平台状态码映射矩阵</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fb7185;margin:20px 0 10px;\">第一个坑：不要按状态名匹配</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">新手最常见写法是 `if status == \"Done\": ...`。这套代码上线第三天就会崩——因为公司的 Jira 管理员改了工作流，把 \"Done\" 改成 \"Resolved\"，或者加了一个 \"待验证\" 的中间态。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\">正确做法是<span style=\"color:#34d399;font-weight:bold;\">匹配平台提供的\"状态分类\"（statusCategory），而不是状态名</span>。Jira 的 statusCategory 永远是三个值：`new`、`indeterminate`、`done`，不管你们公司把列名改成什么花名。PingCode 的 `state_type`、云效的 `statusGroupIdentifier` 同理。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#34d399;margin:20px 0 10px;\">第二个坑：closed 和 done 不是一回事</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">在大多数工作流里，\"已完成\"是研发填了结果，还会被测试或 PM 验收；\"已关闭\"是验收通过或者被驳回终止。统计时有本质区别——<span style=\"color:#fbbf24;\">已完成但未关闭的，往往就是卡在验收环节的</span>，这才是需要暴露给项目群看的东西。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\">所以归一枚举设计成五个：<span style=\"font-family:Consolas,Menlo,monospace;color:#818cf8;\">todo / doing / done / closed / blocked</span>。blocked 单独拎出来，因为它才是需要人介入的状态。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">映射表写死在配置里，别藏进代码逻辑：</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/config/status_map.yaml<br/>\njira:<br/>\n&nbsp;&nbsp;new: todo<br/>\n&nbsp;&nbsp;indeterminate: doing<br/>\n&nbsp;&nbsp;done: done&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# resolution 为空才算 closed<br/>\n&nbsp;&nbsp;blocked_flag: true&nbsp;&nbsp;# 带 Blocked 标签 → blocked<br/><br/>\nzentao:<br/>\n&nbsp;&nbsp;wait: todo<br/>\n&nbsp;&nbsp;doing: doing<br/>\n&nbsp;&nbsp;done: done<br/>\n&nbsp;&nbsp;closed: closed<br/>\n&nbsp;&nbsp;pause: blocked<br/>\n&nbsp;&nbsp;cancel: closed<br/><br/>\npingcode:<br/>\n&nbsp;&nbsp;unstarted: todo<br/>\n&nbsp;&nbsp;started: doing<br/>\n&nbsp;&nbsp;completed: done<br/>\n&nbsp;&nbsp;closed: closed<br/><br/>\nyunxiao:<br/>\n&nbsp;&nbsp;待处理: todo<br/>\n&nbsp;&nbsp;处理中: doing<br/>\n&nbsp;&nbsp;已完成: done<br/>\n&nbsp;&nbsp;已关闭: closed<br/>\n&nbsp;&nbsp;已阻塞: blocked\n</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 28px;\">平台加字段、公司改工作流，只改这个 YAML 的一行，脚本一行都不用动。这才是\"能长期跑稳\"的设计。</p>\n\n\n<!-- 第 4 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #fb7185;color:#fb7185;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #34d399;\">4</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#fb7185;margin:18px 0 26px;\">聚合：按项目分组，按人统计</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">归一之后，所有数据长成一个样子了。接下来按两个维度切：<span style=\"color:#fb7185;font-weight:bold;\">项目</span>决定发给谁，<span style=\"color:#34d399;font-weight:bold;\">人</span>决定内容里写什么。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#818cf8;margin:20px 0 10px;\">统一的数据结构</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n{<br/>\n&nbsp;&nbsp;\"date\": \"2026-11-03\",<br/>\n&nbsp;&nbsp;\"projects\": [<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;{<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"key\": \"PAY\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"name\": \"支付平台\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"platform\": \"jira\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"group\": \"支付项目群\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"summary\": {<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"total\": 42, \"todo\": 11, \"doing\": 9,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"done\": 17, \"closed\": 5, \"blocked\": 0<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;},<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"members\": [<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{\"name\": \"张三\", \"doing\": 2, \"done\": 6,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"blocked\": 0, \"overdue\": 1},<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{\"name\": \"李四\", \"doing\": 3, \"done\": 5,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"blocked\": 1, \"overdue\": 0}<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;],<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"changes\": [<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{\"id\": \"PAY-3412\", \"from\": \"doing\", \"to\": \"done\"},<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{\"id\": \"PAY-3420\", \"flag\": \"overdue_2d\"}<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;}<br/>\n&nbsp;&nbsp;]<br/>\n}\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#34d399;margin:20px 0 10px;\">三个统计口径，值得单独说</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#34d399;font-weight:bold;\">① 按人统计要算\"超期\"，不只是算\"数量\"</span>。一个手上 8 个任务但全都按期的人，跟一个手上 3 个却全部超期的人，是完全不同的信号。超期口径用 <span style=\"font-family:Consolas,Menlo,monospace;\">当前时间 &gt; due_date 且 状态不是 done/closed</span>。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#34d399;font-weight:bold;\">② 未分配的人单独列出来</span>。所有项目里 `assignee` 为空的工作项，汇总成一行\"未分配 N 个\"。这一行往往是日报里最有价值的信息——没人认领的需求比 stalled 的需求更危险。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#34d399;font-weight:bold;\">③ 统计要跨平台合并同一批人</span>。张三在 Jira 叫 `zhangsan`，禅道叫 `张三`，PingCode 叫 `zhangsan@corp.com`。必须维护一张人员映射表，否则同一个人会被拆成三个\"团队\"。这是很多自动日报做不好看的核心原因。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">diff：只推有变化的项目</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">每天准时往群里推一份一模一样的日报，三周之后所有人都会屏蔽它。<span style=\"color:#fb7185;font-weight:bold;\">没人看的日报等于没发。</span></p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">所以每次渲染前先读昨天的 <span style=\"font-family:Consolas,Menlo,monospace;\">status.json</span> 快照，做一次结构 diff：</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nprev = load(~/.hermes/state/snapshot/yesterday.json)<br/>\ntoday = load(~/.hermes/state/status.json)<br/><br/>\nfor p in today.projects:<br/>\n&nbsp;&nbsp;if diff(prev[p.key], p).is_empty():<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;continue&nbsp;&nbsp;&nbsp;&nbsp;# 这个项目今天没变化，不发<br/>\n&nbsp;&nbsp;send_card(p)\n</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 28px;\">实测下来，工作日平均 20 个项目里有 6–9 个会变，剩下十来个是安静的。这一条规则直接把群里的噪音降了七成。<span style=\"color:#e4e7ec;\">周五可以破例全发一次，让大家有个完整视图。</span></p>\n\n\n<!-- 第 5 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #a78bfa;color:#a78bfa;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #818cf8;\">5</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#a78bfa;margin:18px 0 26px;\">渲染：一条卡片塞进 4096 字节</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">数据齐了，现在把它变成人能一眼看懂的一段话。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/report_card.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 3 · 群消息卡片：概览 → 按人 → 今日变更</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fb7185;margin:20px 0 10px;\">硬约束：企微 markdown 上限 4096 字节</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">企微群机器人的 markdown 消息，content 字段实测上限在 4096 字节附近，超了直接返回 <span style=\"font-family:Consolas,Menlo,monospace;color:#fb7185;\">errcode 40058</span> 或被静默截断。中文一个字占 3 字节，4096 字节大约只有 1300 个汉字。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">所以<span style=\"color:#34d399;font-weight:bold;\">一个项目一条消息</span>，绝不把多个项目拼成一条。这既是技术限制，也正好符合\"按项目分群推送\"的产品逻辑——每个群只关心自己项目，不该看到别的项目的数字。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">模板：三段式，越短越好</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n### 支付平台 · 2026-11-03<br/>\n&gt; 进行中 **9** · 已完成 **17** · 阻塞 **2** · 未分配 **3**<br/><br/>\n**按人统计**<br/>\n| 姓名 | 进行中 | 已完成 | 阻塞 | 超期 |<br/>\n| :-- | :--: | :--: | :--: | :--: |<br/>\n| 张三 | 2 | 6 | 0 | **1** |<br/>\n| 李四 | 3 | 5 | 1 | 0 |<br/>\n| 王五 | 4 | 6 | 1 | 0 |<br/><br/>\n**今日变更 3 条**<br/>\n&gt; ✅ PAY-3412 代扣重试上线 → 已完成<br/>\n&gt; ❗ PAY-3420 对账任务超期 2 天，负责人已变更<br/>\n&gt; ➕ PAY-3433 新增需求：支持分账到子商户<br/><br/>\n[查看全部](https://jira.corp.com/projects/PAY)\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\">三段的信息密度是刻意排的：</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\"><span style=\"color:#818cf8;font-weight:bold;\">第一段只放四个数</span>——三十秒扫完就知道这个项目今天健不健康。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\"><span style=\"color:#fbbf24;font-weight:bold;\">第二段把超期标粗</span>——需要单独找谁，一眼能定位。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">第三段只列变更</span>——不是列全部任务，是\"跟昨天比动了什么\"。人只关心动的东西。</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 20px;\">如果成员超过 8 个人，按人那张表会撑爆 4096 字节。这时候只列<span style=\"color:#e4e7ec;\">超期和不阻塞的前五名</span>，其余折叠成一句\"另有 12 人共 34 个任务，详见链接\"。宁可少写，也不能发出去被截断。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#34d399;margin:20px 0 10px;\">飞书的写法略有不同</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 24px;\">飞书自定义机器人支持 `msg_type: \"interactive\"` 发卡片，也可以用 `\"text\"` 发纯文本。卡片的优势是可以加按钮，但 markdown 表格在飞书卡片里不渲染——得换成 `div` + `fields` 的双列布局。为了省事，<span style=\"color:#34d399;\">同一套数据用两个模板函数</span>，别指望一份 Markdown 通吃两个平台。</p>\n\n\n<!-- 第 6 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #34d399;color:#34d399;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #a78bfa;\">6</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#34d399;margin:18px 0 26px;\">投递：路由表决定进哪个群</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">前面留了一个问题：为什么不用 `--deliver`，而是脚本里自己发 webhook？</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">因为 Hermes 的 `--deliver` 只能发到<span style=\"color:#fb7185;\">平台的\"主频道\"</span>——一个平台只能指定一个 home chat。而我们的需求是<span style=\"color:#34d399;font-weight:bold;\">二十个项目对应七个群</span>，一条任务要分头投递。内置投递目标做不到这个粒度。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/routing.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 4 · 一份 JSON，三份不同卡片，互不串台</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">解法是把投递下沉到脚本里。cron 只负责\"按时叫醒脚本\"，脚本自己决定发给谁。这时候 cron 用 <span style=\"font-family:Consolas,Menlo,monospace;color:#818cf8;\">--deliver local</span>，让它别管投递，stdout 存本地当审计日志就行。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">路由表：一个 YAML 管所有群</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/config/routes.yaml<br/>\ngroups:<br/>\n&nbsp;&nbsp;支付项目群:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;platform: wecom<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;webhook_env: WECOM_WEBHOOK_PAY<br/>\n&nbsp;&nbsp;订单项目群:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;platform: feishu<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;webhook_env: FEISHU_WEBHOOK_ORDER<br/>\n&nbsp;&nbsp;基础架构群:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;platform: wecom<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;webhook_env: WECOM_WEBHOOK_INFRA<br/><br/>\nprojects:<br/>\n&nbsp;&nbsp;PAY:&nbsp;&nbsp;支付项目群<br/>\n&nbsp;&nbsp;ORD:&nbsp;&nbsp;订单项目群<br/>\n&nbsp;&nbsp;INFRA: 基础架构群\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 14px;\">webhook 地址本身走环境变量，不进仓库——这是最基本的安全意识。地址泄露等于任何人都能往你们群里发消息。</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 24px;word-break:break-all;\">\n# ~/.hermes/.env<br/>\nWECOM_WEBHOOK_PAY=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx<br/>\nWECOM_WEBHOOK_INFRA=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=yyy<br/>\nFEISHU_WEBHOOK_ORDER=https://open.feishu.cn/open-apis/bot/v2/hook/zzz\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#34d399;margin:20px 0 10px;\">发送代码就两段</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">\ndef send_wecom(url, md):<br/>\n&nbsp;&nbsp;# 企微 webhook：markdown 消息，上限 4096 字节<br/>\n&nbsp;&nbsp;requests.post(url, json={\"msgtype\": \"markdown\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"markdown\": {\"content\": md}})<br/><br/>\ndef send_feishu(url, md):<br/>\n&nbsp;&nbsp;# 飞书自定义机器人<br/>\n&nbsp;&nbsp;requests.post(url, json={\"msg_type\": \"text\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"content\": {\"text\": md}})\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">注意企微 webhook 有个频率限制：<span style=\"color:#fbbf24;\">每个机器人每分钟最多 20 条</span>。二十个项目一次性全发会触发限流，脚本里加个 1 秒的 sleep，或者串行发、失败重试两次就够。</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 28px;\">另外，<span style=\"color:#e4e7ec;\">webhook 不需要 Hermes 的 Gateway 就连着企微</span>——它就是一个普通 HTTP 地址。这意味着渲染和投递可以在完全独立的机器上跑，只要 cron 能调起来就行。</p>\n\n\n<!-- 第 7 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #818cf8;color:#818cf8;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #34d399;\">7</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#818cf8;margin:18px 0 26px;\">配置与使用：从零到跑起来</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">第一步：确认 Gateway 活着</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nhermes gateway install&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 装成用户服务，开机自启<br/>\nhermes cron status&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 看调度器是否 alive\n</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 20px;\"><span style=\"font-family:Consolas,Menlo,monospace;\">hermes cron status</span> 会告诉你三件事：gateway 进程在不在、ticker 心跳还跳动、上一次 tick 是什么时候。这三项有任何一项异常，cron 就不会跑，先修这个再看别的。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">第二步：把三个脚本放好</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n~/.hermes/scripts/<br/>\n├── collect_status.py&nbsp;&nbsp;&nbsp;&nbsp;# 拉四平台 → raw/*.json<br/>\n├── status_normalize.py&nbsp;&nbsp;# raw → status.json<br/>\n└── render_daily.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# status.json → 分群推送\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">先手动跑一遍，确认每一步的产物对：</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\npython3 collect_status.py<br/>\npython3 status_normalize.py<br/>\ncat ~/.hermes/state/status.json | head -40<br/>\npython3 render_daily.py --dry-run&nbsp;&nbsp;# 只打印不发\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#34d399;font-weight:bold;\">`--dry-run` 这个开关一定要先加。</span>第一次就把二十条消息发到七个群，一旦模板写错了，全公司都能看见你的 bug。先 dry-run 把输出打到终端，确认排版没问题再上真发。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fb7185;margin:20px 0 10px;\">第三步：挂两个 cron</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 每 30 分钟采一次，零 token<br/>\nhermes cron create \"every 30m\" \\<br/>\n&nbsp;&nbsp;--no-agent --script collect_status.py \\<br/>\n&nbsp;&nbsp;--deliver local --name \"四平台状态采集\"<br/><br/>\n# 每天 9:00 汇总推送<br/>\nhermes cron create \"0 9 * * *\" \\<br/>\n&nbsp;&nbsp;--no-agent --script render_daily.py \\<br/>\n&nbsp;&nbsp;--deliver local --name \"每日项目简报\"\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">两个任务的 stdout 都是空的（脚本里主动发 webhook，不打日志到 stdout），所以 <span style=\"color:#34d399;\">Hermes 会认为这是\"静默 tick\"，不会额外发一条空消息</span>。这个行为刚好和我们的设计对齐。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">如果脚本非零退出或者超时，Hermes <span style=\"color:#fb7185;\">一定会投递错误告警</span>——这是看门狗模式的保护机制，坏掉的定时任务不会悄悄失败。<span style=\"font-family:Consolas,Menlo,monospace;\">--deliver local</span> 下告警进本地 output 目录，建议把这个目录也配置一个日志监控，或者在部署机上加一条告警。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">第四步：验证与排错</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nhermes cron list&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 看两个任务和下次运行时间<br/>\nhermes cron run 每日项目简报&nbsp;&nbsp;&nbsp;# 立刻触发一次，不用等到明早<br/>\nhermes cron runs 每日项目简报 --limit 20&nbsp;&nbsp;# 看执行历史\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">任务可以用名字引用，不用记十六进制 ID。执行历史记在 <span style=\"font-family:Consolas,Menlo,monospace;\">~/.hermes/cron/executions.db</span>，每次尝试会走 <span style=\"font-family:Consolas,Menlo,monospace;\">claimed → running → completed/failed</span>，失败的话能看到具体是采集超时还是 webhook 报错。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#34d399;margin:20px 0 10px;\">一个可选的增强：周报让 Agent 来写</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">日报是确定性数据，不需要 LLM。但<span style=\"color:#34d399;font-weight:bold;\">周报</span>不一样——人想知道的不只是数字，还有\"为什么这周缺陷涨了 3 倍\"这类归因。这时候值得开一次 Agent 模式：</p>\n\n<p style=\"background:#0a1220;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">\nhermes cron create \"0 18 * * 5\" \\<br/>\n&nbsp;&nbsp;\"读 ~/.hermes/state/status.json 与本周历史快照，<br/>\n&nbsp;&nbsp;&nbsp;找出异常项目（阻塞增加、超期激增、未分配堆积），<br/>\n&nbsp;&nbsp;&nbsp;每个项目写两句归因建议，输出到周报群。\" \\<br/>\n&nbsp;&nbsp;--deliver wecom --name \"项目周报归因\"\n</p>\n\n<p style=\"font-size:15px;color:#98a2b3;line-height:1.85;margin:0 0 24px;\">一周只花一次 token，换来一段有人味的分析，这个投入产出比是值得的。每天都让 LLM 写，除了烧钱没别的用。</p>\n\n\n<p style=\"margin:32px 0 8px;\">\n<span style=\"display:inline-block;border:2px solid #fb7185;color:#fb7185;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fbbf24;\">8</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#fb7185;margin:18px 0 26px;\">边界：这套东西做不到什么</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fb7185;font-weight:bold;\">① 它不解决\"数据不准\"。</span>如果研发不更新任务状态，日报只会忠实地把\"没人动的任务\"呈现出来。这类自动化的价值在于让不更新这件事变得可见——而不是替人更新。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fb7185;font-weight:bold;\">② 跨平台的人员映射需要人工维护。</span>同名不同人、同人不同名，自动化认不出来。第一周就要把映射表建好，否则按人统计那张表会很难看。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fb7185;font-weight:bold;\">③ 4096 字节是硬墙。</span>团队大了、任务多了，一张卡片装不下。要么拆成两条消息，要么只发摘要 + 链接。别想着\"能不能加宽\"——改不了。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#fb7185;font-weight:bold;\">④ 权限是个隐形的大坑。</span>四个平台的 API token 需要不同的权限范围：Jira 要 Project 级读权限，禅道要 API 账号，PingCode 要走 OAuth2 授权，云效要 RAM 子账号。这块配置成本往往比写脚本本身高。</p>\n\n<p style=\"font-size:16px;color:#e4e7ec;line-height:1.9;margin:22px 0 12px;\">回头看这套东西真正的价值在哪——</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 10px;\">它没有让人少干活。它做的是把每天 40 分钟的<span style=\"color:#667085;\">机械搬运</span>省掉，换成一个人每天早上花 30 秒扫一遍卡片，就能知道二十个项目里哪三个需要今天动手。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 28px;\">信息从\"要主动去四个地方找\"，变成\"每天早上自己走进群\"。这一个字的差别，是真有人在看和没人看的分界线。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:40px 0 20px;\">—— 系列第六篇，完 ——</p>\n\n<p style=\"text-align:center;font-size:13px;color:#667085;margin:0 0 30px;\">往期回顾：<br/>\n① Hermes 连接企微 &amp; 飞书 · ② A2A + SDLC 六阶段 Pipeline<br/>\n③ 企业知识库构建 · ④ WeKnora 活知识库<br/>\n⑤ 业务群 → Jira/禅道/云效 自动建单闭环</p>\n"
}
</script>

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
