<script id="post-data" type="application/json">
{
  "title": "干系人管理：名单之外的人才是变量",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月10日 10:30",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">干系人管理是十大领域里最软的一个。它没有公式，没有曲线，连「做得好」都很难定义。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">所以大部分团队对它的处理方式是：做一张 Excel。姓名、部门、角色、影响力高中低，填完归档，然后永远不再打开。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">这张表通常有三个问题：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0f766e;font-weight:bold;\">一是静态的</span>。项目启动时写一遍，中途不更新。可人是会变的：会换岗、会升职、会因为一次会议上的分歧从支持变沉默、会因为一个没被采纳的意见从沉默变反对。名单不变，人的位置一直在变。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0f766e;font-weight:bold;\">二是只有职位，没有立场</span>。职位告诉你他能不能拦住你，但没告诉你他想不想。一个掌握审批权的财务总监，可能根本不在乎这个项目；一个没有任何职级的资深工程师，可能一句话就能让整个方案推倒重来。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#0f766e;font-weight:bold;\">三是没有动作</span>。标了「影响力高」，然后呢？多久沟通一次、沟通什么、谁来负责，全都没有。一张没有动作的表，和没有这张表是一样的。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1f2430;line-height:1.6;margin:34px 0 34px;\">干系人管理的目标从来不是「让所有人满意」，而是「让该参与的人在正确的时间知道正确的事」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是系列的第十篇。结构照旧：四个过程的输入输出、三个重点（四象限定位、参与度差距、降温信号）、五份模板、归档方式、四类群消息、SKILL 目录，最后是边界。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">需要先说明一点：这个领域的工具可以做得很好，但<span style=\"color:#be123c;font-weight:bold;\">工具解决的是「谁、什么时候、说什么」，解决不了「怎么说他才听」</span>。后者永远是人做的事。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0f766e;color:#0f766e;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #1d4ed8;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0f766e;margin:18px 0 26px;\">四个过程：找全、定策略、促参与、验效果</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">PMBOK 里干系人管理有四个过程。它们的逻辑关系很清晰：前两个是「想清楚」，后两个是「做出来」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0f766e;font-weight:bold;\">识别干系人</span> 找全。用问卷、头脑风暴、访谈、干系人分析。输出干系人登记册——这是后面所有动作的数据底座。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#1d4ed8;font-weight:bold;\">规划干系人参与</span> 定策略。根据每个干系人的权力、利益、当前态度，定出期望态度、沟通渠道和频率。输出干系人参与计划。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#7e22ce;font-weight:bold;\">管理干系人参与</span> 促参与。这一过程用的全是软技能：沟通方法、人际交往、谈判、冲突管理。输出变更请求和计划更新。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#b45309;font-weight:bold;\">监督干系人参与</span> 验效果。看参与度有没有达到期望、关系有没有恶化。输出工作绩效信息和变更请求。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/pipeline.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 1 · 四个过程的 ITTO：找全、定策略、促参与、验效果</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这四个过程里，<span style=\"color:#0f766e;font-weight:bold;\">第 1 个决定上限，第 4 个决定下限</span>。名单漏了人，后面所有策略都是对着空气做的；没有监督，参与度掉了也没人知道，等发现时已经来不及。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">怎么判断名单漏没漏人</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">有一个很实用的检验方法：<span style=\"color:#be123c;font-weight:bold;\">谁能用一句话让项目停下来？</span>把这些人全列出来，一个一个对名单。审批权、预算权、技术否决权、对外口径权——四类权力来源，每一类都对应一批容易被漏掉的人。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">最常被漏掉的是这几位：法务、信息安全、运维、财务的付款审批人、还有<span style=\"color:#b45309;font-weight:bold;\">客户的客户</span>。他们在项目启动会上不会出现，但会在最后一周出现，而且通常带着一个无法在最后一周解决的问题。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1d4ed8;color:#1d4ed8;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1d4ed8;margin:18px 0 26px;\">重点一：权力与利益，一张四象限定关系</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是第一个重点，也是最经典的一张图。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/power.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 2 · 权力 × 利益四象限：位置决定你多久找他一次</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">纵轴是权力，横轴是利益。四个格子对应四种完全不同的沟通策略，而这四种策略的差别不在「重视程度」，在<span style=\"color:#1d4ed8;font-weight:bold;\">「说什么、说多细」</span>。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">重点管理（权力大、利益大）</span>：高频沟通，拉进决策。这一步没有捷径。项目发起人、业务负责人通常在这里，他们要的不是进度百分比，是「你打算怎么处理这个取舍」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">保持满意（权力大、利益小）</span>：定期汇报结论，不给细节。这一格最容易被忽略，因为它「看起来不关心」。但他们的特点是：平时不出现，一出现就是叫停。所以策略是<span style=\"color:#b45309;font-weight:bold;\">让他从你这里知道，而不是从别人嘴里听说</span>。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0f766e;font-weight:bold;\">随时告知（权力小、利益大）</span>：及时同步，收集反馈。一线使用者、测试、运维在这里。他们权力小，但他们是<span style=\"color:#0f766e;font-weight:bold;\">最早发现问题的群体</span>——因为他们是真正在用的人。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#8b949e;font-weight:bold;\">监督即可（权力小、利益小）</span>：低成本维护，公告覆盖。不要主动制造接触，那只会消耗彼此的时间。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">三个常见的画错方式</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#1d4ed8;font-weight:bold;\">只分两格</span>。把四象限压成「重要 / 不重要」，那就退化成了一张排序表，失去了「说什么」这个维度。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#1d4ed8;font-weight:bold;\">权力只看职级</span>。真正的权力来自三处：能不能否决、掌不掌握关键信息、有没有非正式影响力。一个技术委员会的资深委员，职级可能不高，但他说一句「这个架构撑不住」，项目就要重做。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#1d4ed8;font-weight:bold;\">画一次就不动</span>。项目阶段一换，位置就会移动。设计阶段最关键的是架构评审人，上线阶段最关键的是运维和 DBA。<span style=\"color:#be123c;font-weight:bold;\">一张四象限图的有效期，大约就是一个阶段</span>。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #7e22ce;color:#7e22ce;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #0f766e;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#7e22ce;margin:18px 0 26px;\">重点二：参与度要画成「从哪到哪」</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是第二个重点。四象限回答「他有多重要」，参与度矩阵回答「他现在什么态度、我需要他变成什么态度」。后者才是能指导动作的。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/engagement.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 3 · 参与度评估矩阵：空心是现状，实心是期望</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">五个层级：不知晓、抵制、中立、支持、领导。<span style=\"color:#7e22ce;font-weight:bold;\">绝大多数人只填一个分</span>——「支持，3 分」。但单个分数无法产生动作，因为你不知道差距在哪。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">正确画法是两个点：现状 C 和期望 D。中间那段箭头，就是你需要投入的工作量。上图里项目发起人从中立要拉到领导，那段距离就是本阶段最重要的沟通任务。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">有一条经验规则：<span style=\"color:#be123c;font-weight:bold;\">一次跨两级，基本做不到</span>。从中立直接到领导，中间缺了「支持」这个台阶。强行推进会得到一个表面上的点头，而不是真实的背书。正确做法是拆成两轮：先到支持，下一个阶段再到领导。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">「抵制」不是敌人</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这一格最容易被误读。团队看到有人抵制，第一反应是「他不配合」，然后想办法绕过他。但抵制几乎总是有原因的，而且通常是两个：<span style=\"color:#7e22ce;font-weight:bold;\">一是没被咨询过，二是有一个合理的顾虑没被回应</span>。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">所以处理抵制的第一步不是说服，是<span style=\"color:#0f766e;font-weight:bold;\">问清楚他在担心什么</span>。这件事必须人来问，但记录和分析可以交给系统——把「顾虑」作为一个结构化字段，攒够数据之后你会发现，同一类角色在同类项目里的顾虑高度重复。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #b45309;color:#b45309;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #be123c;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b45309;margin:18px 0 26px;\">重点三：参与度会掉，掉之前一定有信号</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是第三个重点，也是这套设计里唯一真正能自动化的部分。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/signal.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 4 · 参与度指数连续 8 周下滑，第 8 周跌破警戒线</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">态度无法采集，但<span style=\"color:#b45309;font-weight:bold;\">行为有日志</span>。一个干系人要退出，不会发公告，只会做四件事：会不来了、消息回得越来越慢、答应的东西没有下文、不再主动提意见。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">出席率</span>：连续缺席两次评审会，就是明确信号。注意区分「派人代参加」——代理出席等于降级。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">响应时长</span>：从 4 小时涨到 18 小时，不是忙，是优先级掉了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">承诺兑现率</span>：「下周给你」这件事发生了三次没兑现，这个人的支持就已经是名义上的了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#b45309;font-weight:bold;\">主动提议数</span>：从每周 4 条降到 1 条。这一项最灵敏，因为它需要主动投入，而冷淡的人不会投入。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">四个信号加权成一个 0-100 的参与度指数，画成趋势线。单点无所谓，<span style=\"color:#be123c;font-weight:bold;\">连续下滑才是信号</span>。三个信号同时变差，基本可以判定：不是忙，是撤了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">好消息是，这四个信号在上一篇沟通管理里已经建好了：到达率、响应时效、闭环率，都是同一批数据。这里只是换了个维度聚合——<span style=\"color:#0f766e;font-weight:bold;\">按人聚合而不是按消息聚合</span>。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #be123c;color:#be123c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #7e22ce;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#be123c;margin:18px 0 26px;\">五份模板与组织过程资产归档</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">四个过程收敛成五份文档。核心还是登记册，其余四份都是它的视图或快照。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">统一 front-matter</p>\n\n<p style=\"background:#141518;color:#d3d7de;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">---<br/>&nbsp;doc_id: SH-PAY-2026-006<br/>&nbsp;doc_type: stakeholder_register<br/>&nbsp;project: payment-v2<br/>&nbsp;version: 2.0.0<br/>&nbsp;status: baselined<br/>&nbsp;baseline_at: 2026-11-06<br/>&nbsp;owner: wangjing<br/>&nbsp;phase: 执行<br/>&nbsp;count: 23<br/>&nbsp;related: [CM-PAY-2026-011]<br/>&nbsp;supersedes: SH-PAY-2026-005<br/>---</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">doc_type</code> 五个取值：stakeholder_register、engagement_plan、power_interest_map、engagement_assessment、stakeholder_review。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">登记册：一条完整记录</p>\n\n<p style=\"background:#141518;color:#d3d7de;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">- id: SH-007<br/>&nbsp;&nbsp;name: 陈明<br/>&nbsp;&nbsp;org: 业务一部&nbsp;&nbsp;role: 业务负责人<br/>&nbsp;&nbsp;type: internal<br/>&nbsp;&nbsp;power: 0.82&nbsp;&nbsp;interest: 0.90<br/>&nbsp;&nbsp;quad: manage_closely<br/>&nbsp;&nbsp;attitude: 3&nbsp;&nbsp;desired: 4<br/>&nbsp;&nbsp;can_veto: [scope, acceptance]<br/>&nbsp;&nbsp;concerns:<br/>&nbsp;&nbsp;&nbsp;&nbsp;- 上线时间不能晚于 12 月底<br/>&nbsp;&nbsp;&nbsp;&nbsp;- 历史数据迁移要可回滚<br/>&nbsp;&nbsp;channel: [周会, 一对一]<br/>&nbsp;&nbsp;cadence: weekly<br/>&nbsp;&nbsp;owner: wangjing<br/>&nbsp;&nbsp;last_contact: 2026-11-06</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">几个字段值得单独说。<code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">power</code> 和 <code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">interest</code> 用 0 到 1 的小数，不用高、中、低——只有这样排序和计算才有意义。<code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">can_veto</code> 记录他能否决什么，这比一个笼统的「影响力」有用得多。<code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">concerns</code> 记录他在意什么——<span style=\"color:#be123c;font-weight:bold;\">这是所有沟通话术的原料</span>，没有它，你只能说出「进度正常」这种废话。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">其余四份的分工</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#1d4ed8;font-weight:bold;\">干系人参与计划</span>：每人一条策略。期望态度、关键沟通点、责任人、里程碑。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#7e22ce;font-weight:bold;\">四象限图</span>：登记册的一个视图，按阶段生成快照。它的价值在于「对比」——上一阶段谁在右上，这一阶段还在不在。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">参与度评估</span>：C 与 D 的矩阵，加上四个信号的数据。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">干系人复盘</span>：阶段收尾时做。谁进来了、谁走了、谁的位置变了、哪些判断错了。这份文档最有价值的部分是「判断错在哪」——它是唯一能让下一个项目的四象限画得更准的材料。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">归档：进项目知识库</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">路径固定为 <code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">/kb/{project}/stakeholder/{doc_type}/{doc_id}-v{version}.md</code>，三态 draft → baselined → superseded，永不物理删除。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">但这一份的权限要单独收紧。<span style=\"color:#be123c;font-weight:bold;\">干系人登记册是本系列里最敏感的一份文档</span>——它记录了对具体的人的评价（支持还是抵制、影响力高低、有什么顾虑）。这份东西一旦泄露或被断章取义地转发，造成的伤害比其他任何文档都大。建议只在项目经理与发起人之间可见，且不进入任何自动摘要。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0f766e;color:#0f766e;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #b45309;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0f766e;margin:18px 0 26px;\">四类群消息与 SKILL 结构</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这个领域的群消息有一条硬规则：<span style=\"color:#be123c;font-weight:bold;\">涉及评价某个人的内容，一律不进群</span>。进群就变成了公开表态，而公开表态会改变关系本身。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/message.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 5 · 四类干系人消息：参与邀请、决策请求、参与度降温、阶段复盘</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#0f766e;font-weight:bold;\">参与邀请</span>：需要某人进入决策时发。说清议题、影响面、需要他做什么。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">决策请求</span>：需要拍板时发。给选项、给建议、给截止时间，并写清「超期默认怎么走」。这一句能消灭大量悬而未决。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#b45309;font-weight:bold;\">参与度降温</span>：信号异常时发。但这条<span style=\"color:#be123c;font-weight:bold;\">只发给项目经理本人或发起人，不进项目群</span>。它是一份提醒，不是一次公开点名。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#1d4ed8;font-weight:bold;\">阶段复盘</span>：阶段收尾时发。只讲结构变化——新增几人、退出几人、谁的定位变了，不讲对个人的评价。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 14px;font-weight:bold;\">SKILL 目录：一个 Skill，五个脚本</p>\n\n<p style=\"background:#141518;color:#d3d7de;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">skills/stakeholder-manager/<br/>&nbsp;SKILL.md<br/>&nbsp;references/<br/>&nbsp;&nbsp;&nbsp;itto.md&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 四过程输入技术输出<br/>&nbsp;&nbsp;&nbsp;quadrant.md&nbsp;&nbsp;&nbsp;&nbsp;# 四象限策略与话术<br/>&nbsp;&nbsp;&nbsp;levels.md&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 五级参与度定义<br/>&nbsp;&nbsp;&nbsp;templates.md&nbsp;&nbsp;&nbsp;# 五份文档模板<br/>&nbsp;&nbsp;&nbsp;messages.md&nbsp;&nbsp;&nbsp;&nbsp;# 四类群消息格式<br/>&nbsp;scripts/<br/>&nbsp;&nbsp;&nbsp;register.py&nbsp;&nbsp;&nbsp;# 登记册录入与校验<br/>&nbsp;&nbsp;&nbsp;quad.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 生成四象限快照<br/>&nbsp;&nbsp;&nbsp;engagement.py&nbsp;# 参与度 C/D 差距<br/>&nbsp;&nbsp;&nbsp;signal.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 信号采集与指数<br/>&nbsp;&nbsp;&nbsp;notify.py&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 企微 / 飞书推送</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><code style=\"background:#eef2f7;color:#1d4ed8;font-family:Consolas,Menlo,monospace;font-size:13px;padding:1px 5px;border-radius:3px;\">register.py</code> 的校验规则里有一条值得强调：<span style=\"color:#0f766e;font-weight:bold;\">新增干系人必须填写 can_veto 和 concerns 两项</span>，否则拒绝入库。因为这两项才是「知道该跟他说什么」的来源，缺了它们，这条记录就只是一个名字加一个部门。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1d4ed8;color:#1d4ed8;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #be123c;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1d4ed8;margin:18px 0 26px;\">边界：这套系统最容易被做成什么样子</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">第一，不是「搞定人」</span>。把干系人管理理解成操纵，是这条路最容易走偏的地方。区别在于：管理是让信息流通、让顾虑被听见；操纵是让人在信息不足的情况下做出对你有益的决定。前者可以公开，后者见光就死。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">第二，不在群里评价个人</span>。「某某支持度下降」「某某不愿配合」这类话进群，就从内部判断变成了公开定性，而且不可撤回。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">第三，不把参与度当考核</span>。一旦指数变成 KPI，它会立刻失真——大家开始表演出席、表演响应。所有观测指标一旦与考核挂钩，观测到的就不再是真实行为。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\"><span style=\"color:#be123c;font-weight:bold;\">第四，抵制是信息不是障碍</span>。这一条前面说过，值得再说一遍：一个持续的、有理由的反对者，往往比十个沉默的支持者更有价值。他看到的可能是你还没看到的东西。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#be123c;font-weight:bold;\">第五，数据要控权限</span>。登记册、评估结果、信号数据都属于高敏感信息，默认最小可见范围。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1f2430;line-height:1.6;margin:40px 0 34px;\">干系人管理的成果，是一次没有人反对的评审会。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这句话和上一篇的「风险管理的成果是那些没有发生的坏事」是同一个道理——做得好的时候，什么都看不出来。评审会上没人挑刺，不是因为没有问题，是因为问题在会前就被一个一个消化掉了。而消化这些问题的过程，恰恰是最不适合展示的部分。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">下一篇拆<strong>整合管理</strong>，也是这个系列的收尾。它会回答一个前面九篇都绕过去的问题：<span style=\"color:#b45309;font-weight:bold;\">当十个领域的数据同时摆在你面前，而它们互相矛盾时，该听谁的</span>。整合管理的本质，就是在冲突的约束之间做取舍，并且为这个取舍负责。</p>\n\n<p style=\"font-size:14px;color:#7c8798;line-height:1.85;margin:36px 0 8px;padding-top:20px;border-top:1px solid #e6eaf0;\">系列进度：框架 → 范围 → 进度 → 成本 → 质量 → 资源 → 沟通 → 风险 → 采购 → 干系人（本篇）→ 整合（收尾）。</p>\n\n<p style=\"font-size:14px;color:#7c8798;line-height:1.85;margin:0 0 8px;\">Skill Accumulation 提示：这是本系列第十篇同结构推文。前十篇的骨架完全一致，差异只在领域名、重点数量（2 或 3 个）和配色。一个能稳定产出十篇的结构，本身就已经是一个可复用的模板了。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
