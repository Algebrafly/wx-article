<script id="post-data" type="application/json">
{
  "title": "状态改成「待测试」，测试就自己跑完了：用 Hermes 打通自动化测试闭环",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 18:49",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#e2e8f0;margin:10px 0 4px;\">状态改成「待测试」的那一刻</p>\n<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#2dd4bf;margin:0 0 30px;\">测试其实已经开始跑了</p>\n\n<p style=\"font-size:16px;color:#94a3b8;line-height:1.85;margin:0 0 22px;\">先还原一个特别常见的日常：</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 下午三点，研发在禅道把任务拖到「待测试」，然后在群里发一句\"我这个好了，@测试\"</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 测试同学正在测另一个需求，看到消息回一句\"稍等，我排一下\"</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 半小时后开始配环境、翻需求文档、找用例、手点一遍</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 22px;\">· 测出三个问题，再手动截图、写复现步骤、挨个提 BUG</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 26px;\">真正花在\"跑测试\"上的时间不到三成，剩下七成是<span style=\"color:#e2e8f0;\">搬运</span>——把需求搬到脑子里、把环境搬起来、把结果搬到平台上。</p>\n\n<p style=\"font-size:16px;color:#e2e8f0;line-height:1.88;margin:0 0 12px;\">这篇讲的是：<span style=\"color:#2dd4bf;font-weight:bold;\">让 Hermes 监听\"状态变成待测试\"这个事件，自动取需求、取用例、拉起环境、跑测试、出报告、把 BUG 提回平台。</span>人只在最后看一眼报告。</p>\n\n<p style=\"font-size:15px;color:#94a3b8;line-height:1.85;margin:0 0 30px;\">它不是替代测试，是把测试同学的重复劳动抽掉，让他有时间去设计那些\"自动化测不出来\"的用例。</p>\n\n\n<!-- 第 1 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #2dd4bf;color:#2dd4bf;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fbbf24;\">1</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2dd4bf;margin:18px 0 26px;\">概念：事件驱动，不是定时驱动</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">先跟上一篇做个区分。前面讲的日报是<span style=\"color:#fbbf24;\">时间触发</span>——每天九点，不管有没有变化，到点就跑。这个场景是<span style=\"color:#2dd4bf;\">事件触发</span>——有人改了状态，才跑。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">差别不只是调度方式，而是整个系统的设计取向：<span style=\"color:#e2e8f0;\">事件驱动要求\"快\"和\"幂等\"，定时驱动要求\"稳\"和\"全\"。</span>测试这件事必须快，因为研发在等结果；也容易重复触发，因为状态可能被来回改。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/flow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 1 · 六段流水线：监听 → 取料 → 准备 → 执行 → 报告 → 回写</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">三段职责，别混在一起写</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">触发段</span> —— 只判断\"这个事件该不该跑\"，不干别的。收到 webhook、校验签名、查幂等表、决定丢弃还是入队。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fbbf24;font-weight:bold;\">执行段</span> —— 只负责\"跑出结果\"。取料、起环境、跑用例、收产 artifact。这一段的输出必须是结构化的 JSON，不是一堆日志。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#f87171;font-weight:bold;\">回写段</span> —— 只负责\"把结果落到平台\"。写报告、建 BUG、改状态、通知。失败要能重试，不能重复建单。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">三段的失败模式完全不同：触发段挂了是\"漏测\"，执行段挂了是\"跑了但没结果\"，回写段挂了是\"测出来了但没人知道\"。分开写，才能分开告警、分开重试。</p>\n\n\n<!-- 第 2 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #fbbf24;color:#fbbf24;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #60a5fa;\">2</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#fbbf24;margin:18px 0 26px;\">触发：监听状态变化，还要兜住漏网之鱼</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">四个项目管理平台对\"状态变更\"的支持程度差别很大。Jira 和 PingCode 开箱有 webhook；禅道的触发器要自己搭回调地址；云效的事件有偶发延迟。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/trigger.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 2 · 四平台触发方式对比，加一条不可避免的兜底轮询</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#60a5fa;margin:20px 0 10px;\">Jira：事件体自带 changelog，这是最好的输入</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">`jira:issue_updated` 事件里的 `changelog.items` 会明确告诉你\"哪个字段从什么变成了什么\"。这样你不需要再查一次接口判断是不是状态变更。</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n{<br/>\n&nbsp;&nbsp;\"webhookEvent\": \"jira:issue_updated\",<br/>\n&nbsp;&nbsp;\"issue\": {\"key\": \"PAY-3412\", \"fields\": {...}},<br/>\n&nbsp;&nbsp;\"changelog\": {<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"items\": [{<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"field\": \"status\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"fromString\": \"In Progress\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"toString\": \"Ready for Test\"<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;}]<br/>\n&nbsp;&nbsp;}<br/>\n}\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">判断逻辑就变成：`field == \"status\"` 且 `toString` 命中你们的\"待测试\"状态名 → 触发。注意这里又要做一次归一——不同公司给这个状态起的名不一样，有的叫 Ready for Test，有的叫\"提测\"，有的叫 QA Review。跟上一篇一样，映射表放配置里。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">三道保险，缺一不可</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fbbf24;font-weight:bold;\">① 签名校验</span> —— Jira 用 `X-Hub-Signature`，PingCode 有 secret，禅道要自己加 HMAC。不校验的话，这个回调地址就是一个人人都能触发的测试任务发射器。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fbbf24;font-weight:bold;\">② 幂等</span> —— 幂等键用 `{work_item_id}:{status_from}:{status_to}:{changelog_id}`。同一张单子从\"进行中\"改到\"待测试\"，只跑一次；研发改回去再改过来，`changelog_id` 变了，算新事件，允许重跑。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#fbbf24;font-weight:bold;\">③ 防抖</span> —— 60 秒窗口。研发经常\"手滑拖到待测试又拖回去\"，或者连改三个字段触发三次事件。一个简单的 sliding window 就能挡掉大部分无效触发。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">兜底轮询：不是因为 webhook 不靠谱，是因为它一定会丢</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">即使四个平台都配了 webhook，也要再加一条 cron：每 10 分钟查一次\"状态为待测试、且 24 小时内没有被处理过\"的工作项。命中就补触发。</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nhermes cron create \"every 10m\" \\<br/>\n&nbsp;&nbsp;\"查找状态为待测试、且 24h 内无测试记录的工作项，补触发测试。\" \\<br/>\n&nbsp;&nbsp;--deliver local --name \"test-sweeper\"\n</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">原因很现实：服务重启期间的事件、平台侧的重试丢失、内网穿透断连——总会有漏的。这条轮询不贵，每 10 分钟一次查询而已，但它是整套系统\"不丢单\"的底线。</p>\n\n\n<!-- 第 3 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #60a5fa;color:#60a5fa;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #a78bfa;\">3</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#60a5fa;margin:18px 0 26px;\">取料：测试用例到底从哪来</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">这是整套系统里最容易卡住的地方。很多人做到这一步才发现：<span style=\"color:#f87171;\">平台上的需求描述只有三行，测试用例根本不存在。</span></p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#60a5fa;margin:20px 0 10px;\">按可用性排四个来源</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">第一优先：用例管理平台的用例</span>。禅道的用例库、PingCode 的 Testhub、Jira 配 Xray/Zephyr，都是结构化的\"前置条件 / 步骤 / 预期结果\"，直接能转成自动化脚本的骨架。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fbbf24;font-weight:bold;\">第二优先：代码仓库里的测试</span>。需求关联的 MR 改了哪些模块，就去跑那些模块对应的 `test/` 目录。这是最省事的一类——用例已经写好了，只是没人跑。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#60a5fa;font-weight:bold;\">第三优先：OpenAPI 文档</span>。需求涉及哪些接口，从接口文档里拿 schema，自动生成正常流 + 边界值的接口调用。这类覆盖的是\"接口约定\"层面，抓得住字段类型错误、必填缺失这类问题。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#a78bfa;font-weight:bold;\">第四优先：让 Agent 从需求文字里生成</span>。前三样都没有的时候，把需求描述 + 验收标准喂给 Agent，让它生成一组冒烟用例。这类用例必须标 `confidence: low`，而且不参与\"必须全绿\"的判定。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">Agent 生成用例的正确姿势</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">别让它\"写测试代码\"，让它\"列测试点\"。前者输出质量极不稳定，后者才是它擅长的。输出结构：</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n[{<br/>\n&nbsp;&nbsp;\"point\": \"拆单金额等于各子商户金额之和\",<br/>\n&nbsp;&nbsp;\"method\": \"api\",<br/>\n&nbsp;&nbsp;\"target\": \"POST /api/v2/settlement/split\",<br/>\n&nbsp;&nbsp;\"input\": {\"order_amount\": 100.00, \"split\": [40, 60]},<br/>\n&nbsp;&nbsp;\"expect\": {\"code\": 0, \"items\": 2, \"sum\": 100.00},<br/>\n&nbsp;&nbsp;\"source\": \"requirement_text\",<br/>\n&nbsp;&nbsp;\"confidence\": \"low\"<br/>\n}]\n</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">这些测试点交给执行层根据 `method` 分派——api 的直接拼请求，ui 的找 Playwright 脚本模板，db 的走只读查询校验。Agent 不碰执行细节，只负责\"该测什么\"。</p>\n\n\n<!-- 第 4 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #f87171;color:#f87171;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #2dd4bf;\">4</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#f87171;margin:18px 0 26px;\">执行：每次都用干净的容器</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">自动化测试最大的敌人不是用例写得不好，是<span style=\"color:#f87171;font-weight:bold;\">环境互相污染</span>。A 的测试改了库里一条数据，B 的断言就挂了；上一轮留下的脏数据让这一轮的\"余额不足\"用例永远不通过。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/matrix.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 3 · 四类测试的输入、跑法与产物</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">一次触发 = 一个一次性沙箱</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\">Hermes 的沙箱执行能力（Docker / E2B / Cube 这类后端）在这里正好合用。每次触发起一个干净容器，里面预装好：被测服务的镜像、测试依赖、独立的测试数据库、必要的 mock 服务。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\">跑完立刻销毁。这样有几个直接的好处：可以并行跑多个需求、不会互相踩数据、失败一定是真失败（不是环境问题）、复现也简单——同一个镜像重跑就是。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">代价是启动慢一点。冷启动 20–40 秒，比起\"测试同学排队半小时\"，这个成本可以忽略。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">跑哪几类，看需求里有什么</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\">别每次都全跑。规则很简单：<span style=\"color:#e2e8f0;\">有什么料就做什么菜</span>。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\">· 需求里有接口路径 + OpenAPI → 接口测试</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\">· 有页面路径 + 已存在的 Playwright 脚本 → UI 回归</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\">· 改动模块有 `_test` / `test_` 文件 → 单元测试</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">· 服务间有契约文件 → 契约测试</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">四类都跑大概 8–15 分钟，只跑接口测试 2–5 分钟。<span style=\"color:#2dd4bf;\">先出快的那批，让研发在 3 分钟内看到反馈</span>，慢的 UI 回归在后面补。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">失败重试一次，但要区分类型</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">断言失败不该重试——重试只会浪费时间并掩盖真问题。只有超时、连接失败、503 这类<span style=\"color:#e2e8f0;\">基础设施型失败</span>才重试一次。</p>\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">更重要的是在报告里把两类失败分开统计。测试同学看一眼就知道\"这轮 7 个红，其中 2 个是环境抖动\"。</p>\n\n\n<!-- 第 5 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #a78bfa;color:#a78bfa;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fbbf24;\">5</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#a78bfa;margin:18px 0 26px;\">报告：一份结果，两种读者</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">测试报告最忌讳\"全绿就一句话，红了就糊一屏日志\"。两种读者需要的东西完全不同：人要看结论和证据，平台要的是结构化字段。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/report.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 4 · 左边的报告给人看，右边的卡片给平台填</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">结构化结果：一切下游的输入</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n{<br/>\n&nbsp;&nbsp;\"run_id\": \"PAY-3412-20261103-0912\",<br/>\n&nbsp;&nbsp;\"work_item\": \"PAY-3412\",<br/>\n&nbsp;&nbsp;\"env\": \"test · v2.3.0-rc1\",<br/>\n&nbsp;&nbsp;\"suite\": {\"total\": 48, \"passed\": 41, \"failed\": 7},<br/>\n&nbsp;&nbsp;\"duration_sec\": 438,<br/>\n&nbsp;&nbsp;\"failures\": [{<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"case\": \"split_sum_matches\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"type\": \"assertion\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"expected\": 100.00,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"actual\": 99.98,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"artifacts\": [\"request.json\", \"response.json\", \"trace.log\"]<br/>\n&nbsp;&nbsp;}],<br/>\n&nbsp;&nbsp;\"flaky\": 1<br/>\n}\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">`flaky` 这个字段很关键。把\"时好时坏\"的用例单独计数，不要混进 failed——否则研发会开始怀疑所有红色，最终忽略全部红色。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">给人看的报告，三段就够</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">第一段：三个数</span> —— 用例总数 / 通过 / 失败。让人 3 秒判断\"要不要继续看\"。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f87171;font-weight:bold;\">第二段：失败明细</span> —— 每条一行，写人话：\"拆单金额与子商户合计不符（期望 100.00）\"。别贴堆栈，堆栈放附件。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#60a5fa;font-weight:bold;\">第三段：证据链接</span> —— 请求响应快照、截图、日志。让人点一下就进得去。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">超过 8 条失败就折叠，只列前 8 条 + \"另有 N 条\"。全列出来等于没有重点——研发看到 40 条红色只会关掉窗口。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">报告同时投到三个地方：项目群（卡片）、工作项评论（详情链接）、测试负责人私信（仅失败时）。全通过的时候只发群里一条\"全绿\"，不打扰任何人。</p>\n\n\n<!-- 第 6 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #2dd4bf;color:#2dd4bf;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f87171;\">6</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2dd4bf;margin:18px 0 26px;\">回写：建 BUG 是最容易搞砸的一步</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">\"自动提 BUG\"听起来很爽，做不好会变成灾难——同一个问题每天提一遍，两周后 Jira 里全是重复单，研发直接把机器人拉黑。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#f87171;margin:20px 0 10px;\">按失败聚类，不是按用例建单</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 18px;\">7 个失败用例，可能只是 2 个根因。直接 7 张单子，等于把噪音放大七倍。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">聚类的键是\"失败指纹\"：`hash(模块 + 接口路径 + 错误类型 + 期望/实际差异的关键字段)`。同一个指纹的用例合并成一张 BUG，描述里列出所有受影响的用例名。</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nfingerprint = sha1(f\"{module}|{api}|{err_type}|{diff_key}\")<br/>\n# 已存在同指纹的未关闭 BUG → 追加 comment，不新建<br/>\n# 不存在 → 新建，标记 auto-test 来源\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#60a5fa;margin:20px 0 10px;\">一张好 BUG 单该有的字段</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#60a5fa;font-weight:bold;\">标题</span> —— 现象，不是用例名。\"拆单金额与子商户合计不符\"，不是 \"test_split_sum_matches failed\"。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#fbbf24;font-weight:bold;\">复现步骤</span> —— 请求参数、前置数据、环境版本。照抄就能复现。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#2dd4bf;font-weight:bold;\">经办人</span> —— 用上一篇讲的归属链路：git blame 命中改动这段代码的人，兜底用模块 owner。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#a78bfa;font-weight:bold;\">关联需求</span> —— 填触发这次测试的工作项 ID。这样需求进度和 BUG 就串起来了。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#f87171;font-weight:bold;\">严重级别</span> —— 别设成\"高\"就完事。规则：主流程断言失败 = 高，边界值失败 = 中，UI 文案差异 = 低。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">要不要自动把状态改回\"开发中\"</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">这是个需要谨慎的选择。技术上做得到，但会打破研发的工作流习惯，也容易让\"待测试\"这个状态失去意义。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">建议：<span style=\"color:#e2e8f0;\">只改一个\"测试结论\"自定义字段（通过/不通过），不动主状态</span>。把状态流转的权力留给人，机器人只提供事实。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">真要改，也让它在\"连续两轮同类失败\"之后才动手，而不是第一次红就翻状态。</p>\n\n\n<!-- 第 7 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #60a5fa;color:#60a5fa;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #2dd4bf;\">7</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#60a5fa;margin:18px 0 26px;\">配置与使用</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">第一步：打开 webhook 接收</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/.env<br/>\nWEBHOOK_LISTEN=0.0.0.0:8787<br/>\nWEBHOOK_SECRET=jira-hmac-secret<br/><br/>\n# ~/.hermes/config/hooks.yaml<br/>\nhooks:<br/>\n&nbsp;&nbsp;test-on-ready:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;path: /hook/jira<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;verify: hmac-sha256<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;filter:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;field: status<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;to: [\"Ready for Test\", \"待测试\", \"提测\"]<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;debounce_sec: 60\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">这个 hook 只做一件事：把事件转成一条\"测试任务\"塞进队列。真正的执行由另一个 Agent 任务消费。<span style=\"color:#e2e8f0;\">接收和执行分开，是为了 webhook 能秒回 200</span>——平台侧的超时通常只有几秒，你不能让它等一个十分钟的测试跑完。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#fbbf24;margin:20px 0 10px;\">第二步：起执行器和兜底</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 消费队列，每次触发跑一轮<br/>\nhermes cron create \"every 1m\" \\<br/>\n&nbsp;&nbsp;\"从测试队列取任务，取需求与用例，起沙箱执行，<br/>\n&nbsp;&nbsp;&nbsp;生成报告并回写 BUG。\" \\<br/>\n&nbsp;&nbsp;--skill auto-test --deliver local --name \"test-runner\"<br/><br/>\n# 兜底补触发<br/>\nhermes cron create \"every 10m\" \\<br/>\n&nbsp;&nbsp;\"扫描漏掉的待测试工作项，补入队。\" \\<br/>\n&nbsp;&nbsp;--deliver local --name \"test-sweeper\"\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">用每分钟一次的 cron 消费队列，比常驻守护进程简单得多——不用管进程存活，Hermes 自己会起会话。队列空的时候脚本立刻返回，零成本空转。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a78bfa;margin:20px 0 10px;\">第三步：先只跑接口测试</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 16px;\">上线第一天不要开全套。先只做\"接口测试 + 只建 BUG 不发通知\"，跑一周，人工比对结果，看误报率。</p>\n\n<p style=\"background:#0a1a2e;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/config/auto-test.yaml<br/>\nenabled_suites: [api]&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 只开接口测试<br/>\ndry_run: true&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 只出报告，不建 BUG<br/>\nnotify_on: never&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 先不打扰任何人<br/>\nmin_pass_rate: 0.9&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 低于 90% 才认为这轮有问题\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\">`dry_run` 关掉之后，先只开 `notify_on: failure`，观察两周。误报率稳定在 10% 以下，再把通知开到群里。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#2dd4bf;margin:20px 0 10px;\">第四步：怎么判断它到底有没有用</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\">· <span style=\"color:#e2e8f0;\">测出来的有效 BUG 数 / 建单总数</span> —— 低于 30% 说明噪音太大，回去调用例</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 8px;\">· <span style=\"color:#e2e8f0;\">平均反馈时长</span> —— 从状态改为待测试到第一份报告，目标 5 分钟内</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#e2e8f0;\">测试同学的等待时间</span> —— 这是最真实的指标，人少了多少\"等环境、等用例\"的时间</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.85;margin:0 0 28px;\">第一个指标下降是正常的，说明你在收紧；第四个指标不动，说明你只是把一个手动流程换成了自动流程，没省到真正的瓶颈。</p>\n\n\n<!-- 第 8 章 -->\n<p style=\"margin:32px 0 8px;\">\n<span style=\"display:inline-block;border:2px solid #f87171;color:#f87171;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #60a5fa;\">8</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#f87171;margin:18px 0 26px;\">边界：它替不了测试工程师</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f87171;font-weight:bold;\">① 需求描述写得烂，它测不出东西。</span>\"优化结算体验\"这种需求，喂给谁都没用。这套系统的上限完全取决于需求文档和用例的质量。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f87171;font-weight:bold;\">② UI 测试天生脆弱。</span>改一个按钮位置、加一个弹窗遮罩，脚本就全红。这类建议只做核心路径，而且必须有稳定选择器约定。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f87171;font-weight:bold;\">③ 它不理解业务。</span>\"这个金额差 2 分钱算不算问题\"——机器只按断言的容差判断，测试同学知道这背后是四舍五入规则。这类判断只能靠人补。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f87171;font-weight:bold;\">④ 数据和权限是红线。</span>绝不能用生产数据跑自动化测试，测试账套、脱敏数据、独立租户，一样都不能省。这也不是工具能保障的，是流程。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#f87171;font-weight:bold;\">⑤ 假失败会毁掉信任。</span>一旦群里出现\"机器人又误报\"，两次之后所有人都会忽略它。宁可少跑，不可乱报。</p>\n\n<p style=\"font-size:16px;color:#e2e8f0;line-height:1.9;margin:22px 0 12px;\">说句实在话。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 10px;\">很多团队做自动化测试失败，不是因为技术不够，是因为<span style=\"color:#64748b;\">一开始就想\"全覆盖\"</span>——几百条用例、四类测试、所有分支，一次性铺开，然后被误报淹没。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.9;margin:0 0 28px;\">正确的起点很朴素：<span style=\"color:#2dd4bf;font-weight:bold;\">挑一条最高频的接口，写 10 个用例，让它跟着\"待测试\"自动跑</span>。测出来的第一个真 BUG 被研发认领修复，这件事就算跑通了。剩下的，是慢慢加。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:40px 0 20px;\">—— 系列第八篇，完 ——</p>\n\n<p style=\"text-align:center;font-size:13px;color:#64748b;margin:0 0 30px;\">往期回顾：<br/>\n① Hermes 连接企微 &amp; 飞书 · ② A2A + SDLC 六阶段 Pipeline<br/>\n③ 企业知识库构建 · ④ WeKnora 活知识库<br/>\n⑤ 业务群自动建单闭环 · ⑥ 定时任务每日项目简报<br/>\n⑦ 代码自动编译成知识</p>\n"
}
</script>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
