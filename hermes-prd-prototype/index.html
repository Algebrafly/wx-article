<script id="post-data" type="application/json">
{
  "title": "从一场访谈到一个需求单：用 Hermes 跑通需求到 PRD 和原型",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月4日 10:16",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">周三下午三点，跟用户聊了一个半小时。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">聊的时候什么都明白。挂了电话，打开文档，光标在空白页上闪了十分钟。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">他说「最好能自动一点」。这个「自动」到底是每天定时跑，还是状态一变就跑？他说「金额要对得上」。对不上时该拦住流程，还是只提示一句？</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">这些话当时没追问，现在只能靠猜。而猜出来的东西，评审会上一定会被问穿。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">我后来发现，产品经理最耗时间的从来不是「想」，而是<span style=\"color:#db2777;font-weight:bold;\">把想到的东西整理成一份别人能评审的东西</span>。转写、归类、查历史、补边界、画原型、填需求单，一套流程走完，一天没了。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1f2430;line-height:1.6;margin:34px 0 34px;\">需求不是写出来的，是问出来的。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 22px;\">这篇想聊的，就是把这套整理工作交给 Hermes 之后，会发生什么。它在这条链路上不负责拍板，只负责三件事：把口语变成结构、把含糊逼成明确、把结论落成文档和原型。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #db2777;color:#db2777;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fbbf24;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#db2777;margin:18px 0 26px;\">先想清楚它该干什么</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">很多人上来就问，能不能让 AI 直接写一份 PRD。能，但生成出来的是模板。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">PRD 里最值钱的部分不是章节，是那些「为什么这么定」。为什么是先冻额度再签合同，为什么退款要走人工，为什么这个字段不允许为空。这些判断来自对话、来自历史踩坑，不来自生成。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">所以 Hermes 的角色要拆准。它做的是三段：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#db2777;font-weight:bold;\">喂料</span> —— 把录音、纪要、聊天记录里的原始表达，变成结构化的需求原料</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#ea580c;font-weight:bold;\">煅烧</span> —— 拿原料去企业知识库和外部找证据，再用四类问题把含糊的地方逼出答案</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#059669;font-weight:bold;\">出件</span> —— PRD、原型、需求单，一次落地到平台</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这和上一篇讲的「自动建单」不是一回事。那是事件驱动，状态一变就触发，人几乎不在环里。这个是对话驱动，人的参与密度高得多，每一步都需要产品经理确认或者否决。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">顺序反过来就会翻车。先让机器出文档，再让人去补判断，得到的一定是一份很漂亮、但没有观点的文档。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/flow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 1 · 六个节点，三段职责。人做判断，机器做整理</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #ea580c;color:#ea580c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #38bdf8;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#ea580c;margin:18px 0 26px;\">输入：把一场对话变成能用的原料</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">原料的形态比想象的杂。用户访谈的录音、会议纪要、企微群里的零散反馈、客服工单，都算。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">Hermes 第一步只做两件事：转写去噪、抽取要素。转写用本地或云端的语音模型都行，关键是去噪——「嗯」「那个」「就是说」这类填充词，全删。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">抽取的七个要素，缺一不可：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">角色</span> 谁在用，是财务、运营，还是外部商户</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">场景</span> 什么时间、什么任务、连着哪个环节</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">触发</span> 什么事情发生了，他才会用到这个功能</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">现状</span> 现在怎么凑合解决的，成本是多少</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">痛点</span> 哪一步最难受，具体难受在哪</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">期望</span> 他嘴上说的方案，注意这只是方案，不是目的</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#0284c7;font-weight:bold;\">约束</span> 时间、预算、合规、现有系统的限制</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这里有个死规矩：<span style=\"color:#db2777;font-weight:bold;\">缺什么就标 missing，绝对不许补全。</span></p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">模型补全的能力很强，它会给你一句读起来毫无破绽的「系统应支持灵活的权限配置」。你当时觉得挺顺，评审时被问「灵活到什么程度、谁能配、配错了怎么回滚」，就答不上来了。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">所以第一步的产出不是 PRD，是一张带缺口的原料表。产品经理看着这张表补，比对着空白页写快得多。</p>\n\n<p style=\"background:#12101a;color:#e6e0ea;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/config/product-intake.yaml<br/>\nsources:<br/>\n&nbsp;&nbsp;- type: meeting&nbsp;&nbsp;&nbsp;&nbsp;# 访谈录音 / 会议纪要<br/>\n&nbsp;&nbsp;- type: im&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 企微 / 飞书聊天导出<br/>\n&nbsp;&nbsp;- type: ticket&nbsp;&nbsp;&nbsp;&nbsp;# 工单与客服记录<br/>\nextract_fields:<br/>\n&nbsp;&nbsp;- role&nbsp;&nbsp;- scenario&nbsp;- trigger<br/>\n&nbsp;&nbsp;- current&nbsp;- pain&nbsp;- expectation&nbsp;- constraint<br/>\ntreat_missing_as: missing&nbsp;&nbsp;# 缺口只标记，禁止模型补全<br/>\noutput: intake.json&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# 原料表，不是 PRD\n</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #059669;color:#059669;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f472b6;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#059669;margin:18px 0 26px;\">检索：先找证据，再谈方案</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">原料表填到一半，一定会卡住。用户提的每一条，都得先问一句：我们是不是已经做过了？</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">有个很典型的例子。用户说「希望审批流程能撤回」，听起来是个小功能。去项目知识库里一查，两年前做过一版，上线两周就下线了——因为财务合规不允许审批人撤回已经进入付款环节的单子。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这条信息，比生成十个方案都有用。它直接把讨论从「怎么做」推到了「在哪个环节可以撤」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">Hermes 的取料分四路：</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#059669;font-weight:bold;\">项目知识库</span> 历史 PRD、需求单、代码功能卡片、接口文档</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#0284c7;font-weight:bold;\">用户反馈库</span> 工单、客服记录、业务群聊天、过往访谈</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#9333ea;font-weight:bold;\">术语与规则库</span> 领域名词、指标口径、合规红线、计费规则</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#ea580c;font-weight:bold;\">外部检索</span> 竞品功能、行业标准、公开 API、法规条款</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">检索完不能直接往 PRD 里塞。每一条结论都要挂一个证据等级，E1 到 E4。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">E1 是内部事实，知识库里的原文、线上数据、已上线功能。E2 是从工单和反馈里归纳出来的模式，必须附样本量。E3 是外部参考，要标来源和日期。E4 是模型常识，只能写进建议区。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">把 E3、E4 混进正文，是 PRD 最常见的翻车点。评审会上有人问一句「这是谁说的」，你就得当场解释半天。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">检索还有一个副产品：冲突检测。用户说的和两年前的决策冲突、和现行合规规则冲突、和他自己上一次访谈说的冲突，这三种都要单独列出来。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">冲突不是要你去说服用户，是提醒你这次访谈里有一个没聊透的地方。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/retrieval.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 2 · 四路取料，先分级再落笔</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0284c7;color:#0284c7;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #a3e635;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0284c7;margin:18px 0 26px;\">追问：让 Hermes 当那个不客气的评审</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这是整条链路里最值钱的一段，也是最容易被做废的一段。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">做废的方式很统一：让 AI 列一百个问题。产品经理看一眼，关掉。因为问题不可回答，或者看不出为什么要问。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">有效的问题只有四类，而且每条都要附一句「为什么问」。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#db2777;margin:22px 0 10px;\">边界</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">账上余额刚好等于手续费时，能扣还是不能扣？两笔分账同时到达，先锁哪个账户？</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">为什么问：这类问题不定义，开发就会各自实现一套，联调时才发现两个系统的边界行为相反。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#ea580c;margin:22px 0 10px;\">角色</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">这个按钮谁能看见？谁审批？谁承担后果？负责人生成单的人离职了，他建的单归谁？</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">为什么问：权限和归属是需求里最容易漏的一层，漏了不会报错，只会在上线后变成扯皮。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#0284c7;margin:22px 0 10px;\">时序</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">先签合同还是先冻结额度？退款到账之前，订单状态该显示什么？</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">为什么问：中间态是状态机设计里最难的，不画出来，实现的时候一定会有两种理解。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#9333ea;margin:22px 0 10px;\">失败</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">第三方接口超时，走重试还是走人工？重试三次都失败，用户看到什么？</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">为什么问：没有失败路径的需求是不完整的需求，只写顺利路径的 PRD 一定会在灰度时被补丁追着改。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">除了问，还要扫逻辑缺陷。五类最常见：循环依赖、状态机没有终态、指标不可度量、需求自相矛盾、没有失败路径。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">比如「订单完成后自动关闭工单，工单关闭后触发订单完成」，这就是循环依赖。听起来很顺，跑起来就是死循环。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">至于头脑风暴，我建议别用「给我十个点子」这种问法。有效的做法是受约束的发散：给定现有技术栈、三个月工期、两个人，列出三种方案，每种附上代价，再明确说这一版不做什么。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">约束越硬，方案越能用。没有约束的发散，产出的是创意，不是设计。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/grill.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 3 · 四类追问 + 五类逻辑缺陷。问题必须可回答</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #9333ea;color:#9333ea;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #2dd4bf;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#9333ea;margin:18px 0 26px;\">出件一：一份能评审的 PRD</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">前面三段聊完，PRD 基本就是「把已经确认的东西按顺序写下来」，这一步反而是最机械的。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">骨架十章，顺序别乱。背景、目标与非目标、角色与场景、功能清单、主流程与状态机、字段规则、权限、异常边界、非功能与合规、验收标准。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">其中「非目标」这一章最容易被跳过，也最重要。明确不做什么，比列一堆要做的更能防范围蔓延。评审时有人提新想法，你就可以指回这一章。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">验收标准单独说。每一条都必须可测，写成「给定 / 当 / 则」三段。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">反例：系统应保证分账金额准确。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这句话没有信息。什么叫准确，谁来判，误差多少算不准确，全不知道。开发看到只会问一句「所以呢」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">正例：给定订单 100 元、两个子商户各分 30%，当分账执行成功，则两个子商户余额分别增加 30 元，平台留存 40 元，且三者之和等于 100 元。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这样的句子，测试可以直接照着写成用例，开发也没法含糊。Hermes 生成完会做一遍自检，凡是出现「合理」「尽量」「适当」这类词，全标红让人改。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/produce.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 4 · 左：PRD 十章骨架；右：原型四态。两者必须能对上</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #db2777;color:#db2777;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #fbbf24;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#db2777;margin:18px 0 26px;\">出件二：原型图，别指望一步到位</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">先说结论：一句话生成高保真原型，目前不靠谱。生成出来的东西乍看精致，细看每个按钮都没有含义。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">原型该分三层做，Hermes 只做前两层。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#db2777;font-weight:bold;\">低保真</span> 结构线框，只表达信息层级和页面之间的关系</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#ea580c;font-weight:bold;\">中保真</span> 带上真实文案、字段、按钮，以及空态、错误态、加载态</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#9333ea;font-weight:bold;\">高保真</span> 视觉、动效、品牌规范，交给设计师</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">为什么用 HTML 而不是 Figma 文件？三个理由。可版本化，每次改动能 diff；可直接交给前端，不是一张图；可当验收基线，跑起来就是最终形态。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">Hermes 从 PRD 的页面清单出发，一个页面一个 HTML 文件，文件头写着对应的 PRD 章节号。评审时看到哪个页面不对，直接说第几章第几页，不会出现「我说的那个弹窗」这种对话。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">四态是硬要求。正常态、空态、错误态、加载态，缺一个，评审现场一定被问住。空态尤其重要，它逼你说清楚「没有数据时用户该干什么」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">最后记住一句：<span style=\"color:#db2777;font-weight:bold;\">原型是讨论工具，不是交付物。</span>它的价值不在好看，在于让「我以为你懂了」这件事当场暴露。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #ea580c;color:#ea580c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #38bdf8;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#ea580c;margin:18px 0 26px;\">回写：落到禅道、Jira、PingCode</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">文档和原型都在本地了，最后一步是让它们进入团队真正会看的地方。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">三个平台的字段名完全不同，语义要提前对齐。禅道的需求叫 story，描述字段是 spec，还吃 HTML；Jira 叫 Story，描述是 description，验收标准常常要挂一个自定义字段；PingCode 叫 requirement，状态枚举又是另一套。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">这张映射表不能靠记忆，写进配置里，改一次全链路生效。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">附件怎么带？PRD 转成 Markdown 和 PDF 各传一份，原型打包成 zip，再补三张关键页面截图。截图是给不看附件的人准备的，别省。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">层级也要想清楚。一个大需求底下会拆出若干子需求，子需求再挂任务。别把十章 PRD 全塞进一张单子里，没人看得完。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">幂等用一个指纹兜底，标题加核心场景做哈希。同一个需求重复触发，不会建出三张一样的单子。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">初始状态设成「待评审」，不是「已确认」。这一步是态度问题，需求单是讨论的起点，不是结论。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/platforms.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 5 · 字段名不同，语义要对齐</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #059669;color:#059669;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f472b6;\">8</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#059669;margin:18px 0 26px;\">配置与边界</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">整条链路拆成三个 Agent，各自有明确的输入输出。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#db2777;font-weight:bold;\">intake</span> 吃原始素材，产出原料表加缺口清单</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">· <span style=\"color:#ea580c;font-weight:bold;\">critic</span> 吃原料表，做检索、追问、缺陷扫描，产出确认过的需求条目</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">· <span style=\"color:#059669;font-weight:bold;\">author</span> 吃确认条目，出 PRD、出原型、写回平台</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">拆开的好处是每一步都能单独重跑。追问那一轮答得不满意，只重跑 critic，不用从头再来。</p>\n\n<p style=\"background:#12101a;color:#e6e0ea;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/config/prd-pipeline.yaml<br/>\ncritic:<br/>\n&nbsp;&nbsp;rounds: 3<br/>\n&nbsp;&nbsp;dimensions: [boundary, role, sequence, failure]<br/>\n&nbsp;&nbsp;flaws: [circular_dep, no_terminal_state,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;unmeasurable_kpi, contradiction]<br/>\n&nbsp;&nbsp;ask_why: true&nbsp;&nbsp;# 每个问题附「为什么问」<br/>\nauthor:<br/>\n&nbsp;&nbsp;prd_template: ten_chapters<br/>\n&nbsp;&nbsp;prototype: html&nbsp;&nbsp;# 线框 + 四态<br/>\nwrite_back:<br/>\n&nbsp;&nbsp;status_on_create: pending_review<br/>\n&nbsp;&nbsp;dedup_key: sha1(title + core_scenario)<br/>\n&nbsp;&nbsp;attach: [prd.md, prd.pdf, prototype.zip]\n</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 12px;\">上线别一步到位，分三步走。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">第一步只读。只摄入、只检索，产出原料表和证据清单，不写任何文档。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">第二步出文档，人工确认后才允许回写平台。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">第三步才是全自动建需求单，而且只对熟悉的业务域开放。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">五条边界，写在这里省得以后再踩。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">不懂业务常识。模型能把话说圆，但不知道这个行业里哪些操作是要被合规审查的。这类判断只能人补。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">原型不能替代设计。它解决的是结构和状态，解决不了视觉和体验。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">PRD 是承诺，不是文档。写进去的每一条，后面都要有人为它负责。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 10px;\">别让它替你拍板。它可以给三个方案和代价，不能选那个方案。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">外部检索必须标来源。没有来源的外部信息，当成没查到。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">说到底，这套东西改变的不是产品经理的工作量，是工作的分布。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">整理、归类、查历史、填字段，这些曾经占掉大半天的活，被压到了几十分钟。省下来的时间，应该花在访谈里多问一句「那如果余额不够呢」，花在评审前多想一遍「这个方案失败时会怎样」。</p>\n\n<p style=\"font-size:15px;color:#2c3340;line-height:1.88;margin:0 0 20px;\">机器把整理成本降到接近零之后，判断就成了唯一稀缺的东西。</p>\n\n<p style=\"text-align:center;font-size:15px;font-weight:bold;color:#db2777;line-height:1.8;margin:30px 0 10px;\">而判断，从来不是写出来的。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
