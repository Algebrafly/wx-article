<script id="post-data" type="application/json">
{
  "title": "Hermes Agent 自动建单：业务群到 Jira/禅道/云效的 7 秒闭环",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月2日 10:36",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#e2e8f0;margin:10px 0 4px;\">业务群里说\"这个功能不对\"</p>\n<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#ef4444;margin:0 0 30px;\">谁来接？—— Hermes 自动上报闭环全拆解</p>\n\n<p style=\"font-size:16px;color:#94a3b8;line-height:1.85;margin:0 0 22px;\">一个典型的早晨：9 点 15 分，企微\"支付业务群\"里蹦出三条消息——</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 8px;\">\n小王 · 9:15「微信支付代扣这里又失败了，报 E0237」<br/>\n李姐 · 9:17「这个月第三个了，能不能加点重试？」<br/>\n小张 · 9:19「@运维 @后端 赶紧看」\n</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 22px;\">—— 然后没人接。运维说\"不是我的模块\"，后端群里炸了但没人知道该 @ 谁。十分钟过去，问题漂在群里像一条没主的鱼。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">这不是管理问题，是 <span style=\"color:#ef4444;font-weight:bold;\">信息搬运成本太高</span>。业务群、研发群、Jira、禅道、飞书——每多一个平台，就多一道人工搬运的坎。</p>\n\n<p style=\"font-size:16px;color:#e2e8f0;line-height:1.85;margin:0 0 28px;\">本篇聊的是：<span style=\"color:#22c55e;font-weight:bold;\">Hermes Agent 怎么把这条坎变成一条自动流水线</span>——监听业务群 → 识别 BUG / 优化 → 查知识库找责任人 → 在 Jira / 禅道 / PingCode / 云效自动建单 → 推回群里告诉大家\"我已经报了，编号 PROJ-123，张三在跟进\"。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/pipeline.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 1 · 7 步闭环：从\"这个功能不对\"到\"PROJ-123 已创建\"</p>\n\n\n<!-- 第 1 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #3b82f6;color:#3b82f6;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">1</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#3b82f6;margin:18px 0 26px;\">Gateway 监听：让 Hermes 蹲在业务群里</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">Hermes 的 Messaging Gateway 支持 19+ 平台同时启用，企微和飞书是国内最常用的两个接入点。配置完成后，Hermes 不是被动等 @ 它才回复，而是 <span style=\"color:#22c55e;font-weight:bold;\">以完整群参与者身份</span> 进入群组，实时接收所有消息。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">这跟普通 webhook 机器人有本质区别——webhook 只能\"收 webhook → 发 webhook\"，消息中间会丢格式、丢上下文。Hermes 走的是企微 <span style=\"color:#06b6d4;\">WebSocket 长连</span> 和飞书 <span style=\"color:#a855f7;\">im.message.receive_v1</span> 事件订阅，拿到的是完整消息对象，包括：</p>\n\n<p style=\"font-size:14.5px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 发送人 user_id + 昵称（可以直接查企业通讯录）</p>\n<p style=\"font-size:14.5px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 群 chat_id（知道是哪个业务群的问题）</p>\n<p style=\"font-size:14.5px;color:#cbd5e1;line-height:1.9;margin:0 0 8px;\">· 文本 + 图片 + @ 列表（可以识别\"@运维\"这种暗示）</p>\n<p style=\"font-size:14.5px;color:#cbd5e1;line-height:1.9;margin:0 0 22px;\">· 会话时间戳（可以做\"群热度\"分析）</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3b82f6;margin:18px 0 10px;\">配置核心就一个开关</p>\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/.env<br/>\nWECOM_BOT_ID=bot-xxxx<br/>\nWECOM_SECRET=xxx-secret-xxx<br/>\nWECOM_AUTO_LISTEN=true&nbsp;&nbsp;# 群消息全量监听开关<br/>\nWECOM_LISTEN_GROUPS=chat_id_1,chat_id_2&nbsp;&nbsp;# 指定监听哪些业务群<br/><br/>\n# 飞书同理<br/>\nFEISHU_APP_ID=cli_xxxx<br/>\nFEISHU_APP_SECRET=xxx<br/>\nFEISHU_SUBSCRIBE_IM_MESSAGE=true\n</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 26px;\">`WECOM_AUTO_LISTEN=false` 是默认值——不主动监听，只响应 @。生产环境开 true 之前，建议先 `WECOM_LISTEN_GROUPS` 限定范围，别让 Hermes 扫了全公司 200 个群。</p>\n\n\n<!-- 第 2 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #f97316;color:#f97316;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #a855f7;\">2</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#f97316;margin:18px 0 26px;\">意图分类：把 BUG 和闲聊拆开</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">群里一天几千条消息，90% 是\"早上好\"\"辛苦了\"\"图片\"。Hermes 不能什么都报工单——那 Jira 会被刷爆。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\">分类逻辑走 <span style=\"color:#ef4444;font-weight:bold;\">双层过滤</span>：先规则后 LLM，把\"真问题\"和\"噪音\"分层捞出来。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/intent_engine.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 2 · 意图分类决策树：规则预筛 + LLM 精判</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#f97316;margin:18px 0 10px;\">第一层：关键词 + 正则预筛（毫秒级）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">快速把明显的噪音踢出去。正则命中即标记为 BUG 候选或优化候选，不命中则直接丢弃。</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# config.yaml 里定义规则<br/>\nintent_rules:<br/>\n&nbsp;&nbsp;bug_keywords: ['报错', '失败', '异常', '乱码', '挂了', 'E\\d{4}', '500', 'timeout']<br/>\n&nbsp;&nbsp;optimize_keywords: ['能不能', '希望', '建议', '优化', '增加', '减少']<br/>\n&nbsp;&nbsp;discard_if_contains: ['早上好', '哈哈', '图', '@']&nbsp;&nbsp;# 闲聊词 + 纯 @ 消息\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#a855f7;margin:18px 0 10px;\">第二层：LLM 精判（200ms 左右）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">规则没法覆盖所有情况。比如\"今天微信支付好像慢了\"——没有关键词，但语义上就是性能问题。Hermes 把消息塞进 system prompt，让 LLM 输出 JSON 结构：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n{<br/>\n&nbsp;&nbsp;\"intent\": \"bug\" | \"optimize\" | \"question\" | \"chat\",<br/>\n&nbsp;&nbsp;\"confidence\": 0.92,<br/>\n&nbsp;&nbsp;\"entities\": {<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"product\": \"微信支付代扣\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"error_code\": \"E0237\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"timestamp\": \"2026-11-02 09:15\"<br/>\n&nbsp;&nbsp;},<br/>\n&nbsp;&nbsp;\"summary\": \"微信支付代扣报 E0237，本月第三次\"<br/>\n}\n</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">`confidence < 0.6` 的直接丢弃。`intent=question` 不建单，走 Hermes 知识库回答（参考系列第三篇\"Hermes 构建企业知识库\"）。只有 `bug` 和 `optimize` 进入下一环节。</p>\n\n\n<!-- 第 3 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #a855f7;color:#a855f7;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #06b6d4;\">3</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#a855f7;margin:18px 0 26px;\">责任人归属：从\"代扣失败\"到\"张三\"</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">这是整个流程里最容易翻车的一步——谁是\"微信支付代扣\"的 owner？群里没人说得清。Hermes 走三条路径并行，命中任何一条就算成功。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/owner_lookup.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 3 · 三条归属路径，兜底交给 PMO 人工分配</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#22c55e;margin:18px 0 10px;\">路径 A：Hermes Memory Provider（知识库）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">如果前面已经按系列第三篇接好了 Hindsight / Neo4j，知识图谱里存了\"业务域 → 团队 → 负责人\"的关系。直接查：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# Hermes 工具调用<br/>\nmemory_query(\"product:微信支付代扣 → owner\")<br/>\n# Hindsight 返回 → {name: \"张三\", team: \"支付后端\", email: \"zhangsan@corp.com\"}\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#06b6d4;margin:18px 0 10px;\">路径 B：代码仓库 MCP（最准）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">知识库没命中？走代码仓库。Hermes 的 GitHub MCP Server 已经暴露了 `search_code` 和 `git_blame` 两个工具：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# MCP GitHub Server<br/>\nsearch_code(repo=\"payment-service\", query=\"代扣 E0237\", lang=\"java\")<br/>\n# → 命中类 WeChatWithholdService.java<br/>\ngit_blame(file=\"WeChatWithholdService.java\", line_range=[37, 52])<br/>\n# → 最近修改人 zhangsan，最近提交 2026-10-28\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.8;margin:0 0 22px;\"><span style=\"color:#22c55e;\">Git blame 是业界最准的 owner 识别手段</span>——改这段代码的人，大概率就是知道怎么修的人。唯一的坑是\"某人离职了但还是 blame 命中\"，这种情况走路径 C。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#f97316;margin:18px 0 10px;\">路径 C：企业通讯录 MCP（兜底）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\">Hermes 的企微/飞书 gateway 本身就握有企业通讯录权限。按\"支付后端\"查组织架构，找到部门负责人和当前 active 的技术骨干。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">三条路径都没命中？标记 `owner_unassigned=true`，Issue 先挂在\"PMO 待分配\"队列，同时推一条 @ PMO 的消息到业务群。<span style=\"color:#22c55e;\">这是兜底，95% 的场景路径 A + B 能搞定</span>。</p>\n\n\n<!-- 第 4 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #ef4444;color:#ef4444;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #3b82f6;\">4</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#ef4444;margin:18px 0 26px;\">Issue 创建：一个接口打四个平台</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">现在到了最核心的\"落地\"环节——不同公司用的项目管理平台不一样。有的团队用 Jira，有的传统团队用禅道，有的新团队用 PingCode 或阿里云效。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\">Hermes 通过 <span style=\"color:#a855f7;font-weight:bold;\">MCP Server 桥接</span> 解决这个问题：每个项目管理平台暴露一套 MCP 工具，Hermes 调的时候统一用 `create_issue(title, description, owner, platform)`，不用关心底层是 Jira REST 还是禅道 HTTP API。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/platforms.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 4 · 四平台 API 对比：MCP 统一暴露 create_issue 工具</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#ef4444;margin:18px 0 10px;\">Jira：atlassian-python-api 生态最全</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">Postman 上叫\"Jira Cloud Platform\"，国内公司用 Cloud 版和 Server 版都有。REST 核心是 `rest/api/3/issue`：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# MCP Jira Server 内部实现<br/>\nfrom atlassian import Jira<br/>\njira = Jira(url, username, token)<br/>\nissue = jira.create_issue(<br/>\n&nbsp;&nbsp;project=\"PROJ\",<br/>\n&nbsp;&nbsp;summary=\"微信支付代扣 E0237 频繁失败\",<br/>\n&nbsp;&nbsp;description=\"业务群 2026-11-02 09:15 小王反馈：本月第三次 E0237...\",<br/>\n&nbsp;&nbsp;issuetype={\"name\": \"Bug\"},<br/>\n&nbsp;&nbsp;assignee={\"name\": \"zhangsan\"},<br/>\n&nbsp;&nbsp;labels=[\"auto-bridge\", \"payment\"]<br/>\n)<br/>\n# → 返回 issue.id, issue.key = \"PROJ-123\"\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#f97316;margin:18px 0 10px;\">禅道：轻量自建 MCP，HTTP API 直接调</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">禅道官方有 REST API v1（`api.php?m=task&a=create`）和 v2（OpenAPI 标准）。禅道的好处是国产化、私有化部署、接口简单，不需要 OAuth2 那套。自建一个 50 行的 MCP Server 就能搞定：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# MCP Zentao Server (zentao-mcp.py)<br/>\ndef create_task(product, title, desc, owner):<br/>\n&nbsp;&nbsp;token = requests.get(ZENTAO_AUTH_URL, ...).json()['token']<br/>\n&nbsp;&nbsp;resp = requests.post(ZENTAO_URL, json={<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"name\": title, \"desc\": desc, \"pri\": 2,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"status\": \"wait\", \"openedBy\": \"auto-bridge\",<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;\"assignedTo\": owner, \"project\": product<br/>\n&nbsp;&nbsp;}, headers={\"Token\": token})<br/>\n&nbsp;&nbsp;return resp.json()['id']\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3b82f6;margin:18px 0 10px;\">PingCode：Skill 社区已有，lobehub 直接用</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">PingCode 走 Open API v1，按 work_item_type 区分 BUG、需求、任务。LobeHub 上有现成的 pingcode skill，`create_workitem --title --type bug` 一条命令就能建。Hermes 直接调 pingcode-mcp 暴露的 `create_issue` 工具。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#06b6d4;margin:18px 0 10px;\">阿里云效：CreateWorkitem + RAM 角色授权</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\">云效的好处是和阿里云 RAM 打通，不需要单独存 token。用 RAM AK/SK 调 `CreateWorkitem` 接口，传入 `WorkitemType=BUG`、`SpaceIdentifier`、`Assignee` 三个核心字段。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">四个平台的差异总结：<span style=\"color:#ef4444;\">Jira 最重但生态全</span>、<span style=\"color:#f97316;\">禅道最轻量适合私有化</span>、<span style=\"color:#3b82f6;\">PingCode 定位 DevOps 全流程</span>、<span style=\"color:#06b6d4;\">云效和阿里云绑定深</span>。Hermes 层面的建议是<span style=\"color:#22c55e;\">同时接一个\"主平台\" + 一个\"备份平台\"</span>，比如 Jira 做主、云效做 DevOps 流水线联动。</p>\n\n\n<!-- 第 5 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #22c55e;color:#22c55e;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">5</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#22c55e;margin:18px 0 26px;\">通知回流：让群里所有人看到\"我已经报了\"</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">Issue 创建成功的那一刻，Hermes 立刻做两件事——</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#22c55e;margin:12px 0 8px;\">① 推回业务群（卡片消息）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">用企微 AI Bot 的 Interactive Card 或飞书消息卡片格式：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 群里看到的卡片<br/>\n┌─────────────────────────────────────┐<br/>\n│ 🐛 已自动上报 BUG                    │<br/>\n│                                      │<br/>\n│ 标题：微信支付代扣 E0237 频繁失败     │<br/>\n│ 平台：Jira · PROJ-123                │<br/>\n│ 负责人：张三 @zhangsan               │<br/>\n│ 提交人：小王 · 支付业务群            │<br/>\n│                                      │<br/>\n│ [ 打开 Jira ]  [ 补充信息 ]  [ 撤回 ] │<br/>\n└─────────────────────────────────────┘\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#f97316;margin:12px 0 8px;\">② 私信责任人（紧急通道）</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">如果 `confidence > 0.9` 且 `owner` 已确定，Hermes 直接 @ 张三，同时发一条私信卡片到张三的企微单聊窗口。这样即使张三不在业务群，也能在自己的专属通知里看到。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\"><span style=\"color:#ef4444;font-weight:bold;\">撤回按钮很重要</span>——群里有人随手发\"这是 bug 吧？\"被 Hermes 当真了，或者意图判断错了，卡片上直接点\"撤回\"就能撤销 Issue 并标记一条训练数据。Hermes 会把撤回记录写进内部日志，下次遇到类似消息 confidence 会自动降低。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">整个\"群消息流入 → Issue 出现在 Jira 看板\"的端到端延迟实测是 <span style=\"color:#22c55e;\">4–8 秒</span>。从 9:15 小王发消息到 9:15:07 群里出现自动上报卡片——比原来半小时的人工搬运快了两个数量级。</p>\n\n\n<!-- 第 6 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #3b82f6;color:#3b82f6;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #22c55e;\">6</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#3b82f6;margin:18px 0 26px;\">状态追踪：Issue 变了，群里自动知道</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">闭环的最后一环——Jira / 禅道那边 Issue 状态变了（待修复 → 修复中 → 已解决 → 已关闭），业务群里的人不能再去 Jira 手动刷。</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">Hermes 用 MCP Server 的 <span style=\"color:#06b6d4;\">watch_issue</span> 工具做订阅：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# Issue 创建时启动一个 watch 协程<br/>\nwatch_issue(platform=\"jira\", key=\"PROJ-123\")<br/>\n# → Jira Webhook / 定时轮询，状态变更时触发回调<br/>\n# Hermes 在群里更新卡片：<br/>\n# \"📋 PROJ-123 已修复，张三 15:42 推送测试环境\"\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\">这样业务群里的人不用离开群就能看到问题走到哪一步了。整个对话线程形成一个完整的\"群聊 → Issue → 状态更新\"的双向同步环。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">实测效果：支付团队接入后，业务群里\"这个 BUG 修了吗？\"这类消息减少了 80%——因为所有人直接看群里的状态卡片就知道了。</p>\n\n\n<!-- 第 7 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #a855f7;color:#a855f7;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #ef4444;\">7</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#a855f7;margin:18px 0 26px;\">实战复盘 + 边界</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">回到开头那个场景——2026-11-02 09:15，支付业务群：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n09:15 小王：微信支付代扣这里又失败了，报 E0237<br/>\n&nbsp;&nbsp;↓ Hermes Gateway 收到<br/>\n&nbsp;&nbsp;↓ intent_engine → bug, confidence 0.94<br/>\n&nbsp;&nbsp;↓ owner_lookup → Git blame 命中 zhangsan<br/>\n&nbsp;&nbsp;↓ create_issue → Jira PROJ-123 创建成功<br/>\n09:15:07 Hermes Bot：🐛 已自动上报 BUG · PROJ-123<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;负责人：张三<br/>\n09:15:12 张三（私信）：收到，马上看<br/>\n</p>\n\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 18px;\">从 9:15 到 9:15:07，<span style=\"color:#22c55e;\">7 秒</span>。原来这个流程要靠小王截图 → 群里 @ 人 → 没人理 → 小王自己上 Jira 填单 → 等 PM 分配 → PM 再找张三，至少 <span style=\"color:#ef4444;\">30 分钟</span>。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#ef4444;margin:18px 0 10px;\">几个必须讲的边界</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 8px;\">1. <span style=\"color:#ef4444;\">误报率</span>：实测前两周 ~8%，用撤回按钮产生的训练数据喂给 intent_engine 后降到 ~2%。完全消灭误报不现实，<span style=\"color:#22c55e;\">撤回通道 + 自动学习</span> 是务实做法。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 8px;\">2. <span style=\"color:#ef4444;\">责任人识别失败</span>：Git blame 能覆盖 60%+ 的情况，Hindsight 知识库再覆盖 30%，剩下 10% 走 PMO 兜底。这个数字随知识库沉淀会变好。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 8px;\">3. <span style=\"color:#ef4444;\">多项目多平台</span>：一家公司可能同时有 Jira（主）+ 禅道（遗留项目）。Hermes 靠 `platform` 路由参数解决——根据\"微信支付\"这个关键词自动路由到支付团队的 Jira Project Key。</p>\n<p style=\"font-size:15px;color:#cbd5e1;line-height:1.85;margin:0 0 22px;\">4. <span style=\"color:#ef4444;\">隐私合规</span>：群消息全量监听必须经过安全评审。建议 `WECOM_LISTEN_GROUPS` 限定到业务群，不进人事、财务等敏感群。Hermes 提供 `hermes gateway audit` 命令导出所有监听记录供审计。</p>\n\n<p style=\"font-size:16px;color:#e2e8f0;line-height:1.9;margin:18px 0 12px;\">最后一点：这套闭环 <span style=\"color:#22c55e;\">90% 的能力是现成的</span>——Gateway 监听、MCP 桥接、知识库查询，这些在 Hermes 和 MCP 生态里都有了。真正需要写的是中间那个\"胶水层\"——把意图分类、owner 归属、Issue 创建串起来的 ~200 行 Python 逻辑。</p>\n\n<p style=\"font-size:15px;color:#64748b;line-height:1.8;margin:0 0 28px;\">但这 ~200 行的价值是巨大的——它把\"群里喊一声没人理\"变成\"7 秒内有人接\"，把业务团队和研发团队之间那条隐形的信息鸿沟填上了。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:40px 0 20px;\">—— 系列第五篇，完 ——</p>\n\n<p style=\"text-align:center;font-size:13px;color:#64748b;margin:0 0 30px;\">往期回顾：<br/>\n① Hermes Agent 连接企微 & 飞书 · ② A2A + SDLC 六阶段 Pipeline<br/>\n③ 企业知识库构建 · ④ WeKnora 活知识库</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
