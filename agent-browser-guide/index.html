  .wx-body .highlight{background:#fff6c8;padding:0 2px}
  /* 说明：正文的强调、卡片、表格一律用「行内 style」写在 body.html 里，

  .wx-body table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}

  /* ---------- 底部作者卡 + 互动栏 ---------- */
  .wx-footer{

  /* ---------- 响应式 ---------- */

  }
</style>

<script id="post-data" type="application/json">
{
  "title": "把浏览器交给 AI 之前，先读这一篇：agent-browser 上手",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月19日 10:43",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:24px 0 0;\"><img src=\"assets/cover.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">上周让 agent 帮我验证一个表单，它给出的结论是\"提交成功\"。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">我点开它留下的截图，一个 cookie 同意弹窗正好盖住提交按钮。它压根没点到，却报告成功。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这是浏览器自动化里最常见的一类假阳性：动作实际没发生，工具却返回了成功。Vercel Labs 的 <b>agent-browser</b> 就是冲着这类问题来的——它不返回\"已点击\"，点不到就直接报错。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它是一个 Rust 写的命令行工具，给 AI agent 一个能一条命令一条命令驱动的浏览器。Apache-2.0，Vercel Labs 出品。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这篇按实际用下来的顺序写：装、最小循环、快照怎么读、会话与登录、录制和对比、怎么交给 agent，最后是我踩过的坑。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">为什么不是再写个 Playwright 脚本</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">让模型直接写 Playwright 脚本，问题不在写不出来，在循环太慢：写完一段要跑、要读报错、要改，模型看不到中间状态。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">另一条路是 MCP 浏览器工具。工具定义和截图都是按 token 计费的，页面一复杂，单次调用就能吃掉不少上下文。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">agent-browser 走的是第三条：<b>把页面压成一段紧凑的文本，每条命令只返回几十行。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">打开 example.com，快照长这样：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">- link \"Learn more\" [ref=e1]</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">整页就一个可交互元素，一行。agent 拿 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">@e1</code> 去点，再快照一次确认页面变了。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">关键在于每一步都是一次独立的 shell 调用，浏览器由后台常驻，不会每步重启。所以 agent 可以用最擅长的 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">&amp;&amp;</code> 串命令，也可以一条一条看输出。</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/loop.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">核心就这四步，所有复杂流程都是它的组合</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有一个设计我一开始没注意到，但很重要：<b>动作在没法执行时失败，而不是假装成功。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">目标被隐藏、被禁用、在视口外、被别的元素盖住——比如那个 cookie 弹窗——点击就报错。你让 agent 先关掉弹窗、重新快照、再点。这个失败比成功有信息量。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">装：一行 npm，外加下载一个 Chrome</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">全局安装会拉对应平台的原生二进制，四条包管理器的命令都一样：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">npm install -g agent-browser<br/>agent-browser install</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第二条是下载 Chrome for Testing，只在第一次需要。macOS 也可以用 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">brew install agent-browser</code>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Linux 服务器上还缺浏览器依赖的系统库，加一个参数一起装：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">agent-browser install --with-deps</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">只是想试试，连装都不用：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">npx agent-browser open example.com</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">注意 npm 12、pnpm、Bun 默认会拦安装脚本。这个包里没有 postinstall，第一次运行时自己链接二进制，不用额外配置。但如果你装的时候带了 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--omit=optional</code>，二进制会被跳过，去掉这个参数重装。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">装完先做一次体检：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">agent-browser doctor</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它会检查平台、浏览器、以及后面录屏要用的 ffmpeg 编码器。有问题这一条命令就能看出来，比跑到一半失败强。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">原生二进制覆盖 macOS（ARM64 / x64）、Linux（ARM64 / x64，glibc 和 musl）、Windows x64。Windows 上直接在 PowerShell 里用就行，没有 WSL 的额外要求。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">最小循环：open、snapshot、点、再快照</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:2;\">agent-browser open example.com<br/>agent-browser snapshot -i<br/>agent-browser click @e1<br/>agent-browser get url<br/>agent-browser close</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">-i</code> 是 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--interactive</code>，只留按钮、链接、输入框这些能操作的元素。不加就是完整可访问性树，页面一大就刷屏。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">ref 有生命周期，这是最容易写错的地方：</p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 还在页面里的元素，ref 跨快照保持；同一文档内的更新不换号</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 元素被替换、页面跳转、iframe 换了，旧 ref 立即失效，号码不回收</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 节点没了但同 role、同 name 的元素唯一，它兜底指过去；有歧义就直接失败，不动</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 点链接跳页之后，一定要重新快照再操作</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">不想用 ref 也行，传统选择器和语义定位都支持：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:2;\">agent-browser click \"#submit\"<br/>agent-browser find role button click --name \"Submit\"</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">我更喜欢语义定位。<b>它按可访问性角色找元素，跟页面改版时的 class 变化无关。</b>ref 是给 agent 实时探索用的，语义定位是写给稳定脚本用的。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">等待也不要拍脑袋写 sleep。它有五个条件可以等：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">wait @e1<br/>wait --text \"Welcome\"<br/>wait --url \"**/dashboard\"<br/>wait --fn \"window.appReady === true\"<br/>wait --load domcontentloaded</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">官方文档里有一句提醒值得抄下来：等\"你想要的那个结果\"，而不是等某个生命周期事件。只有当你需要的里程碑恰好是 load 时，才用 load。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">同理，<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">networkidle</code> 能不用就别用。SSE、WebSocket、轮询、长连接都会让网络永不空闲，这个条件可能永远等不到。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">快照怎么读才不浪费 token</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">五个参数，按需叠加：</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">参数</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">作用</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">-i</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">只留可交互元素，日常首选</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">-c</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">压缩：保留可见文本和直接祖先，删掉空的分支</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">-d 3</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">限制树深度，复杂页面用</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">-s \"#main\"</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">只看某个区域，页面大的时候最有效</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">-u</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">给链接带上 href，抓取任务用</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">组合起来通常是这样：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">agent-browser snapshot -i -c -d 5</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">遇到没文字的图标按钮、canvas、或者需要确认版式，文本快照就不够了。这时候用带标注的截图：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">agent-browser screenshot --annotate ./page.png</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它会在每个可交互元素上叠一个编号，图上 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">[1]</code> 就对应 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">@e1</code>，同时把 ref 缓存住，可以直接点。截图出来还能顺手看一下版式有没有错位。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">顺带一个限制：标注截图目前只支持 CDP 路径（Chromium、Lightpanda），Safari / WebDriver 后端还没有。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">iframe 也不用自己切。快照会自动把 iframe 内容内联展开，子元素的 ref 自带 frame 上下文，直接 fill、click 就行。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">只有一层嵌套会被展开，跨域 iframe 拿不到可访问性树，会被静默略过。要单独看某个 iframe，先 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">frame @e2</code>，看完 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">frame main</code> 回来。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">会话、登录态，和那个常驻进程</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/arch.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">CLI 命令执行完就退出，浏览器活在 daemon 里</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第一条命令会拉起一个后台 daemon，之后每条命令都发给它，由它通过 CDP 操作浏览器。浏览器的状态就是这样在命令之间保留下来的。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">每个 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--session</code> 有独立的 daemon 和浏览器，cookie、存储、历史、登录态全部隔离。并行跑两个任务不会互相覆盖：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">agent-browser --session a open site-a.com<br/>agent-browser --session b open site-b.com<br/>agent-browser session list</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">也可以用环境变量 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">AGENT_BROWSER_SESSION</code> 固定住，省得每条命令都带参数。做多 agent 并行的时候，这个变量比命令行参数好管。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">闲置一小时没有任何命令，daemon 会关掉无头浏览器然后退出。配过 session 持久化的话，关之前会先存状态。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">登录态单独有一套命令：<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">state</code> 管状态存取，<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">auth</code> 管凭据，<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">profiles</code> 复用浏览器配置文件。要登一次反复用，先存 state，后面 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--state</code> 带上就行。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有一个细节挺贴心：每条命令只带自己要改的设置，daemon 会比对当前值，只处理差异。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">所以每条命令都写一遍 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--profile ./work</code> 不会反复重启浏览器。只有 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--profile</code>、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--headed</code>、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--proxy</code> 这类启动参数真的变了，才重启浏览器，daemon 本身不动。改动会打印在 stderr 上。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">浏览器也不限于它自己下的那个。想接管你已经登录好的 Chrome：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">agent-browser --cdp &lt;ws-url&gt; open localhost:3000<br/>agent-browser --auto-connect open localhost:3000</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还能换引擎（Lightpanda、Obscura）、驱动 iOS 模拟器里的 Mobile Safari，或者接 Browserbase、Browserless、Browser Use、Kernel、AgentCore 这类云浏览器。CI 里跑，云浏览器通常比自建更省事。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">6</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">验证动作真的生效了：diff</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这是我用得最多的功能。动作做完，别听 agent 汇报，直接看页面差分：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">agent-browser snapshot -i<br/>agent-browser fill @e3 \"test@example.com\"<br/>agent-browser click @e4<br/>agent-browser diff snapshot</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">输出是行级差分，<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">+</code> 是新增、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">-</code> 是消失，末尾给一句统计：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">- button \"Submit\" [ref=e4]<br/>+ button \"Submit\" [ref=e4] [disabled]<br/>+ status \"Sending...\" [ref=e7]<br/>3 additions, 2 removals, 3 unchanged</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">不带参数，它跟本会话上一次快照比；带 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--baseline before.txt</code> 就跟存档比。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">视觉回归直接用像素：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">agent-browser diff screenshot --baseline before.png<br/>agent-browser diff url https://staging.x.com https://prod.x.com --screenshot</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它会告诉你差了多少像素、占多少百分比，再生成一张标红的差分图。阈值默认 0.1，越大越宽容。两张图尺寸不一致时，它不会硬比，直接报尺寸不匹配。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>四个命令覆盖了我日常大部分验证需求：</b>改完看结构差、部署完看视觉差、上线前比环境差。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">需要给人看的演示，就录下来。录屏依赖 ffmpeg，Debian/Ubuntu 和 Homebrew 的默认构建都带 libvpx 和 libx264：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:2;\">agent-browser record start ./demo.webm --cursor<br/>agent-browser snapshot -i<br/>agent-browser click @e1<br/>agent-browser record stop</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--cursor</code> 会画一个带动画的指针和点击涟漪，Chrome 原生录屏是不带指针的，没有这个观众看不出点在哪。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">默认 30 帧。拖拽、动画这类要看单帧证据的用 60，长时间的浸泡测试用 10 省空间。加 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--contact-sheet</code> 还能顺带出一张带时间戳的关键帧拼图，最多 100 帧，只在画面变化超过阈值时才取帧。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">CI 里我的写法是录屏 + 兜底清理，失败了把 webm 当 artifact 传上去。文字日志看不出来的问题，一段 20 秒的录像基本一眼就懂。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">7</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">交给 agent：skills 机制解决版本漂移</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这是我觉得这套工具设计上最聪明的一处。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">大多数工具会把一份命令文档塞给 agent，然后 CLI 升级了、文档没更新，agent 就开始用过时的参数瞎试。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">agent-browser 的做法是：装进去的 skill 只是一个很薄的入口，里面写着\"去跑 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">agent-browser skills get core</code>\"。真正的指令由 CLI 在运行时提供，<b>永远和你装的这个版本对得上</b>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">装入口：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">npx skills add vercel-labs/agent-browser</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">不想装 skill，往 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">AGENTS.md</code> 里写三行也够：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">Use `agent-browser` for browser automation.<br/>Before the first use, run `agent-browser skills get core`<br/>and follow it.</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">自带的 skill 不止 core 一个，还有几个挺有意思的：</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">skill</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">干什么</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">core</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">核心循环、等待、表单、提取、会话、鉴权、差分，先看这个</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">dogfood</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">像真人一样用你的产品，找 bug 和体验问题，出带截图和复现视频的报告</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">derive-client</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">把站点网络流量录成 HAR，找出真实接口，生成不依赖浏览器的客户端</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2563eb;font-family:Menlo,monospace;\">electron</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">连接 Electron 应用的调试端口，操作 VS Code、Slack 这类桌面端</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">MCP 客户端不用这套：<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">agent-browser mcp</code> 会起一个 stdio 的 MCP server。不过要注意，MCP 快照默认只返回可交互元素，要文本得显式设 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">interactive: false</code>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">安全这块它把话说得很直白：<b>导航、动作、输出三类限制都是可选的，默认全不限制。</b>要收紧就自己配域名白名单、动作策略、内容边界。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">项目目录下的 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">agent-browser.json</code> 只认一小撮无害字段。像 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">extensions</code>、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">initScripts</code>、state、policy 这些，写在项目配置里会被忽略并给一条警告。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这条设计我理解为：<b>别让一个 clone 下来的仓库，悄悄改掉你本机浏览器的行为。</b>高级配置放 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">~/.agent-browser/config.json</code>，或者用 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--config</code> 显式加载你信任的文件。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">8</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1a1a1a;margin:14px 0 14px;border-bottom:1px solid #e5e5ea;padding-bottom:9px;\">用下来，六个值得记住的点</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>1. 先 <code style=\"background:#f2f2f7;padding:1px 4px;border-radius:3px;font-size:13px;\">-i</code>，再考虑别的。</b>完整快照在真实站点上经常几百行，agent 读进去就开始发散。看不到想要的东西再加 <code style=\"background:#f2f2f7;padding:1px 4px;border-radius:3px;font-size:13px;\">-c</code> 或 <code style=\"background:#f2f2f7;padding:1px 4px;border-radius:3px;font-size:13px;\">-s</code>，别一上来就要全量。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>2. 每条动作后都值得加一次 diff。</b>尤其是提交、删除、审批这类不可逆操作。差分的几十行，比 agent 的一句\"已完成\"可信得多。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>3. 报错别当故障，当提示。</b>点击失败八成是被弹窗挡住、在视口外、或者按钮禁用。按它说的做：关掉遮挡、重新快照、重试，成功率会高很多。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>4. 并行任务一定要开 session。</b>默认会话是共享的，两个 agent 同时跑，cookie 和导航历史会互相污染。用 <code style=\"background:#f2f2f7;padding:1px 4px;border-radius:3px;font-size:13px;\">--session</code> 隔开，或者用 <code style=\"background:#f2f2f7;padding:1px 4px;border-radius:3px;font-size:13px;\">session id --scope worktree</code> 生成一个跟工作区绑定的稳定 id。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>5. 录屏记得开 <code style=\"background:#f2f2f7;padding:1px 4px;border-radius:3px;font-size:13px;\">--cursor</code>，并在 close 之前 stop。</b>没有指针的录像，人看不懂操作发生在哪；直接 close 会丢最后一小段。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>6. 它默认是不设防的。</b>给自己的机器用没问题，接生产环境或跑不可信页面之前，先把域名白名单和动作策略配好。默认值信任的是你，不是页面。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;line-height:1.7;padding:30px 0 6px;\">让 agent 用浏览器的难点，<br/>从来不是它会不会点，<br/>而是你怎么知道它点到了。</p>\n\n<p style=\"margin:14px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">agent-browser 把答案拆成了三件事：页面变成可读的文本、动作失败就明说、变化可以用差分验证。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">三件都不复杂，但凑齐之后，\"AI 操作浏览器\"这件事才第一次变得可以验收。</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:32px 0 0;font-size:14px;line-height:2;color:#2b2b2b;\">\n<b>相关链接</b><br/>\n· 文档：agent-browser.dev<br/>\n· 仓库：github.com/vercel-labs/agent-browser<br/>\n· 安装：npm install -g agent-browser &amp;&amp; agent-browser install<br/>\n· 许可：Apache-2.0\n</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
