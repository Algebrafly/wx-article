<script id="post-data" type="application/json">
{
  "title": "AI 编程助手最大的毛病是急着写代码，这套开源工具专治它",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月17日 06:19",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 26px;\"><img src=\"assets/workflow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">从一句话到一次合并，中间要过的七道关。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">今天想聊的是 Superpowers，一套专门给编程智能体的开发方法论，作者是 Jesse Vincent，MIT 协议开源，Claude Code、Codex、Cursor、Gemini CLI 这几种主流的都能装。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它有个地方很不一样。绝大多数插件想的是怎么给智能体加能力，它想的是怎么给智能体上纪律。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">它管的不是能力，是纪律</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">装上之后，最先变化的是开头。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">你说帮我做个什么，它不会立刻打开编辑器。它会先退一步，反问你到底想解决什么。等把你的需求问清楚了，它把设计一小段一小段摆给你看，等你点头。点完头才去写计划，写完计划才动代码。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">听起来只是慢了一点点，但这个顺序本身就是它全部的价值。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这套东西由二十来个技能组成，中间第 4 到第 6 步会单独展开讲。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它为什么能做到自动接管，是因为每个技能的描述里都写死了它什么时候必须上场。负责总纲的那个技能里有句原话，我照抄：只要你觉得某个技能有哪怕 1% 的可能适用，就必须调用它。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">而且它不是只对智能体狠。它还立了一条优先级：<strong style=\"font-weight:bold;\">你写在 CLAUDE.md 里的明确要求 > 这套技能 > 系统的默认行为。</strong>你的话永远最大，哪怕你说的是别用 TDD。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">装它，三行都不用到</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">Claude Code 已经把它收进了官方插件市场，一行就够。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">/plugin install superpowers@claude-plugins-official</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">如果你习惯用作者自己的市场，把上面那条换成这两行。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">/plugin marketplace add obra/superpowers-marketplace<br/>/plugin install superpowers@superpowers-marketplace</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">换别的智能体也不麻烦。Gemini CLI 是扩充，Cursor 在对话框里加插件，Codex 走它自己的插件市场。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">gemini extensions install https://github.com/obra/superpowers</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">装完不用记命令，也不用背技能名。它会在该出场的时候自己出来。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例一，动手之前先把话问清楚</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第一个技能叫 brainstorming，管的是需求。它的规矩是整个体系里最硬的一条：<strong style=\"font-weight:bold;color:#2563eb;\">在把设计摆出来、并且被用户点头之前，不许调用任何实现类技能，不许写任何代码，不许搭任何脚手架。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它问问题的方式也很克制。一次只问一个，能出选择题就出选择题，绝不一口气甩你八个问题让你自己消化。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我特别喜欢它提前堵的一个洞。它专门写了一段，说别拿「这个太简单了，不需要设计」当借口。一个待办清单、一个工具函数、改一行配置，全都要走一遍。设计可以短到几句话，但必须摆出来让你确认。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">理由写得很实在。越是简单的项目，越是那些没被审视过的假设在浪费工时。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最后它会把确认过的设计写成一份文档，存进仓库、提交，然后请你自己再读一遍。你说行，才进下一步。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">还有一个细节值得说。它要求先给你 2 到 3 个方案，讲清各自的取舍，并且先讲它自己推荐的那个和理由。不是给你一堆选项让你自己想。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">让智能体替你收敛选项，而不是把选择的负担推给你，这一条很多工具都做不到。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例二，把计划细到能照着抄</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">设计通过了，下一步是 writing-plans。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它写计划的时候，假定的读者是一个热情、品味一般、对项目毫无了解、而且天生不爱写测试的初级工程师。所以每一句话都得写死。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">粒度是这样切的，一个步骤一个动作，控制在两三分钟。写一个失败的测试，算一步。跑一遍确认它失败，算一步。写最少的代码让它通过，算一步。再跑一遍确认通过，算一步。提交，又算一步。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">而且它明令禁止占位符。这些东西被它定义为计划失败，一个都不许出现。计划长这样：</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.8;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">- [ ] 写失败的测试<br/>- [ ] 跑一遍，确认它以预期原因失败<br/>- [ ] 写最少实现<br/>- [ ] 跑一遍，确认通过<br/>- [ ] 提交</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">对应文件路径要写全，代码要贴完整，命令要带上预期输出。不许写「加上适当的错误处理」，不许写「测试同上」，也不许写「你自己翻译一下」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">写完之后它自己会再审一遍，问三个问题：设计里的需求是不是每条都有对应任务，有没有残留的占位符，前一个任务里叫 clearLayers 的函数到了后面是不是还叫这个名字。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;\">一份好计划的标准，是把判断留在写计划的时候，让执行的人只需要照着做。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例三，没看见测试红过就不许写实现</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">轮到动手了，先上场的是 TDD 技能。它的铁律只有一句：</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;line-height:1.6;margin:30px 0;\">没有任何一行生产代码，<br/>是在一个失败的测试之前写下的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">循环本身大家都会背。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/tdd.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">红绿重构，外加它自带的铁律。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最能看出性格的是它对违规的处理。如果你先写了实现，再回头补测试，它要求你把那段代码删掉，从头来。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">不留作参考，不边写测试边把它改成能过的样子，甚至不许回头看。删就是删，实现从测试里重新长出来。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这么偏执的原因它写得明明白白。测试写在代码之后，它一上来就是绿的。而一上来就绿的测试，什么都证明不了。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">你亲眼看着它红过，才知道它真的在测东西，而不是在给你鼓掌。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">示例四，没找到根因就不许动手</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">出 bug 的时候，用的是 systematic-debugging。它的铁律同样只有一句：没走完第一阶段，不许提出任何修复方案。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/debug.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">四个阶段，以及一条很硬的止损线。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它点名了几种最该用这套的场景，我读的时候觉得它很懂人。越是着急的时候越要用，越是看着像「就一行的小问题」越要用，越是已经试了好几个修法的时候越要用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还给了一组很有说服力的经验数字。按流程走，十几分钟到半小时修好，一次到位率大概九成半。随手乱改，两三个小时还在原地打转，一次到位率四成。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我最服的是那条止损线。<strong style=\"font-weight:bold;\">同一个问题修到第三次还没好，停下来，别再修了，去质疑架构。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它的判断是，连续三次修不好，通常不是你假设错了，是架构本身有问题。修一次冒出一个新问题，换个地方又冒一个，这就是信号。这时候该跟人讨论的是要不要重构，不是再试第四次。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">它最狠的地方，是把借口先堵死</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这部分我觉得是整套东西里最值得偷师的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">几乎每个技能里都躺着一张对照表，左边写成你可能会有的念头，右边写现实。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/excuses.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">写规则的人和用规则的人，都清楚自己会怎么偷懒。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">还有一个技能专门管收尾，叫 verification-before-completion。它的铁律是，没有当场跑出来的验证证据，不许说完成。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它对措辞的要求细到有点好笑。只要开始出现「应该能行了」「大概没问题」「我很有把握」，就说明在没有证据的情况下宣称成功。测试通过不能靠上一次的结果，构建成功不能靠编辑器没报错，子智能体说做完了也不能直接信，得去看 diff。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 48px;\">说白了，这套东西真正的对手不是 bug，是你我都有的那种差不多就行了。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">当然，也有人会嫌它啰嗦。它确实会让你多等几步，多回答几个问题，多写几遍测试。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">但它把一件很难自动化的事做成了纪律：让智能体在动手之前先想清楚，在说好了之前先验证过。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">能力决定它能写多快，纪律决定你敢不敢用。</strong></p>\n\n<p style=\"text-align:center;margin:30px 0 12px;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:bold;padding:10px 22px;border-radius:8px;\">Superpowers · obra/superpowers · MIT</span></p>\n\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;line-height:1.7;margin:6px 0 24px;\">技能清单与原文取自本地安装的 5.1.3 版本，作者 Jesse Vincent。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
