<script id="post-data" type="application/json">
{
  "title": "Claude 刚发的 AI-native SDLC Playbook，我把核心方法整理出来了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月23日 16:20",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 22px;\"><img src=\"assets/shift.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">代码不再是瓶颈，慢的是人走过的流程。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">前几天读完 Claude 刚发的 The AI-native SDLC Playbook，40 分钟的原稿被我翻了两遍。最打动我的不是某个具体工具，而是它的开篇判断。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#1a5fb4;\">Code is no longer the bottleneck.</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">代码不再是瓶颈。现在 Agent 写代码的速度，远超周围那些还得靠人一步步走的流程。规划、评审、测试、部署、审批，这些原本是为了控制人而设计的环节，反而成了最大的阻塞。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这篇 playbook 讲的就是怎么把整个软件开发生命周期重新设计一遍，让流程跟得上 Agent 的生产力。我把核心概念和实践方法整理了一下。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">AI-native SDLC 到底是什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它不是简单地在每个阶段加一层 AI 辅助。传统 SDLC 是线性的，需求、设计、开发、测试、发布、运维，每个阶段由不同角色负责，靠文档、工单、签名来交接。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">AI-native SDLC 把它改成了一个循环。每个阶段结束都提交一份 artifact，下一段直接读取。人类的注意力从「启动每个阶段」转移到「在关键节点做判断」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Playbook 里有一句话我记了下来。Human judgement stays above it. 人类的判断在循环之上，而不是被嵌进循环里疲于奔命。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还有另一个名字，agentic SDLC，或者 agentic software development。标签不同，说的是同一件事。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">六个阶段怎么变</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Plan 阶段，不再靠 backlog  refinement 和故事点。提出想法的人直接用自然语言跟 Claude 聊，聊清楚问题、期望结果、约束和开放问题，输出一份 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">intent.md</span>。产品负责人审阅后通过。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Design 阶段，需求和设计被压缩成一次会话。Claude 拿着 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">intent.md</span>，在品牌、安全、合规、UX 等 skill 约束下生成 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">spec.md</span>。产品 owner 审 spec，但不写 spec。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Build 阶段，工程师从 plan mode 开始。先让 Claude 读代码库，读 intent 和 spec，生成一份 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">plan.md</span>，列清楚改哪些文件、按什么顺序、怎么证明正确。人审完 plan，Claude 再去实现。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Test 阶段不是等 QA 来 gate。每个 Claude 会话都被给了一个反馈回路，跑测试、跑构建、截图对比，自己迭代到通过。配置变更还要经过持续 evals 回归测试。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Deploy 阶段，AI 参与 PR review，按 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">REVIEW.md</span> 里定义的策略跑多轮检查。人类 reviewer 只做判断：意图对不对，风险能不能接受。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Maintain 阶段最不一样。触发器发现异常后自动调用 Claude，诊断、写 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">intent.md</span>、走修复流程。告警不再只等人。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">贯穿始终的 artifact 链</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Playbook 里反复强调一个概念：committed artifact。每个阶段结束都要提交一份可被下一阶段读取的 artifact，并且写进版本控制。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Plan 提交 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">intent.md</span>，Design 提交 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">spec.md</span>，Build 提交 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">plan.md</span> 和代码 diff，Deploy 留下 PR review 记录，Maintain 留下 incident 和修复记录。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/artifacts.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">一连串 commit 本身就是审计轨迹。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这条链有两个好处。第一，Agent 在每个阶段都知道上一阶段想要什么，不需要人反复解释。第二，审计天然存在，谁提的需求、Agent 做了什么、谁批准的，全在 git 历史里。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">早期阶段 artifact 主要是 markdown，因为产品经理和 Agent 都能读能写。Build 之后 artifact 变成代码和记录。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">三层控制模型</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">流程变快了，控制不能丢掉。Playbook 把控制分成了三层，从软到硬。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最软的是 <strong style=\"font-weight:bold;color:#1a5fb4;\">Skills</strong>。把组织的规范、安全标准、API 设计约定写成 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">SKILL.md</span>，放在 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">.claude/skills/</span> 里。Claude 在相关场景自动加载，写代码时就参考。Skill 是建议性的，让违规变少，但不强制。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">中间是 <strong style=\"font-weight:bold;color:#1a5fb4;\">Hooks</strong>。PreToolUse 脚本在 Claude 执行动作前运行，返回 allow、ask 或 block。比如禁止改测试文件、禁止读 secrets、生产部署必须有人授权。Hook 是确定性的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最硬的是 <strong style=\"font-weight:bold;color:#1a5fb4;\">Permissions + Sandbox</strong>。工具级 deny 控制 Claude 能读什么、能调什么命令。Sandbox 做 OS 级隔离，限制网络出口和凭证访问。Managed settings 则由平台团队统一下发，工程师本地无法覆盖。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/controls.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">Skill 减少错误，Hook 阻止错误，Sandbox 把错误关进笼子。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">怎么开始用</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Playbook 没有建议你一次性改造整个组织。它的路径是渐进的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">个人可以先从 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">CLAUDE.md</span> 和 plan mode 开始。在项目根目录跑 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">/init</span>，让 Claude 生成一个初始版本，然后删掉冗余，只保留新成员第一天需要知道的东西。构建命令、测试命令、约定、Claude 常犯的错误。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">团队级开始共享 CLAUDE.md 和 skills。把反复出现的规范写成 skill，把 PR review 策略写成 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">REVIEW.md</span>，让 Claude 参与 incoming PR 的初筛。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">部门级把 evals 放进 CI。每次 CLAUDE.md 或 skill 变更都跑一组真实任务的回归测试，确保配置改动不会把 Agent 带偏。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">企业级则要上 managed settings 和 sandbox。平台团队通过 MDM 或 admin console 统一下发权限、hook、插件市场白名单、MCP server 白名单，工程师无法本地绕过。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/adoption.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">不用等组织改造完才动手，artifact 链是第一步。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个具体例子。如果你今天只想试一件事，就在下次改需求时，别直接让 Claude 写代码。先让它读 intent，生成 plan.md，你自己审一遍计划再让它动手。单是这一步，就能少踩很多坑。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">它真正改变的不是速度，是分工</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">读完整篇 playbook，我的感受是，它不是在教人怎么用 AI 写更多代码。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它是在重新定义谁对什么负责。Agent 负责执行和自检，人类负责判断和把关。流程从「人推着事走」变成「事在循环里跑，人只在关键节点点头或叫停」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这个转变很难一蹴而就。因为它要求你把规范变成代码、把审批变成 hook、把知识变成可版本控制的文件。表面上是在改工具，实际上是在改组织习惯。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">但反过来看，一旦这些基础设施到位，团队的杠杆会变得非常大。一个人能同时 orchestrate 多个 Agent session，一个监控异常能自动触发修复流程，一个规范变更能通过 skill 在几分钟内同步到所有人。</p>\n\n<p style=\"border-left:4px solid #1a5fb4;padding:14px 18px;background:#f3f7ff;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\nThe loop keeps running. Human judgement stays above it.\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">循环持续运行，人类的判断始终在它之上。这可能是 AI-native SDLC 最简洁的总结。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
