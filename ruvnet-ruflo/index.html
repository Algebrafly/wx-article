<script id="post-data" type="application/json">
{
  "title": "Claude Flow 改名 Ruflo：100+ Agent、314 工具、跨机器联邦通信",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月26日 11:05",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 22px;\"><img src=\"assets/arch.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">模型 + 基座。Ruflo 就是那个基座。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">rUv 上个月把 Claude Flow 重命名成了 Ruflo，然后一口气推到了 v3.8。我翻了它的中文 README，又对比了 benchmarks。这东西比我一开始预期的野心大得多。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它的定位写在第一行。智能体 = 模型 + 基座（Harness）。模型负责写作，基座给它工具、记忆、循环、沙箱和控制能力。Ruflo 就是那个基座，围绕 Claude Code 和 Codex 转。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">先讲概念，再讲怎么装。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">它到底是什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">架构自上而下分五层。最上面是用户入口，Claude Code 或 CLI 或 MCP。下面是编排层，MCP Server、Router、27 个 Hooks。再下面是 Swarm 协调，蜂后主导的拓扑。然后是 100+ 专用智能体。最底下是记忆、学习和 LLM 提供商。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">架构里有一条虚线从 Memory 层绕回 Swarm 层，标着 Learning Loop。这是 Ruflo 的核心设计之一。Agent 每次成功的行为都被 SONA 神经模式学习并固化进 ReasoningBank。下次类似任务路由到这个 agent 时，它已经读过之前怎么成功过。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">记忆层用的是 AgentDB，一个 HNSW 向量数据库。README 里给了实测数据。N=20k 时比暴力检索快约 1.9 倍，N=5k 时快 3.2–4.7 倍，recall@10 约 0.99。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">100+ Agent + 35 插件 + 314 MCP 工具</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Ruflo 目前有 100+ 专用 agent，覆盖编码、测试、安全、文档、架构。插件分成 8 类。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/plugins.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">35 个插件，从编排到领域专用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">核心与编排这一类最值得关注。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">ruflo-swarm</span> 让多个 agent 作为团队协作，共识机制支持 Raft、拜占庭容错、Gossip。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">ruflo-federation</span> 让跨机器、跨组织的 agent 能零信任地通信。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">联邦这块的设计挺有意思。你的 agent 加入联邦，mTLS + ed25519 完成身份验证。出站消息自动走 14 类 PII 扫描流水线，根据信任级别决定 BLOCK、REDACT、HASH 或 PASS。对等方的信任评分实时计算，公式是 0.4×success + 0.2×uptime + 0.2×threat + 0.2×integrity。降级即时生效。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">还有一个 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">ruflo-sparc</span>，带质量门的 5 阶段引导式开发方法论。以及 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">ruflo-arena</span>，竞争性 ruliology，让 agent 策略在锦标赛里对决，胜者爬山优化。听起来很硬核。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">对比一下</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它官方给了一张对比表，左边是纯 Claude Code，右边是加上 Ruflo。摘几项出来：</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/compare.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">把 harness 装上之后，智能体的能力边界大幅外扩。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">基准测试方面，README 说 v3.8.0 在 darwin-arm64 和 linux-x64 上对 LangGraph、AutoGen、CrewAI 有 SOTA 表现，冷启动、单轮、RSS 上快 1.3× 到 1953×。Rust 内核的优势在这体现得很明显。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">怎么装</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">有两条完全不同的安装路径。</p>\n\n<p style=\"background:#12141a;color:#e6e8ee;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\"># 路径 A · 插件（轻量）\n# 只装斜杠命令和少量 agent 定义，工作区零写入\n/plugin marketplace add ruvnet/ruflo\n/plugin install ruflo-core@ruflo\n/plugin install ruflo-swarm@ruflo\n\n# 路径 B · CLI 全装（生产级）\n# 98 个 agent，60+ 命令，30 个 skill，全部 MCP\ncurl -fsSL https://cdn.jsdelivr.net/gh/ruvnet/ruflo@main/scripts/install.sh | bash\n# 或用 npx（所有平台，包括原生 Windows）\nnpx ruflo@latest init wizard\nnpm install -g ruflo@latest</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/paths.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">两条路径覆盖范围差很多。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">如果要把 Ruflo 当作独立 MCP server 加到 Claude Code，一条命令：</p>\n\n<p style=\"background:#12141a;color:#e6e8ee;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">claude mcp add claude-flow -- npx ruflo@latest mcp start</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Windows 用户注意。curl 那条需要 POSIX shell（WSL、Git-Bash、MSYS）。PowerShell 和 cmd 里直接用 npx 那一行就行，两条路径最终都是同一个 init 流程。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">第一次用是什么感觉</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">README 有个细节我特别喜欢。第一次用 Ruflo，你不需要先学会 314 个 MCP 工具或 26 条 CLI 命令。执行完 init 之后，像平常一样用 Claude Code 就行。钩子系统会自动路由任务、从成功模式中学习、在后台协调智能体。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还自带一个 MetaHarness，给你的 AI agent 配置打分（1–100）、扫描工具配置里的安全风险、做项目快照捕捉长期回归、找到匹配的模板。跑完以后可以用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">ruflo eject</span> 把 ruflo 项目抽成独立 agent 工具包。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">另外 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">ruflo verify</span> 能密码学证明已安装的字节和签名见证一致。这一条对企业环境很重要。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">我的判断</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Ruflo 在做的事情，本质上是把 Agent 工程化的所有东西打包成一个完整的 harness。Swarm、记忆、自学习、联邦通信、安全护栏、可观测性，全是现成的组件，不用你自己拼。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它的野心比 LangGraph、AutoGen、CrewAI 大得多。后者主要是编排框架，Ruflo 是把整个运行态都覆盖了。不过这种全栈也意味着上手曲线更高。CLI 装完会往工作区写 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">.claude/</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">.claude-flow/</span>、<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#1a5fb4;\">CLAUDE.md</span> 等辅助文件，这一点要清楚。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">如果你只是想试一个功能，走插件路径就好，不要上来就 CLI 全装。</p>\n\n<p style=\"border-left:4px solid #1a5fb4;padding:14px 18px;background:#f3f7ff;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\n智能体 = 模型 + 基座。模型负责写作，基座让它能协作、能记住、能自己跑。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">MIT 协议，Rust 内核。仓库在 github.com/ruvnet/ruflo。</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
