<script id="post-data" type="application/json">
{
  "title": "让每一次提问都命中公司内部最准的那一段：企业级知识库（RAG）实战",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月24日 10:07",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">去年底跟一位创业不久的产品负责人吃饭。他说最想解决的问题不是 AI 不够强，是<strong style=\"color:#1f2937;\">同一个问题，三个人给出三个答案</strong>。客服、产品、客户成功，各自记在各自的地方，谁也没把谁的答案当回事。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">我自己也遇到过。公司有一套产品手册、一套客服话术、一套群聊沉淀，三套都说自己是\"官方口径\"。新同事来问一个问题，最常见的开场是\"你先自己搜一下，不对再来找我\"。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">这就是行业知识库（RAG）最核心的价值：<strong style=\"color:#2c68ff;\">它不创造新的知识，它让已经有的知识，能被每次都用到</strong>。</p>\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/cover.png\" style=\"width:100%;\" /></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;margin:0 0 30px;\">让每一次提问，都命中公司内部最准的那一段</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">RAG 对企业发展，到底意味着什么</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">先把 RAG 是什么放一边，先说它要解决的四个具体问题。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\"><strong style=\"color:#1f2937;\">第一个问题：新员工上手慢。</strong>一家做企业服务的公司，平均一个新销售要花 2.1 个月才能独立跟客户聊报价。这段时间里，他们主要在做一件事：到处找人问。问产品同事、问客户成功、翻老合同、看群聊截图。这些东西本应该是结构化的知识，结果全在人肉搬运。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\"><strong style=\"color:#1f2937;\">第二个问题：经验在离职时跟着人走。</strong>一个老客服带不走他的微信群，但是带得走他对\"这个客户要怎么安抚\"的判断。一家业务做了五年的公司，客服主管换了三次，每换一次，客户群里的回答风格就换一次。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\"><strong style=\"color:#1f2937;\">第三个问题：文档和群聊互相打架。</strong>产品手册里写着 A 政策，客户群里实际执行的是 B 口径。当客户拿着群聊记录来质疑时，你拿什么说服他？谁才是最终版本？</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\"><strong style=\"color:#1f2937;\">第四个问题：审计和合规。</strong>哪些回答是谁在什么时候写的，有没有经过审批，有没有过时，有没有被修订——这些问题在金融、医疗、政务等行业里不是可选项，是必须。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">RAG 把这四个问题，压到一个模型里来解决：<strong style=\"color:#2c68ff;\">把散在各处的知识统一纳入，让每次回答都能追溯出处，让每次修订都有历史可查</strong>。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">这四个问题，在企业的四个发展阶段影响不同。早期公司，新员工上手慢影响销售；中期公司，口径不统一影响口碑；成熟期公司，经验传承影响成本和效率；规范行业里，审计合规影响的是能不能继续经营。RAG 不是一个\"AI 玩具\"，是企业知识资产的统一出口。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">现代 RAG 框架能做到什么</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">如果说 2023 年的 RAG 还只是\"把 PDF 丢进去，搜一下\"，2026 年的开源 RAG 框架已经演进到能覆盖企业知识管理的全链路。国内已经有团队把这套框架开源出来，从文档解析、混合检索、引用溯源、Wiki 自动生成到 Agent 协作，做成了一套完整的系统。下面几截图来自我们参考这套开源项目的能力做的演示界面，不是真实产品截图，只是用于展示它能做到什么。</p>\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/dashboard.png\" style=\"width:100%;\" /></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;margin:0 0 30px;\">仪表盘一眼看到有多少文档、多少问答、一次解决率和活跃团队</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">这个仪表盘展示了四个关键数据：已入库文档总数、本月问答次数、一次解决率、活跃成员数。右侧的高频问题 TOP 5 是自动从本月问答里聚类出来的——这张图里\"退款一般多久到账？\"是本月被问最多的问题，说明这个业务场景对统一口径的需求最高。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">下面的\"最近入库与同步\"则能看到每个知识源的状态：哪些在自动同步、哪些完成了、哪些因为令牌过期失败。这一点对运维团队很重要——如果一个数据源停了两天没人发现，那基于它的所有回答都变成了空转。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">多源接入：文档、群聊、工单一起入库</p>\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/sources.png\" style=\"width:100%;\" /></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;margin:0 0 30px;\">八个来源，自动同步 + 手动导入，每条能看见增量和状态</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">现在的 RAG 框架不再只接 PDF 和 Word。飞书 Wiki、Confluence、企业网盘、GitLab docs、Notion、RSS——都能一键对接，定时同步。更重要的是，客户群聊记录和工单系统里的历史处理记录也能作为知识源入库。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">截图里能看到，\"客户群 · 售后一班\"这条是手动历史导入，一次性导入了 1842 条对话。\"工单系统 · 所有工单\"则是自动增量同步，每天把新产生的处理记录加进去。这些真实的客户问法和实际处理方式，比任何写在手册里的标准答法都更有价值。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">也能看到一条失败记录：Confluence 全量同步因为令牌过期失败了，状态标红。这比\"静默失败\"好——知识源挂了，必须让运维第一时间知道。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">对话与检索：回答带出处，路径可追溯</p>\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/query.png\" style=\"width:100%;\" /></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;margin:0 0 30px;\">每一次回答都附引用卡片，右侧显示检索路径和各知识源贡献度</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">回答的质量从来不是\"像不像人说的话\"。对于企业来说，更重要的是<strong style=\"color:#1f2937;\">这句话从哪来的、谁批准过</strong>。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">这张截图展示了一次典型的问答：用户问年付合同里能不能加退款条款。AI 助手不仅给出了两个前提条件，而且在下面列出了三条参考来源——《企业版合同条款指南 2026》第 7.2 节、客户成功 FAQ Q21、2026 年销售政策。每张卡片都能直接点开原文，看到具体的段落。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">右侧面板是内部可见的检索路径：先向量召回 128 条，再关键词检索 42 条，重排模型挑 Top-3 交给生成模型。知识源贡献度也列得清清楚楚——售后手册贡献了 82%，销售政策 67%，FAQ 54%。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">这个右侧面板不是给用户看的，是给内部运营看的。如果答偏了，运营能立刻看到问题出在\"检索召回\"还是\"重排\"还是\"模型生成\"。这让 RAG 的效果可以持续迭代，而不是\"上线之后碰运气\"。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">自动 Wiki：知识图谱把散落的东西串起来</p>\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/wiki.png\" style=\"width:100%;\" /></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;margin:0 0 30px;\">自动生成的 Wiki 页面，右侧知识图谱展示\"退款政策\"关联的所有实体</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">更进一步的能力是自动 Wiki。框架从所有入库的文档和对话里提取出\"人、产品、概念\"三类实体，把它们之间的关联画成知识图谱，并自动生成可浏览的 Wiki 页面。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">截图里的\"退款政策\"页面就是自动生成的。页面内容本身来自三份不同的资料——企业版合同指南、客服 FAQ、工单系统。右侧的知识图谱节点展示了它关联的所有实体：销售政策、合同指南、FAQ Q21、工单 #8821、客户王女士、产品组。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">这张图谱有一个经常被忽视的价值：<strong style=\"color:#2c68ff;\">它帮你发现隐性关联</strong>。当有人在客户群里问一个新问题，图谱能告诉你这个问题在知识库里已经关联了哪些历史案例和政策，而不只是\"有没有 exact match\"。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">页面底部显示所有来源和编辑历史——2026-11-21 自动合并、2026-11-18 李然手动校正、2026-11-05 初次生成。任一条回答追溯回去，你都能看到它经过了谁的手、什么时候做了什么改动。这不是额外功能，是合规的基础。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">使用记录：每一次问答都是审计日志的一行</p>\n<p style=\"text-align:center;margin:30px 0 8px;\"><img src=\"assets/records.png\" style=\"width:100%;\" /></p>\n<p style=\"font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;margin:0 0 30px;\">使用记录面板：同步、上传、查询、定时任务全部有时间戳、操作者、结果、耗时</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">企业里最容易被忽略的一点：<strong style=\"color:#1f2937;\">你的知识库必须有审计日志</strong>。每一次谁查了什么、命中了哪些资料、回答是否需要转人工、哪个同步失败了——这些记录不只是运维需要，审计、合规、安全都需要。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">上面这张\"使用记录\"面板就是审计视角下的 RAG：同步、上传、查询、定时任务，每一条都有精确到秒的时间戳、操作者身份、目标资源、执行结果和耗时。我可以筛出过去 24 小时里\"低置信度转人工\"的所有问答，看看是不是检索出了问题；也可以导出 CSV 让法务去核对某段时间里给某个客户的所有答复。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">顶部四个统计卡片分别是：今日有 18 个不同的人在用、API Key 配额还剩 100%、有 2 个同步告警待处理、近 7 天有 3 次查询失败。把这四个数盯紧，知识库的健康状态就有一半握在手里了。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">怎么判断你该不该上</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">最后说一下适合谁、不适合谁。这件事不是\"所有公司都该上\"，判断标准也很简单——回答我三个问题：</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">第一，你的团队是不是已经超过 20 个人？人太少的时候，靠群聊和会议还能 cover。超过 20 人之后，新同事需要的信息成本开始指数上升。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">第二，你的业务里是不是已经有了大量散在各处的知识——群聊、文档、工单、历史邮件、老合同？这些东西越多、越零散，RAG 的价值越大。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">第三，你的回答是不是需要准确到\"有出处\"？如果回答错了只是不好意思，那不用急。但如果回答错了会丢合同、吃罚单、产生合规风险，那这件事就不是\"要不要上\"，是\"什么时候上\"。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">满足三条里的两条，就值得认真评估。只满足一条的话，先用轻量方案试试水，比如只接一个知识源、只服务一个团队，跑两个月再说。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">参考的那套开源框架提供了 Docker Compose、Kubernetes Helm、Lite 单文件、桌面端四种部署方式，小团队从 Lite 开始就能快速跑起来；企业版需要的多租户、RBAC、审计日志、私有云部署也都齐了。从第一天只用一个小知识库开始，到覆盖整个公司的知识中枢，有一条渐进的路可以走。</p>\n\n<p style=\"text-align:center;font-size:20px;line-height:1.7;font-weight:bold;color:#1f2937;margin:44px 0 10px;\">行业知识库不是一个\"聊天机器人\"。</p>\n<p style=\"text-align:center;font-size:20px;line-height:1.7;font-weight:bold;color:#2c68ff;margin:0 0 34px;\">它是公司知识资产从\"散落\"到\"可调用\"的一次升级。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">真正的价值不在\"AI 很聪明\"，而在于：新同事不用再到处找人问，老同事走了经验不会跟着丢，客户群里的回答终于有了统一口径，合规审查时每一句话都能追溯到原文。</p>\n<p style=\"font-size:16px;line-height:1.9;color:#374151;margin:0 0 22px;\">AI 只是让这件事变得自动化。但该做这件事的核心理由，跟 AI 没有半毛钱关系——它一直存在，只是现在终于有了一个性价比还不错的解法。</p>\n\n<p style=\"margin:46px 0 10px;border-top:1px solid #e5e1f0;padding-top:22px;\"><span style=\"font-size:15px;font-weight:bold;color:#1f2937;\">说明</span></p>\n<p style=\"font-size:14px;line-height:1.9;color:#6b7280;margin:0 0 8px;\">文中界面截图为参考业界开源 RAG 框架能力特性所做的功能演示，不含任何厂商商标、Logo 或官方 UI 复刻；所有界面元素、配色与数据均为示例。</p>\n<p style=\"font-size:14px;line-height:1.9;color:#6b7280;margin:0 0 8px;\">企业上线前请按所在行业要求完成数据授权、脱敏与合规评估，优先在内部网络或私有云环境部署。</p>\n<p style=\"font-size:13px;line-height:1.8;color:#9ca3af;margin:16px 0 0;\">开源框架版本迭代较快，具体功能与部署方式请以其官方文档为准。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
