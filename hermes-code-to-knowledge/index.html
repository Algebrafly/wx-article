<script id="post-data" type="application/json">
{
  "title": "代码自动编译成知识：Hermes 每日把 feature/fix 提交写进企业知识库",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月3日 09:53",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#e6edf3;margin:10px 0 4px;\">代码是唯一不说谎的文档</p>\n<p style=\"text-align:center;font-size:28px;font-weight:bold;color:#58a6ff;margin:0 0 30px;\">但它从来不可检索</p>\n\n<p style=\"font-size:16px;color:#8b949e;line-height:1.85;margin:0 0 22px;\">每个公司都有这样一个场景：</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.9;margin:0 0 8px;\">· 新人问\"分账功能是怎么实现的\"，老员工说\"你去看 payment-split 那个仓库\"</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.9;margin:0 0 8px;\">· 智能体被问\"退款流程涉及哪几张表\"，它答不出来，因为它没读过代码</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.9;margin:0 0 8px;\">· 产品想知道\"这个需求到底上线了没有\"，只能去翻三个月前的 MR</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.9;margin:0 0 22px;\">· 文档写了三版，全过期了；代码只有一版，永远是对的</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 26px;\">问题不在\"没有文档\"，在于<span style=\"color:#e6edf3;\">代码里有全部事实，但没有一句是给人和智能体读的</span>。</p>\n\n<p style=\"font-size:16px;color:#e6edf3;line-height:1.88;margin:0 0 12px;\">这篇讲的是：<span style=\"color:#3fb950;font-weight:bold;\">让 Hermes 的定时任务每天扫 GitLab / 云效的 feature、fix 分支，读懂这些提交改了什么，把\"代码完成的功能\"翻译成企业知识，写进知识库，供后面所有智能体检索。</span></p>\n\n<p style=\"font-size:15px;color:#8b949e;line-height:1.85;margin:0 0 30px;\">关键词是\"翻译\"——不是把代码贴进向量库，那只是把检索难题换了个地方。</p>\n\n\n<!-- 第 1 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #58a6ff;color:#58a6ff;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #3fb950;\">1</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#58a6ff;margin:18px 0 26px;\">概念：为什么这一段必须让 Agent 来做</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">先把角色分清楚。这条链路里有三个执行者，能力边界完全不同：</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#58a6ff;font-weight:bold;\">Cron</span> —— 负责\"什么时候跑\"。它不懂代码，只懂时间。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#3fb950;font-weight:bold;\">脚本</span> —— 负责\"拿什么回来\"。调 API、过滤分支、算 diff，全是确定性动作。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#d29922;font-weight:bold;\">Agent</span> —— 负责\"这段代码到底做了什么\"。这一步没有规则可写。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">为什么第三步不能写死规则？因为\"读懂代码\"这件事的输入空间是无限的。同样一个 diff，可能是在修空指针，可能是在加一个业务分支，也可能只是把 `for` 改成 `stream`。<span style=\"color:#e6edf3;\">只有模型能结合 commit message、函数名、调用链，判断这段改动在业务上意味着什么。</span></p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3fb950;margin:20px 0 10px;\">所以整条链路是混合的，不是纯 Agent</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/pipeline.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 1 · 五段流水线：只有第三段烧 token</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">第 1、2、4、5 段都是纯 Python，跑一万次成本为零。只有第 3 段进 Agent。这个切分方式决定了整套系统能不能长期跑下去——<span style=\"color:#d29922;font-weight:bold;\">如果每两小时都让模型重读一遍全仓库，账单会在第三周把你叫停。</span></p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#58a6ff;margin:20px 0 10px;\">两个 cron，两种节奏</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#d29922;\">增量任务，每 2 小时</span>：只处理上次游标之后的新提交，通常一次 3–10 条，token 消耗可控。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#3fb950;\">对账任务，每天凌晨 2 点</span>：全量重扫一遍，处理增量漏掉的提交（比如分支重置、强制推送），同时标记\"代码已删除但知识还在\"的失效节点。</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">增量保证新鲜度，对账保证一致性。只做增量会慢慢长歪，只做全量会破产。</p>\n\n\n<!-- 第 2 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #3fb950;color:#3fb950;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #d29922;\">2</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#3fb950;margin:18px 0 26px;\">采集：四道闸门决定知识库的噪音比</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">采集层做的事听起来很简单：调接口拿提交。但真正决定这套系统好不好的，是<span style=\"color:#e6edf3;\">过滤</span>。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/scope.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 2 · 四道闸门：1000 条/月 → 150 条进理解</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#58a6ff;margin:20px 0 10px;\">GitLab：两个接口就够了</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 16px;\">拉提交列表用 commits 接口，拉具体改动用 diff 接口。别用 compare——它一次比对整个区间，大分支很容易返回几百 MB。</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 提交列表（按分支 + 时间窗增量拉）<br/>\nGET /api/v4/projects/:id/repository/commits<br/>\n&nbsp;&nbsp;?ref_name=feature/split-payment<br/>\n&nbsp;&nbsp;&amp;since=2026-11-02T00:00:00Z<br/>\n&nbsp;&nbsp;&amp;per_page=100<br/><br/>\n# 单条提交的改动<br/>\nGET /api/v4/projects/:id/repository/commits/:sha/diff\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\"><span style=\"color:#d29922;\">关键点：不要轮询全部分支</span>。用 `ref_name` 精确指定，或者先调 `/repository/branches` 拿到分支列表，在本地按前缀过滤后再逐个拉。一个中型仓库动辄几百个分支，全扫一遍 API 就会限流。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3fb950;margin:20px 0 10px;\">云效 Codeup：结构类似，认证不同</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">云效走的是 OpenAPI，鉴权用 RAM 的 AK/SK 或者个人访问令牌，返回结构跟 GitLab 大体一致——提交列表 + 单提交文件变更。写一个 adapter 层把两边字段对齐，后面的逻辑就完全复用。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\">这也是为什么要\"采集层只做搬运、不做转换\"——<span style=\"color:#e6edf3;\">两个平台的原始结构差异，全部在归一化层吃掉，Agent 看到的是统一的 diff 结构</span>。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#d29922;margin:20px 0 10px;\">游标：增量靠一个文件就够了</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/state/cursor/payment-service__feature-split.json<br/>\n{\"repo\": \"payment-service\",<br/>\n&nbsp;\"branch\": \"feature/split-payment\",<br/>\n&nbsp;\"last_sha\": \"a1b2c3d\",<br/>\n&nbsp;\"last_run\": \"2026-11-03T09:12:00+08:00\"}\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">每次拉完更新这个文件。<span style=\"color:#f85149;\">注意一个坑：分支被 force push 后，last_sha 可能已经不在历史里了。</span>所以不能只依赖游标，还要用 `since` 时间兜底——取\"游标之后\"和\"过去 48 小时\"的并集。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#c9d1d9;margin:20px 0 10px;\">体积闸门的阈值</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 14px;\">单次提交 diff 超过 800 行、或者改动文件超过 30 个，不进理解队列，改为写入一条\"待人工拆分\"的观测记录。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">原因很实在：这种提交多半是\"格式化整个仓库\"\"升级依赖\"\"拔出一棵大树\"，喂给模型也总结不出一个有意义的功能点，反而会污染知识库。240 行以内的改动，功能语义最清晰。</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">还要再挡一类：纯注释、纯空白、纯重命名、lock 文件、生成代码。这些用路径和 diff 统计就能判断，连模型都不用调。</p>\n\n\n<!-- 第 3 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #d29922;color:#d29922;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #bc8cff;\">3</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#d29922;margin:18px 0 26px;\">理解：别让模型读整个仓库</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">这是最容易做错的一步。常见的错误做法是：把整个仓库 clone 下来，索引进向量库，让 Agent 去搜。<span style=\"color:#f85149;\">这不叫理解代码，这叫把 grep 换了个更贵的实现。</span></p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3fb950;margin:20px 0 10px;\">正确的输入是三样东西的组合</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#58a6ff;font-weight:bold;\">① 改动本身</span> —— diff 里的增删行，这是\"变了什么\"。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#3fb950;font-weight:bold;\">② 改动所在函数的完整上下文</span> —— 不是整个文件，是包含这段 diff 的函数或类。用 tree-sitter 解析 AST 就能拿到边界，一个函数通常 30–80 行。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#d29922;font-weight:bold;\">③ 意图声明</span> —— commit message、MR 标题与描述、关联的需求单号。这是人写给\"为什么改\"的，模型最缺的就是这个。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">三者拼起来，一次输入大约 2000–4000 token，成本可控，语义完整。<span style=\"color:#e6edf3;\">实测比\"给整个文件\"的准确率高，因为噪音少；比\"只给 diff\"准确率高得多，因为有上下文。</span></p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#bc8cff;margin:20px 0 10px;\">Prompt 的写法：让它做\"翻译\"而不是\"总结\"</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 16px;\">这两个动词差别很大。\"总结这段代码\"会得到一堆技术描述——\"新增了一个 if 分支判断条件\"。\"翻译成业务能力\"才会得到\"支持按子商户维度拆分结算金额\"。</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n你是企业知识编纂者。下面是一次代码提交。<br/>\n请把它翻译成\"系统获得了一项什么业务能力\"，<br/>\n而不是\"代码做了什么修改\"。<br/><br/>\n要求：<br/>\n1. 用业务语言，假设读者是不写代码的产品/客服；<br/>\n2. 如果只是重构、无新增能力，标记 type=refactor 并说明影响范围；<br/>\n3. 输出严格 JSON，字段见 schema；<br/>\n4. 不确定的字段留 null，不要编造接口名和数据表名。\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">最后那条\"不要编造\"非常重要。模型看见一个 `OrderService` 很自然会补出\"订单服务\"，但如果实际业务叫\"交易单\"，这条知识就是错的，而且会被后续检索反复引用。<span style=\"color:#f85149;font-weight:bold;\">宁可字段为空，也不要幻觉出一个名字。</span></p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">还有一个很实用的约束：让模型判 `is_business_meaningful`。如果这条提交是改日志级别、调超时时间、修拼写，它会自己说\"没有业务语义\"，直接跳过。省下的不只是 token，还有知识库的干净度。</p>\n\n\n<!-- 第 4 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #bc8cff;color:#bc8cff;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #58a6ff;\">4</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#bc8cff;margin:18px 0 26px;\">编译：功能卡片长什么样</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">Agent 的输出必须结构化，而且要能被校验、被 diff、被幂等写入。一段自由文本没法做这三件事。</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n{<br/>\n&nbsp;&nbsp;\"id\": \"feature:payment-service:split-settlement\",<br/>\n&nbsp;&nbsp;\"name\": \"按子商户拆分结算\",<br/>\n&nbsp;&nbsp;\"summary\": \"一笔订单可按子商户维度拆成多笔结算记录，<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;各自独立计费与对账。\",<br/>\n&nbsp;&nbsp;\"type\": \"feat\",<br/>\n&nbsp;&nbsp;\"domain\": \"支付-结算\",<br/>\n&nbsp;&nbsp;\"modules\": [\"payment-service/settlement\"],<br/>\n&nbsp;&nbsp;\"apis\": [\"POST /api/v2/settlement/split\"],<br/>\n&nbsp;&nbsp;\"tables\": [\"t_settlement\", \"t_settlement_item\"],<br/>\n&nbsp;&nbsp;\"depends_on\": [\"feature:payment-service:merchant-account\"],<br/>\n&nbsp;&nbsp;\"repo\": \"payment-service\",<br/>\n&nbsp;&nbsp;\"branch\": \"feature/split-settlement\",<br/>\n&nbsp;&nbsp;\"source_commit\": \"a1b2c3d\",<br/>\n&nbsp;&nbsp;\"confidence\": 0.87,<br/>\n&nbsp;&nbsp;\"status\": \"draft\"<br/>\n}\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\">几个字段值得单独解释：</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#bc8cff;font-weight:bold;\">id</span> —— 不是随机的，是 `feature:{repo}:{slug}`。这个稳定 ID 是做 upsert 的前提，同一个功能被多次提交迭代，应该更新同一条节点而不是新增十条。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#58a6ff;font-weight:bold;\">depends_on</span> —— 功能之间的依赖，这是让检索能做多跳的关键。没有它，知识库只是一堆平行的卡片。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#d29922;font-weight:bold;\">confidence</span> —— 模型对这次理解的把握程度。怎么来？不靠模型自评，靠三个客观信号加权：commit message 是否规范、MR 描述长度是否够、能否在已有知识里找到关联功能。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#3fb950;font-weight:bold;\">status</span> —— draft 还是 verified。这是整套系统里最重要的一道保险，下一章细说。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#d29922;margin:20px 0 10px;\">置信度分级：不是所有知识都该被智能体引用</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 14px;\"><span style=\"color:#f85149;\">draft</span> —— 刚生成，未经验证。智能体不主动引用，只存在待审队列。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 14px;\"><span style=\"color:#d29922;\">reviewed</span> —— 通过抽样人工复核，或者在知识库中与其他 verified 节点形成了稳定关联。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#3fb950;\">verified</span> —— 被同事确认过，或者被多个独立来源交叉印证（代码 + 需求单 + 文档）。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">默认策略：<span style=\"color:#e6edf3;\">智能体检索只返回 verified；人工查询可以带出 draft 但必须标注\"未验证\"</span>。这一条能挡掉 80% 的\"AI 胡说八道\"投诉——不是模型变准了，是错的那些根本没进检索池。</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">实际运维节奏：每周抽 10 条 draft 人工过一遍。看着不多，但一个月就是 40 条，三个月后知识库的主体就都是可信的了。</p>\n\n\n<!-- 第 5 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #58a6ff;color:#58a6ff;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #d29922;\">5</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#58a6ff;margin:18px 0 26px;\">落库：图结构比向量库更合适</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">\"把知识写进知识库\"这句话，落到实现上有两种做法：向量库、图数据库。这个场景里，<span style=\"color:#58a6ff;font-weight:bold;\">图更合适</span>。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\">理由很直接：人问的往往是关系型问题——\"退款走的哪张表\"\"分账依赖哪些模块\"\"这块谁负责\"。向量检索擅长\"这段话和我问的像不像\"，不擅长\"顺着边跳两跳\"。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/schema.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 3 · 六个节点类型，五类关系</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3fb950;margin:20px 0 10px;\">怎么接进 Hermes</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 16px;\">Hermes 的记忆系统本身是 provider 化的，官方内置了若干后端（Hindsight 知识图谱、Mem0、本地文件等），也支持通过 MCP 桥接外部存储。写入侧用 `memory` 工具集的 retain 动作，读取侧是 recall / reflect。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">如果你想用公司自己的 Neo4j，那就走 MCP——一个不到 200 行的 MCP Server，暴露三个工具：</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nmemory_upsert(node_type, id, props)   # 幂等写入<br/>\nmemory_link(from_id, rel, to_id)     # 建关系边<br/>\nmemory_search(query, hops, status)   # 多跳检索\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\">Agent 侧只需要在 system prompt 里说明\"你有一个 memory_upsert 工具，写完必须回读校验\"，它就会在生成卡片后主动落库。不需要在 Hermes 里写死业务逻辑。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#d29922;margin:20px 0 10px;\">幂等：这条链路的生死线</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">每天跑两次、一次可能产出几十条，如果没有幂等，两个月后知识库里同一个功能会有十几个副本，检索出来的是一堆重复且互相矛盾的内容。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 16px;\">做法是把 upsert 写成\"Cypher 的 MERGE + 字段合并\"：</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\nMERGE (f:Feature {id: $id})<br/>\nSET f.name = $name,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;f.summary = $summary,<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;f.source_commit = $sha,&nbsp;&nbsp;// 覆盖为最新<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;f.last_seen = datetime(),<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;f.status = CASE f.status<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WHEN 'verified' THEN 'verified'&nbsp;&nbsp;// 已验证的不会被降级<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ELSE $status END\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">注意那个 CASE：<span style=\"color:#3fb950;font-weight:bold;\">已经 verified 的节点不会被一次新的 draft 覆盖掉</span>。否则人工审核等于白做——下一次自动跑就把状态打回原形了。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#f85149;margin:20px 0 10px;\">失效：知识也会过期</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 16px;\">代码删了，知识还在，这是自动知识库最危险的地方——它比没有知识更糟，因为智能体会自信地引用一个已经不存在的接口。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">对账任务里加一步：扫所有 verified 节点，检查它声明的 `modules` 和 `apis` 在最新代码里是否还能找到。找不到就置 `stale=true` 并降级为 draft，同时推一条提醒给 owner。</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">这一步每天只跑一次，全量扫一遍花不了几分钟，但能保证知识库不会慢慢变成一座废墟。</p>\n\n\n<!-- 第 6 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #3fb950;color:#3fb950;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f85149;\">6</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#3fb950;margin:18px 0 26px;\">检索：智能体到底怎么用它</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">知识库建好之后，它是\"共用底座\"——同一个库，四种入口都能读：</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#58a6ff;font-weight:bold;\">聊天入口</span> —— 员工在企微/飞书问\"分账怎么实现的\"，Hermes 走 recall 检索。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#3fb950;font-weight:bold;\">MCP 入口</span> —— Cursor、Claude Code 这类编码工具，通过 MCP 直接读同一份图谱。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#d29922;font-weight:bold;\">A2A 入口</span> —— 别的团队的 Agent 通过 Agent Card 发现并调用。</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#bc8cff;font-weight:bold;\">HTTP 入口</span> —— 内部门户、工单系统按需查询。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#58a6ff;margin:20px 0 10px;\">多跳的价值在哪</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 16px;\">问\"分账失败该找谁\"，向量检索会返回一堆描述分账的段落。图谱检索走的是：</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n按子商户拆分结算 --owned_by--&gt; 张工<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;--implemented_by--&gt; settlement 模块<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;--reads--&gt; t_settlement_item<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;--depends_on--&gt; 商户账户体系\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">这四跳出来，答案就很具体：<span style=\"color:#e6edf3;\">找张工，问题大概率在 t_settlement_item 写入或上游商户账户的余额校验</span>。这是向量库给不了的精度。</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">还有一个隐藏好处：图谱天然可解释。你能告诉用户\"我是从这三条边推出来的\"，而不是\"相似度 0.82\"。在内部系统里，可解释比准确率更能建立信任。</p>\n\n\n<!-- 第 7 章 -->\n<p style=\"margin:28px 0 10px;\">\n<span style=\"display:inline-block;border:2px solid #d29922;color:#d29922;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #3fb950;\">7</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#d29922;margin:18px 0 26px;\">配置与使用：三个文件 + 两个 cron</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/config.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:10px 0 30px;\">图 4 · 全部配置：三个 YAML + 一个 .env + 两个 cron</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#58a6ff;margin:20px 0 10px;\">第一步：仓库清单</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/config/repos.yaml<br/>\nrepos:<br/>\n&nbsp;&nbsp;- name: payment-service<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;platform: gitlab<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;project_id: 1203<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;branches: [\"feature/*\", \"fix/*\"]<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;domain: 支付-结算<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;exclude_paths: [\"**/*.lock\", \"docs/**\", \"**/generated/**\"]<br/>\n&nbsp;&nbsp;- name: order-center<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;platform: codeup<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;repo_id: \"ord-88f2\"<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;branches: [\"feature/*\", \"hotfix/*\"]<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;domain: 交易-订单\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\">`domain` 这个字段很关键——它决定了卡片落到知识图谱的哪个区域。同一个仓库可能横跨多个业务域，后面做权限隔离和检索范围时都靠它。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3fb950;margin:20px 0 10px;\">第二步：环境变量</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/.env<br/>\nGITLAB_URL=https://gitlab.corp.com<br/>\nGITLAB_TOKEN=glpat-xxxxxxxx<br/>\nCODEUP_AK=LTAIxxxxxxxx<br/>\nCODEUP_SK=xxxxxxxx<br/>\nNEO4J_URI=bolt://neo4j.corp.com:7687<br/>\nNEO4J_USER=knowledge<br/>\nNEO4J_PASSWORD=xxxxxxxx\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\">GitLab token 至少要 `read_api`；如果要读 MR 描述，还需要 `read_repository`。云效的 AK/SK 要开 Codeup 的只读权限。都不需要写权限——<span style=\"color:#3fb950;\">这条链路是单向的，只读代码，绝不回写</span>。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#d29922;margin:20px 0 10px;\">第三步：挂两个 cron</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 增量：每 2 小时<br/>\nhermes cron create \"every 2h\" \\<br/>\n&nbsp;&nbsp;\"按 repos.yaml 扫描 feature/fix 分支的新提交，<br/>\n&nbsp;&nbsp;&nbsp;逐条翻译成功能卡片，写入图谱，status=draft。\" \\<br/>\n&nbsp;&nbsp;--skill code-to-knowledge \\<br/>\n&nbsp;&nbsp;--deliver local --name \"code-to-knowledge\"<br/><br/>\n# 对账：每日 02:00<br/>\nhermes cron create \"0 2 * * *\" \\<br/>\n&nbsp;&nbsp;\"全量重扫 + 标记失效节点 + 汇总当日新增知识。\" \\<br/>\n&nbsp;&nbsp;--skill code-to-knowledge \\<br/>\n&nbsp;&nbsp;--deliver wecom --name \"knowledge-reconcile\"\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 18px;\">注意两个任务的投递目标不同：增量任务 <span style=\"font-family:Consolas,Menlo,monospace;color:#58a6ff;\">--deliver local</span>，安静跑，只留审计日志；对账任务 <span style=\"font-family:Consolas,Menlo,monospace;color:#58a6ff;\">--deliver wecom</span>，每天给知识库管理员发一条\"昨天新增 8 条、失效 2 条\"的汇总。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#bc8cff;margin:20px 0 10px;\">第四步：先干跑，再上线</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 手动跑一次，不写库<br/>\nhermes cron run code-to-knowledge --dry-run<br/><br/>\n# 只处理指定仓库，验证质量<br/>\nhermes cron run code-to-knowledge --only payment-service --limit 5\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 20px;\"><span style=\"color:#f85149;font-weight:bold;\">第一周一定要 `--limit` 小批量跑</span>，每天看十条结果，确认模型翻译得对不对。一次性把五百条灌进去，等你发现质量不行的时候，清理成本比重新做还高。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#58a6ff;margin:20px 0 10px;\">第五步：验证知识真的能被查到</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 14px;\">别只看数据库里有多少节点，要看检索端能不能答出来。跑三个真实问题：</p>\n\n<p style=\"background:#0a0e14;color:#c9d1d9;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n\"分账功能涉及哪些接口和表？\"<br/>\n\"退款流程依赖哪些模块？\"<br/>\n\"结算这块最近谁在改？\"\n</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">如果答不出，问题八成在前面三步：卡片 id 不稳定、关系边没建、或者检索时把 status 过滤设错了（只查 verified 但所有节点还是 draft）。</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#3fb950;margin:20px 0 10px;\">日常怎么用</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\">· 每周一抽 10 条 draft 审核，通过的打 verified</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\">· 每天看对账任务推来的汇总，重点关注 stale 数量</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\">· 新人入职第一周，让他用这个知识库自学系统，收集答不出的问题，反向补采集范围</p>\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\">· 每季度做一次大清理，删掉长期无人检索、且 stale 的知识节点</p>\n\n<p style=\"font-size:15px;color:#6e7681;line-height:1.85;margin:0 0 28px;\">这套东西的运维成本很低——每天大概十分钟。前提是前面几章的设计没有偷懒。</p>\n\n\n<!-- 第 8 章 -->\n<p style=\"margin:32px 0 8px;\">\n<span style=\"display:inline-block;border:2px solid #f85149;color:#f85149;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #d29922;\">8</span>\n</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#f85149;margin:18px 0 26px;\">边界：这套方案做不到什么</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f85149;font-weight:bold;\">① 它读不懂\"没写出来\"的东西。</span>代码只能反映已实现的部分。业务规则、取舍原因、被砍掉的需求，代码里没有，知识库里也就没有。需要人工补，或者把需求单也接进来。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f85149;font-weight:bold;\">② 它对烂代码无能为力。</span>命名混乱、逻辑嵌套十层的仓库，模型翻译出来的东西同样混乱。这时候先治代码，别指望知识库能变干净。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f85149;font-weight:bold;\">③ 单次提交的视野是有限的。</span>一个横跨五个仓库的大功能，每条提交只能看到自己那一片。需要在\"功能编排层\"再做一次聚合——把同一次发版里、同一个需求号下的卡片合成一个完整功能。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 10px;\"><span style=\"color:#f85149;font-weight:bold;\">④ 成本会随仓库规模线性上升。</span>10 个仓库每月 150 条是可控的；100 个仓库就是 1500 条，模型调用和人工审核都扛不住。到那个量级，得按业务价值加权——只对 P0 业务域做全量，其余只做骨架。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.88;margin:0 0 22px;\"><span style=\"color:#f85149;font-weight:bold;\">⑤ 权限是最后的硬墙。</span>代码库按项目隔离，知识库也得按域隔离。别做成一个大池子——否则 A 项目的人从智能体里查到 B 项目的接口设计，这是安全事故，不是效率提升。</p>\n\n<p style=\"font-size:16px;color:#e6edf3;line-height:1.9;margin:22px 0 12px;\">最后说一句实话。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.9;margin:0 0 10px;\">大部分公司做\"代码知识库\"失败，不是因为模型不够强，是因为<span style=\"color:#6e7681;\">一开始就想做全</span>——所有仓库、所有分支、所有历史提交，一次性灌进去，然后期待它好用。</p>\n\n<p style=\"font-size:15px;color:#c9d1d9;line-height:1.9;margin:0 0 28px;\">正确的做法反过来：<span style=\"color:#3fb950;font-weight:bold;\">先挑一个业务域、一个仓库、一条分支，让十个人用一个月</span>。测到\"新人真的靠它省了两周上手时间\"，再扩。知识库是养出来的，不是灌出来的。</p>\n\n<p style=\"text-align:center;font-size:13px;color:#8b949e;margin:40px 0 20px;\">—— 系列第七篇，完 ——</p>\n\n<p style=\"text-align:center;font-size:13px;color:#6e7681;margin:0 0 30px;\">往期回顾：<br/>\n① Hermes 连接企微 &amp; 飞书 · ② A2A + SDLC 六阶段 Pipeline<br/>\n③ 企业知识库构建 · ④ WeKnora 活知识库<br/>\n⑤ 业务群自动建单闭环 · ⑥ 定时任务每日项目简报</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
