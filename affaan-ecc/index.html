<script id="post-data" type="application/json">
{
  "title": "ECC：把 Agent 的七步闭环装进 harness",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月27日 09:10",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">ECC 这个名字来自 Everything Claude Code。不过它现在不太爱用这个说法了，仓库第一行改成了：<span style=\"font-weight:bold;color:#c25a2a;\">the agent harness operating system</span>。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个 GitHub 仓库里塞着 71 个 agent、311 个 skill、97 条命令，外加 hooks、rules、memory 和一整套持续学习机制。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它想解决的不是「怎么让模型写出代码」，是「怎么让 agent 记得住、不跑偏、下次比这次好一点」。这两件事难度差很远。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#c25a2a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">它到底是什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">先把 harness 这个词说清楚。模型负责写代码，harness 负责给模型配工具、配记忆、配流程、配护栏。同一个模型装进不同的 harness，干活的水平能差一个档。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">ECC 对 harness 的判断很直接：里面最贵的资源不是 prompt，是上下文窗口。README 里有一句被反复引用的话——</p>\n\n<p style=\"border-left:4px solid #c25a2a;padding:14px 18px;background:#fdf3ee;margin:0 0 20px;line-height:1.8;color:#2b2b2b;font-size:15px;\">Optimize the context window. Persist everything else.</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">意思是：上下文留给眼前这一步，其余全部落盘。所以它没有做成一个万能超级 prompt，而是拆成七个步骤组成的一条闭环，整套装在 harness 里。plan → test → implement → review → verify → remember → improve。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">每一步有自己的 agent 和 skill。上一步的结论写进文件，下一步读文件继续跑。上下文不跨步骤累积，记忆跨步骤传递。这就是它和「一个大 prompt 干到底」的根本区别。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/loop.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">七个步骤，一条闭环，装在 harness 里。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#c25a2a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">仓库里到底有什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">数量先摆出来，因为它的规模确实不常见。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/inventory.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">71 个 agent、311 个 skill、97 条命令，加六个组件层。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">71 个 agent 按职责分：规划、复审、编译修复、安全、架构，还有一堆领域专用的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">311 个 skill 是主入口。TDD、研究、安全、文档、前端、数据、ML、运维，基本上你能想到的环节都有一个现成的工作流。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">97 条命令正在往 skill-first 迁。也就是说命令层现在更像入口和兼容层，真正的逻辑写在 skill 里。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">剩下的六个组件层是 hooks、rules、memory、continuous learning 和 AgentShield。AgentShield 是独立的一个扫描器，专门看 prompts、hooks、MCP 配置、权限、密钥和 agent 文件里有没有问题。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">有个容易踩的坑：它的三套标识不能混着用。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">affaan-m/ECC</span> 是 GitHub 仓库，<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">ecc@ecc</span> 是 Claude 插件标识，<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">ecc-universal</span> 是 npm 包名。文档里这三个名字来回换，装的时候各用各的。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#c25a2a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">四种东西，四种触发方式</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">看着有几百个文件，其实骨架只有四种东西。区别不在它们写什么，在于什么时候被加载。</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/concepts.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">Agent 被派活、Skill 按需加载、Hook 事件触发、Rule 一直在线。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Agent</span> 是被派活的。一个独立 subagent，限定了 scope 和 tools。frontmatter 里写 name、tools、model，正文写「你是谁、怎么干」。code-reviewer、planner、architect 都是这种。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Skill</span> 是按需加载的。一个可复用的工作流定义，正文就是步骤。它是主入口——你可以直接调，agent 也能调。tdd-workflow 强制先写失败测试，security-review 按清单过一遍，都属于这一类。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Hook</span> 是事件触发的。挂在 tool 事件上，PreToolUse、PostToolUse、Stop。命中就执行 shell，能拦截也能提醒。比如改 ts 文件时警告 console.log，或者 commit 前跑一次检查。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#1a1a1a;\">Rule</span> 是常驻的。始终加载的规范，按语言分目录。官方建议只挂 common 加你实际用的那一个语言包——十个语言包全开，纯烧上下文。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这四种东西一组合，就是前面那条七步闭环。plan 用 planner agent 跑一个规划 skill，implement 阶段有 hook 盯着，全程 rule 约束风格，remember 把结论写进 memory。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#c25a2a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">怎么装</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">三条路，选一条。<span style=\"font-weight:bold;color:#c25a2a;\">不要叠加。</span></p>\n\n<p style=\"background:#17140f;color:#e8e2da;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\"># 路径 A · 引导式安装（最稳）\nnpx ecc-universal@2.2.3 setup\n\n# 路径 B · Claude Code 原生插件\n/plugin marketplace add https://github.com/affaan-m/ECC\n/plugin install ecc@ecc\n\n# 路径 C · 多 harness 向导\nnpx ecc-universal@2.2.3 install --guided</p>\n\n<p style=\"text-align:center;margin:24px 0 8px;\"><img src=\"assets/install.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">七个 harness，原生和受限适配差别不小。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">叠加装是新手最容易犯的错。同一个 harness 装两次，skills、commands、hooks 会重复注册，行为开始变得莫名其妙，还很难查。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">装完先确认状态：</p>\n\n<p style=\"background:#17140f;color:#e8e2da;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">npx ecc-universal list-installed   # 看装了什么\nnpx ecc-universal doctor           # 体检\nnpx ecc-universal repair           # 坏了修\nnpx ecc-universal uninstall --dry-run   # 卸之前先看会删掉什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">harness 支持度要提前看清。Claude Code、Codex、Qoder 是原生插件，全套能力都在。Cursor、OpenCode、Gemini CLI、Zed、Antigravity、Qwen、Hermes、OpenClaw、Kimi、CodeBuddy、JoyCode、Copilot 属于受限适配——skill 能用，但 hook 运行时和原生 skill 发现不一定齐。挑 harness 之前先比对这张表。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">当前版本 2.2.3，2026-10-01 发布。v2.0.0 是它正式定义为 Agent Harness Operating System 的那一版。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#c25a2a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">怎么用</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">装完别急着背 311 个 skill。记住六个入口就够跑起来了。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/ecc:plan</span> 先规划，把任务拆开。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">tdd-workflow</span> 强制你先写一个失败的测试。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/code-review</span> 换一个新的上下文来复审，避免自己审自己。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">写错了用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/build-fix</span> 修编译错误，代码肥了用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/refactor-clean</span> 清冗余。<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/context-budget</span> 能看当前上下文还剩多少，这是它最实用的一条诊断命令。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">跨会话接着干，用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/save-session</span> 存，<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/resume-session</span> 读。上线前跑一遍 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c25a2a;\">/security-scan</span>。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最短的一次完整用法长这样：</p>\n\n<p style=\"background:#17140f;color:#e8e2da;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">/ecc:plan 给登录接口加限流\n# 看完计划，确认它没理解偏\ntdd-workflow\n# 它先写一个会失败的测试，再让实现追着测试跑\n/code-review\n# 换一个 agent 复审 diff</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">四步跑完，remember 会把这次的决策写进 memory，improve 会把反复出现的做法沉淀成 skill。下次同一个项目再用，起点已经不一样了。这是它和普通 prompt 模板最实质的差别。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">还有一点要分清。ECC 本体是 MIT 协议，永久开源。ECC Pro 是另一个东西，托管的 GitHub App，商业产品，不要看混。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">值不值得装？如果你只偶尔用 agent 改几行代码，它有点重。但当你的项目要连续几天让 agent 参与，靠上下文窗口硬记是不行的——那时候一条能把记忆落盘的闭环，比多写几个 prompt 有用得多。</p>\n\n<p style=\"border-left:4px solid #c25a2a;padding:14px 18px;background:#fdf3ee;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\n上下文留给眼前这一步，其余全部落盘。这条原则，比任何一个 skill 都值得记住。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">仓库在 github.com/affaan-m/ECC。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
