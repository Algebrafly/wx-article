<script id="post-data" type="application/json">
{
  "title": "别让模型 Key 散落在四个服务里：APISIX 做 AI 网关",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月20日 11:03",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:24px 0 0;\"><img src=\"assets/cover.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">上个月帮朋友看他们团队的 LLM 调用账单，发现一件很典型的事：</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">OpenAI 的 key 散在 4 个服务里，其中两个写在前端构建的 env 里；DeepSeek 的 key 是硬编码；某天 OpenAI 限流，整个客服机器人停了 40 分钟，没人知道该切哪。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这些问题不是模型层面的，是流量层面的。而流量层面的事，本来该由网关管。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>Apache APISIX</b> 是一个基于 NGINX + etcd 的云原生 API 网关，最近两年把 AI 能力做成了插件集：统一的多模型代理、按 token 限流、语义路由、响应缓存、prompt 过滤。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这篇按实际接入的顺序写：装、核心概念、AI 代理、多模型容灾、成本与安全，最后是我踩过的三个坑。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">五条命令跑起来</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">官方给了一个 Docker 一键脚本，连 etcd 一起拉起来：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">curl -sL https://run.api7.ai/apisix/quickstart | sh</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">跑完先确认活着：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">curl \"http://127.0.0.1:9080\" --head | grep Server</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">四个端口各管一件事，记一下：</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;width:24%;\">端口</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">干什么</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-family:Menlo,monospace;\">9080</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">业务流量入口，所有 API 从这里进</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-family:Menlo,monospace;\">9443</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">业务 HTTPS 入口</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-family:Menlo,monospace;\">9180</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">Admin API，加路由、改插件都打这里</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-family:Menlo,monospace;\">9091</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">Prometheus 指标，监控用</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">先建一条最普通的代理路由，确认链路通：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">curl -i \"http://127.0.0.1:9180/apisix/admin/routes/1\" \\<br/>&nbsp;&nbsp;-X PUT -d '{<br/>&nbsp;&nbsp;\"uri\": \"/get\",<br/>&nbsp;&nbsp;\"upstream\": {<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"type\": \"roundrobin\",<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"nodes\": { \"httpbin.org:80\": 1 }<br/>&nbsp;&nbsp;}<br/>}'</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">然后 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">curl http://127.0.0.1:9080/get</code> 看到 httpbin 的返回，就说明通了。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">注意 Admin API 需要 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">X-API-KEY</code> 头。默认 key 在 config.yaml 里，生产环境第一件事就是换掉它，第二件事是别把 9180 暴露到公网。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">除了 Docker，还有 Docker Compose、Helm（Kubernetes）、RPM/DEB 和源码编译。生产上跑 K8s 的，基本直接上 Helm chart 或 APISIX Ingress Controller。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">四个概念，先建立心智模型</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">APISIX 的配置就四样东西，理解了这四个，剩下的都是查文档。</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;width:24%;\">概念</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">一句话</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-weight:bold;\">Route</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">\"什么样的请求走这条路\"，按 uri / method / host 匹配</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-weight:bold;\">Upstream</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">\"流量最终打给谁\"，节点、权重、负载均衡策略、健康检查</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-weight:bold;\">Consumer</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">\"谁在调用\"，配 key-auth / jwt-auth 之后就是身份</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2c68ff;font-weight:bold;\">Plugin</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">\"这条路上额外做什么\"，挂在 Route / Service / Consumer / Global 上</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">所有配置存在 etcd 里。改配置是走 Admin API 写 etcd，各节点 watch 到变化直接热更新，<b>不需要 reload、不需要重启</b>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这一点是 APISIX 跟传统 NGINX 网关最大的差别。以前加一条路由要改配置文件、reload、祈祷连接不丢；现在是发一个 HTTP 请求，几十毫秒生效。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">插件按阶段执行，同一阶段可以挂多个。顺序会影响结果——比如先限流再缓存，和先缓存再限流，命中率完全不同。后面会具体说。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">ai-proxy：一个入口，十几个模型</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这是整个 AI 能力的底座。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它做的事情：客户端永远只发一种格式（<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">messages</code> 数组），网关负责转成目标厂商的请求格式、带上对应的鉴权头、打到对应的 endpoint。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">支持的 provider 挺全：OpenAI、DeepSeek、Azure OpenAI、Anthropic、Gemini、Vertex AI、Amazon Bedrock、OpenRouter、AIMLAPI，以及任何 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">openai-compatible</code> 的自建服务。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">最小可用配置是这样：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">curl \"http://127.0.0.1:9180/apisix/admin/routes\" \\<br/>&nbsp;&nbsp;-X PUT -H \"X-API-KEY: $admin_key\" -d '{<br/>&nbsp;&nbsp;\"id\": \"ai-route\",<br/>&nbsp;&nbsp;\"uri\": \"/v1/chat\",<br/>&nbsp;&nbsp;\"methods\": [\"POST\"],<br/>&nbsp;&nbsp;\"plugins\": {<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"ai-proxy\": {<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"provider\": \"openai\",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"auth\": { \"header\": {<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"Authorization\": \"Bearer sk-xxx\" } },<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"options\": { \"model\": \"gpt-4o-mini\" }<br/>&nbsp;&nbsp;&nbsp;&nbsp;}<br/>&nbsp;&nbsp;}<br/>}'</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">客户端这边完全不用知道后端是谁：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">curl http://127.0.0.1:9080/v1/chat \\<br/>&nbsp;&nbsp;-H \"Content-Type: application/json\" -d '{<br/>&nbsp;&nbsp;\"messages\": [<br/>&nbsp;&nbsp;&nbsp;&nbsp;{\"role\":\"user\",\"content\":\"用一句话解释网关\"}<br/>&nbsp;&nbsp;]<br/>}'</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">要换模型，只改 Admin API 里那一行 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">provider</code> 和 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">model</code>，业务代码一行不动。这就是\"统一入口\"的实际价值——<b>把模型选择从代码里挪到了配置里。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有几个配置项值得看：</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>logging.summaries</b>：开启后 access log 里带上模型名、耗时、输入输出 token 数。接 http-logger / kafka-logger 就能直接算成本，不用改业务代码打点。</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>timeout</b>：默认 30 秒，按单个 socket 操作算。流式响应不受这个总时长限制，另有 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">max_stream_duration_ms</code> 兜底。</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>max_response_bytes / max_req_body_size</b>：防上游往死里吐、防客户端传超大 body。默认 body 上限 64MB。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>override.llm_options.max_tokens</b>：写一个值，网关按 provider 自动映射成对方要的字段名。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">ai-proxy-multi：主模型挂了怎么办</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/failover.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">按 priority 依次尝试，失败自动降级</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">单个 ai-proxy 只管\"打到哪\"，ai-proxy-multi 管\"打不到怎么办\"。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它把多个模型实例配成一个数组，每个有 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">priority</code> 和 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">weight</code>。priority 大的先试，同 priority 之间按权重分。</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">\"ai-proxy-multi\": {<br/>&nbsp;&nbsp;\"fallback_strategy\": \"http_429\",<br/>&nbsp;&nbsp;\"fallback_http_statuses\": [401, 402],<br/>&nbsp;&nbsp;\"max_retries\": 2,<br/>&nbsp;&nbsp;\"instances\": [<br/>&nbsp;&nbsp;&nbsp;&nbsp;{ \"name\": \"primary\", \"provider\": \"openai\",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"priority\": 100, \"weight\": 1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"auth\": { \"header\": {...} },<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"options\": { \"model\": \"gpt-4o\" } },<br/>&nbsp;&nbsp;&nbsp;&nbsp;{ \"name\": \"backup\", \"provider\": \"deepseek\",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"priority\": 50, \"weight\": 1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"options\": { \"model\": \"deepseek-chat\" } }<br/>&nbsp;&nbsp;]<br/>}</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">几个参数值得单独说：</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>fallback_strategy</b>：可以写 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">http_429</code>、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">http_5xx</code>、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">instance_health_and_rate_limiting</code>，也可以给数组。最后一个的意思是：某个实例的 token 配额用完了，也当作失败切走。</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>fallback_http_statuses</b>：额外补哪些状态码触发切换。key 过期是 401、余额不足是 402，这两个不补进去，半夜 key 失效还是得人工处理。</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>max_retries</b>：最多换几个实例。不设就一路试到底，设了能控制最坏情况下的等待时间。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>retry_on_failure_within_ms</b>：只在\"快速失败\"时切换。如果上游是慢慢超时的，就不再叠加重试，直接把错误返回——避免用户等两倍时间。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有一个我认为最特别的能力：<b>语义路由</b>。把 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">balancer.algorithm</code> 设成 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">semantic</code>，每个实例配一组 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">examples</code>（代表这个实例擅长什么的示例句）。请求进来后，按 prompt 与示例的余弦相似度选实例。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">比如代码类问题走便宜的快模型、长文写作走贵的强模型，不用在客户端写 if/else，也不用量化分类器。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">但这里有个坑：</b>全局阈值 <code style=\"background:#fff7ed;padding:1px 5px;border-radius:3px;font-size:14px;\">semantic_opts.threshold</code> 默认是 0，而真实 embedding 之间极少低于 0，等于\"任何 prompt 都能匹配上第一个实例\"。文档里写得很清楚——想让它真的按相似度选，阈值必须自己调高，否则配了等于没配。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">成本和安全：三个插件就够了</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/arch.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">一条 AI 请求在网关内部的典型链路</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>先说限流。普通网关按请求数限流，对 LLM 没意义</b>——一次长上下文请求可能顶别人一百次。所以 APISIX 单独做了 ai-rate-limiting，按 token 算。</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">\"ai-rate-limiting\": {<br/>&nbsp;&nbsp;\"limit\": 300,<br/>&nbsp;&nbsp;\"time_window\": 30,<br/>&nbsp;&nbsp;\"limit_strategy\": \"prompt_tokens\"<br/>}</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">意思是：30 秒内最多 300 个 prompt token。<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">limit_strategy</code> 可以选 total_tokens、prompt_tokens、completion_tokens。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">最有用的是第四种：<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">expression</code>。它允许你写一段 Lua 算术表达式，从上游返回的 usage 字段里取变量自己算成本。比如把缓存命中的 token 单独打折：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#1d1d1f;line-height:1.9;\">\"limit_strategy\": \"expression\",<br/>\"cost_expr\": \"input_tokens + output_tokens * 3\"</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">嵌套字段用双下划线拼，比如 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">input_tokens_details__cached_tokens</code>。这就把\"一美元能买多少 token\"这种商业规则，变成网关上的一个表达式。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">响应头里会带上 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">X-AI-RateLimit-Remaining-*</code>，客户端可以据此做退避。这个细节比直接返回 429 友好得多。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>再说缓存。</b>ai-cache 把完整响应存进 Redis，相同 prompt 直接回放。除了精确匹配，还能配语义匹配——换个说法的同一个问题也能命中。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">但它只缓存\"完整响应\"。流式请求如果边生成边下发，这一段就绕过了缓存。做客服 FAQ、文档问答这类场景，值得把非流式路径单独留一条。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b>最后是 prompt 过滤。</b>ai-prompt-guard 用正则做允许 / 拒绝匹配，适合挡一些明显的越权问法、内部代号、脏话。它不是内容审核模型，别指望它防住精心构造的注入——那是另一层的事。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">需要更强的检测可以配 ai-lakera-guard，接 Lakera Guard 的 API 检查请求、响应或两者。需要 RAG 的话有 ai-rag，但要注意它当前只支持 Azure OpenAI + Azure AI Search 这一条链路，不是通用的向量库网关。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有一个 ai-request-rewrite：把请求先发给 LLM 做改写（脱敏、补全、换格式）再转给上游。做数据出网前的脱敏挺合适。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">我自己踩过的三个坑</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">一、请求头会默认透传给模型厂商。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">ai-proxy 默认把客户端的请求头转发给 LLM 上游，只丢掉 Host、Content-Length、Accept-Encoding。<b>这意味着客户端带的 Authorization、Cookie、内部服务标识，都会被送到第三方。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">官方给的解法是在进 ai-proxy 之前用 proxy-rewrite 把这些头删掉。我第一次接的时候没想到，测试时把内部 JWT 发到 OpenAI 去了——虽然没造成事故，但想想挺后怕。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">二、max_tokens 的字段名，每家都不一样。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">OpenAI 的 Chat Completions 要 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">max_completion_tokens</code>，Responses API 要 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">max_output_tokens</code>，其他大多数是 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">max_tokens</code>。客户端自己传很容易 400。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">用 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">override.llm_options.max_tokens</code> 配一个数就行，网关按 provider 自动映射，而且会强制覆盖客户端传的值。想限制用户乱传大值，这个开关很有用。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">三、流式响应一旦开始，状态码就改不了了。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第一个 SSE 事件发出去，下游就是 200。之后上游断连、读超时，网关只能直接掐断流，<b>不会补一个 [DONE]</b>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">客户端必须把\"缺少结束标记\"当成不完整响应处理，否则界面上会留一段半截话，用户以为说完了。这个坑跟网关没关系，是 SSE 本身的性质，但只要接流式就会遇到。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">另外，非流式的 429 和 5xx，网关会把上游的错误响应体原样透传，状态码和 Content-Type 都保留。这点挺好的——厂商的限流细节不会丢，排查时不用猜。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#2c68ff;margin:18px 0 26px;\">值不值得加这一层</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">如果只有一个模型、一个 key、一个服务，加网关确实是多一层跳转、多一个要维护的组件。这种情况下用 SDK 直接调就行。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">但只要出现下面任意一条，这层的价值就出来了：</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 多个服务都要调模型，key 开始散落</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 需要按团队 / 按用户算 token 成本</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 想接第二家模型做容灾，但不想改业务代码</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 合规要求所有出网 prompt 可审计、可拦截</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 同一份 API 流量里既有普通接口又有 AI 接口，想统一观测</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">APISIX 的优势在于它不是\"为 AI 单独造的一套东西\"。路由、鉴权、限流、灰度、日志、指标，这些在 API 网关上跑了十年的机制，AI 流量直接复用。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">你不需要为 LLM 再学一套控制面，也不用在应用里塞一个 SDK 去实现重试和降级。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;line-height:1.7;padding:28px 0 6px;\">模型选型是产品决策，<br/>模型调度是基础设施。</p>\n\n<p style=\"margin:14px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">前者该由人拍板，后者不该写在业务代码里。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">把 key、重试、限流、成本统计从每个服务里抽出来，收到一层网关上——这件事做完之后，换模型就变成了一次 API 调用，而不是一次发版。</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:32px 0 0;font-size:14px;line-height:2;color:#2b2b2b;\">\n<b>相关链接</b><br/>\n· 仓库：github.com/apache/apisix<br/>\n· 文档：apisix.apache.org/docs/apisix/getting-started/<br/>\n· AI 网关：apisix.apache.org/ai-gateway/<br/>\n· 许可：Apache-2.0\n</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
