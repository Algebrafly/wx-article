<script id="post-data" type="application/json">
{
  "title": "MCP、A2A、单 Agent E2E：它们是叠在一起的三层，不是互斥选项",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月20日 08:56",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 22px;\"><img src=\"assets/layers.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">MCP 往下接工具，A2A 往外找别的 Agent，单 Agent E2E 是什么都不用自己扛。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最近两个月，MCP 和 A2A 这两个名字在 AI Agent 圈里爆得快。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个 Anthropic 发起，一个 Google 捐给了 Linux 基金会，都拿 Apache / MIT。朋友圈里有人在比谁是正统 Agent 协议，有人说其实两者是互补的。我自己在用 Agent 的时候，还发现另一个没人提但天天在用的东西，单 Agent 端到端，或者说单 Agent E2E。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这三个摆在一起比的时候，最容易犯的错是放错层级。我自己一开始就犯了。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2563eb;line-height:1.7;margin:6px 0 34px;\">MCP 和 A2A 是两个协议，单 Agent E2E 是一种架构。协议可以装在架构里面。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">先把三层放对位置</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/position.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">两个是开放协议，一个是最朴素的做法。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第一件事，MCP，Model Context Protocol。2025 年 6 月 Anthropic 放出来的一个开放协议，把 AI 应用连外部工具这件事标准化。它自己的官方类比我觉得是到位的，<strong style=\"font-weight:bold;color:#2563eb;\">USB-C for AI</strong>。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第二件事，A2A，Agent to Agent Protocol。Google 发起，已经捐给了 Linux 基金会，技术委员会里有 AWS、Cisco、Google、IBM Research、Microsoft、Salesforce、SAP、ServiceNow 这些。它要解决的是另一件事，Agent 和 Agent 之间怎么互相对话。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第三件事，单 Agent E2E。这个没有统一的协议规范，它就是一种最朴素的做法，一个 Agent 从接到任务开始到结束，全靠自己框架自带的 tool_call 能力往外调，不跟外部别的 Agent 说话。Devin、Claude Code、Trae 里大多数 Agent 一开始都长这样。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">MCP 解决 Agent 怎么接工具，A2A 解决 Agent 怎么找别的 Agent。E2E 是什么都不用的情况。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">MCP：Agent 的工具插头</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">MCP 的架构很清楚。Host 是 AI 应用本身，比如 Claude Desktop 或者 VS Code。Client 是 Host 为每个 Server 开的一个连接对象。Server 是真正干活的那个东西，可以是本地的、STDIO 跑的，也可以是远程的、走 Streamable HTTP 的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Server 对外暴露三种东西，tools、resources、prompts。tool 是能执行的动作，resource 是能读的东西，prompt 是一段预置的提示词。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">举个最简单的例子，做一个 Node CLI 工具给 Agent 当文件系统：</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">npx @modelcontextprotocol/server-filesystem /path/to/dir</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">然后在 Agent 里配一下就行。Claude Desktop 是改它的 settings.json，Cursor 和 VS Code 有各自的接入点。连上之后，这个 Agent 就突然能读这个目录、写这个目录、甚至知道这个目录下有什么。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">官方给了很多现成的 MCP Server，filesystem、GitHub、Postgres、Notion、Figma、Linear、Slack……数都数不过来。写一个自己的也不难，Python SDK 和 Node SDK 都有。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">MCP 是垂直的。每接一个 MCP Server，Agent 就多一份力气。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">A2A：Agent 之间说什么话</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">A2A 要解决的是另一个方向。一个 Agent 已经很能打了，但遇到它的能力边界怎么办？让它跟另一个 Agent 说话。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">A2A 里有两个角色，Client Agent 和 Server Agent。Agent Card 是 Agent 对外发布的名片，里面有这个 Agent 能干什么、能处理什么任务类型、有哪些能力。User（也就是发起方）用 Agent Card 找到合适的 Server Agent，然后开一个 Task，传一段 Message，Server Agent 返回 Task 状态，一直到 completed、failed、canceled 这些终结状态。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">官方给了 Python SDK，写一个 A2A Server Agent 大概这么几行：</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">from a2a.server.agent import Agent<br/>from a2a.server.execution import run_sync<br/><br/>agent = Agent(<br/>&nbsp;&nbsp;name=\"research-agent\",<br/>&nbsp;&nbsp;description=\"查找论文并总结\",<br/>)<br/><br/>@agent.on_message<br/>def handle(message):<br/>&nbsp;&nbsp;&nbsp;&nbsp;return {\"text\": \"已找到 3 篇相关论文\"}<br/><br/>run_sync(agent, host=\"0.0.0.0\", port=8000)</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">重点在，Server Agent 内部你可以用任何你喜欢的框架，LangGraph、CrewAI、Semantic Kernel、自研都行。A2A 只管 Agent 和 Agent 之间这层通信。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还特意说明了自己不是什么。不是一个开发 Agent 的框架，不是子 Agent 协议，不是 MCP 的替代品，也不是 Slack 那种消息 App。它就是 Agent 和 Agent 之间那层专门的协议。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">A2A 是水平的。Agent 之间找得到对方，互相能对话，不暴露内部。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">单 Agent E2E：一个人扛到底</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">前两个都在协议层。单 Agent E2E 不一样，它就是一种最朴素的做法。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它的特征很简单。一个主 Agent 接到一个任务，用自己框架里原生的 tool_call 能力往外调工具，调完了再接着想，整个过程里它是单线程的，它不跟别的 Agent 说话，上下文用完了它就停下来。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Devin 是这个模式最典型的例子，一张工单进去，一个 Agent 负责读完代码、改代码、跑测试、提 PR，整个过程就是它自己在那转。Claude Code、Trae 里的大多数 Agent 也是这个模式，Trae 会给它加 terminal、editor、browser 这些环境，但执行主 Agent 还是一个。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">一个典型的单 Agent E2E 任务，Trae 里就这么跑：</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">你：帮我加一个暗黑模式，改到一半我觉得颜色不对，回头换<br/>Trae Agent：<br/>&nbsp;&nbsp;→ 读项目代码（tool: Read / Glob）<br/>&nbsp;&nbsp;→ 改 CSS 变量（tool: Edit）<br/>&nbsp;&nbsp;→ 改 Toggle 组件（tool: Edit）<br/>&nbsp;&nbsp;→ 跑一下 dev server（tool: RunCommand）<br/>&nbsp;&nbsp;→ 截图给你（tool: browser_use）</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这种模式最省事，你不用配协议，不用管 Agent 和 Agent 之间怎么握手，上手就能用。代价也明显，这个 Agent 再强，它不会自己找外部帮手，上下文撑爆了它就停下来。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">但注意了。<strong style=\"font-weight:bold;\">单 Agent E2E 不是跟 MCP 和 A2A 互斥的。</strong>最常见的做法反而是，让这个主 Agent 用 MCP 接一堆专业工具，需要的时候再通过 A2A 找外部 Agent。协议可以叠在架构里面。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">同一个需求，三种走法</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">拿一个真实例子对比最直接。A2A 官网用了一个修车店的例子，我拿来拆成三层给你看。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/effect.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">同一个\"车有异响\"需求，E2E 自己扛、MCP 接工具、A2A 找帮手。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">单 Agent E2E 做法，就是写一个 Agent，在它自己的 prompt 里把所有事都塞进去，它自己能调诊断 API、自己能查配件库、自己能排维修工单。能跑，但所有能力都绑死在这一个 Agent 身上，要加个新工具还得改它的 prompt。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">加 MCP 之后，Agent 的诊断能力、配件能力、查手册能力都变成了标准化的 MCP Server。你加一个新工具，不是改 Agent，是加一个 Server。Agent 自动就能调用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">再加 A2A，Shop Manager Agent 就不用自己扛所有事了。它可以把诊断任务派给 Mechanic Agent，把找配件的事派给 Parts Supplier Agent。每个 Agent 内部用自己的工具（可能是 MCP 接的，可能是自己原生的），Agent 之间的边界由 A2A 守住。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">MCP 让 Agent 有更多力气，A2A 让 Agent 有更多帮手。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">三个放在一起该怎么选</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">先把几个最容易混的关系拍清楚。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/which.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 28px;line-height:1.6;\">三个不是互斥项，大多数情况是叠起来。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">MCP 不是 A2A 的替代品。</strong>MCP 管 Agent 调工具，A2A 管 Agent 找 Agent。一个 Agent 可以同时用 MCP 和 A2A，A2A 的协议规范里甚至明确鼓励这种叠加方式。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个 MCP Server 能不能同时当 A2A Agent 用？官方的回答是可以在某些情况下互相暴露。一个 well-defined、无状态的 MCP tool 可以被包装成 A2A 的 task。但反过来，A2A Agent 的长对话状态没法用 MCP tool 覆盖，MCP tool 天生就更像一个函数调用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">单 Agent E2E 也不是 MCP/A2A 的对立面。</strong>相反，在 90% 的场景里，你会先写一个单 Agent E2E，然后给它挂 MCP 接工具，再需要的时候挂 A2A 找外部 Agent。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">三个决策点。<strong style=\"font-weight:bold;color:#2563eb;\">你的 Agent 需不需要调用更多或更专业的工具？</strong>需要，上 MCP。<strong style=\"font-weight:bold;color:#2563eb;\">你的 Agent 需不需要自动找外部 Agent 协作？</strong>需要，上 A2A。<strong style=\"font-weight:bold;color:#2563eb;\">以上都不用，单 Agent E2E 就够了。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#2563eb;margin:10px 0 26px;\">协议不是互斥，是叠层</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">回头看最近这一年的 Agent 生态，会发现它在做的一件事特别像。把原本绑在各家 Agent 框架里的东西，一点点往外剥，剥成开放的协议。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">MCP 剥的是 Agent 和工具这一层。以前每个 Agent 框架都有自己的 tool 规范，LangChain 一套、CrewAI 一套、自研又一套。现在这一层有了一个统一协议。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">A2A 剥的是 Agent 和 Agent 这一层。以前多 Agent 协作全是框架内部的事情，LangGraph 的节点、CrewAI 的 role、自研的流程引擎。现在这一层也有了一个跨框架的协议。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">剥完之后留下的是什么？就是一个最简单的单 Agent。它可以什么协议都不用，自己干活；也可以往下挂 MCP 拿工具，也可以往外挂 A2A 找帮手。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这三个东西放在一起，其实就是三层。最底下那层是你最熟悉的主 Agent，中间层是 MCP，最顶上是 A2A。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"font-weight:bold;color:#2563eb;\">协议不是互斥选项。它们是叠在 Agent 身上的插头。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">MCP 刚出来的时候有人说它会替代 A2A，A2A 刚出来的时候有人说 MCP 不够，得靠 A2A 才是未来。其实都不是。它们一个接工具、一个找 Agent，本身就不是一个维度的事。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 20px;\">把这三个摆在一起看完，我对 Agent 这个东西的一个感受反倒是，<strong style=\"font-weight:bold;color:#2563eb;\">最朴素的那个单 Agent E2E 依然是最常用的。</strong>协议让它有了翅膀，但翅膀可以不装。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2563eb;line-height:1.7;margin:8px 0 36px;\">先用好自己，再往下接 MCP，再往外找 A2A。</p>\n\n<p style=\"text-align:center;margin:30px 0 12px;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:bold;padding:10px 22px;border-radius:8px;\">MCP · MIT&nbsp;&nbsp;|&nbsp;&nbsp;A2A · Apache 2.0</span></p>\n\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;line-height:1.7;margin:6px 0 24px;\">MCP 资料取自 modelcontextprotocol.io 官方文档；A2A 资料取自 a2a-protocol.org 官方文档与 GitHub README；两者协议互补点均有官方明确说明。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
