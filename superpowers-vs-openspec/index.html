<script id="post-data" type="application/json">
{
  "title": "Superpowers 和 OpenSpec，一个管做什么，一个管怎么做",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月19日 02:32",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 26px;\"><img src=\"assets/position.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">一个把需求变成文件，一个把流程变成技能。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最近在同一个仓库里，前后脚装了两样东西，Superpowers 和 OpenSpec。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">两个都是开源的，都是 MIT，最近都在 GitHub 上被翻来覆去地转。名字摆在一起像一对竞品，真用起来，根本不是一回事。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">先把结论放这儿。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2563eb;line-height:1.7;margin:8px 0 20px;\">OpenSpec 管的是写什么，Superpowers 管的是怎么写。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这句话看着像废话，但它决定了你什么时候该想起哪一个。</p>\n\n<p style=\"margin:50px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2563eb;margin:14px 0 24px;border-bottom:3px solid #2563eb;padding-bottom:9px;\">一个管做什么，一个管怎么做</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">OpenSpec 是一层规格。它全部的动作，是把需求从聊天框里拎出来，变成仓库里的文件。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">你每提一个变更，它就在 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c0392b;\">openspec/changes/</span> 下面给这个变更开一个文件夹。里面四样东西，proposal 写为什么做、specs 写验收标准、design 写技术方案、tasks 是一份能一条条打勾的清单。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Superpowers 不是一个工具，是一整套方法论。它往你的编程助手里塞了 <strong style=\"font-weight:bold;\">14 个技能</strong>，从头脑风暴一路排到分支收尾，而且这些技能自动触发，你不用记命令。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个像一叠图纸，摊在桌上，白纸黑字。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个像一本施工规范，平时看不见，你一动手它就从旁边拦住你。</p>\n\n<p style=\"margin:50px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2563eb;margin:14px 0 24px;border-bottom:3px solid #2563eb;padding-bottom:9px;\">两条骨架，差在谁推着走</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">把两边的骨架抽出来，一眼就看清楚了。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/flow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">左边五步靠你敲命令，右边七步靠它自己识别场景。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">OpenSpec 是一条五步循环。Explore 探索、Propose 提案、Review 评审、Apply 应用、Archive 归档。推进的力气来自你，你得敲 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c0392b;\">/opsx:explore</span>，你得敲 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c0392b;\">/opsx:apply</span>。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.8;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">/opsx:explore&nbsp;&nbsp;我想加暗黑模式，但不确定怎么做干净<br/>/opsx:propose add-dark-mode<br/>/opsx:apply<br/>/opsx:archive</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Superpowers 是七步。brainstorming、隔离工作区、写计划、子代理执行、TDD、代码审查、分支收尾。它不靠你敲命令，靠它自己判断你现在走到了哪一步。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它文档里有一句近乎偏执的话，只要你有百分之一的可能觉得某个技能用得上，你就必须调用它。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">一个是你推着走，一个是它推着你走。</strong></p>\n\n<p style=\"margin:50px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2563eb;margin:14px 0 24px;border-bottom:3px solid #2563eb;padding-bottom:9px;\">同一个需求，两套走法</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">光比骨架还是抽象。拿同一个需求过一遍，差别立刻具体。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">需求就一行，给应用加个暗黑模式。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/effect.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">同样的需求，左边落一份规格，右边落一条流水线。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">走 OpenSpec，第一步是 explore，它翻你的样式代码，摆出几个方案，问你暗色的粒度、要不要跟随系统。想清楚了 propose，它把那个变更文件夹整个建出来。你读 specs，觉得对了，才进 apply。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这一步有个细节值得说。apply 之前它建议你<strong style=\"font-weight:bold;\">新开一个会话</strong>，理由是实现的上下文越干净越好。做完 archive，那份规格就并进 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c0392b;\">openspec/specs/</span>，成了系统的正式说明书。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">走 Superpowers，第一步是 brainstorming，它先把你拦下来。一次问一个问题，不让你一口气把需求倒完，然后摆出两三个方案，产出一份设计文档。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">你点头，它进 writing-plans，把活拆成 2 到 5 分钟一条的任务，每条都带着确切的文件路径、完整的代码、跑测试的命令。它写计划时的假设很狠，官方原话是，假设来接手的是一个热情但品味差、没判断力、没有项目背景、还讨厌写测试的初级工程师。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">然后 subagent-driven-development 上场。每个任务派一个全新的子代理，做完先查一遍符不符合规格，再查一遍代码质量过不过关，两关都过了才往下走。实现全程被 TDD 技能按着跑红绿重构。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">OpenSpec 交给你一份你和 AI 都签过字的图纸，Superpowers 交给你一条每个环节都有人查的流水线。</strong></p>\n\n<p style=\"margin:50px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2563eb;margin:14px 0 24px;border-bottom:3px solid #2563eb;padding-bottom:9px;\">一个松，一个紧</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这两套东西最根本的分歧，是对该不该信任临场发挥这件事的态度。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">OpenSpec 明说自己 fluid not rigid，不卡阶段，任何一份产物你什么时候改都行。它把判断权留给人，你随时可以回头改规格，不需要走一遍仪式。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Superpowers 反过来，它几乎不信任你和 AI 的临场决定。brainstorming 里有一条硬门禁，设计没被批准之前，不许写一行代码、不许建项目。它把这类不许商量的技能叫 rigid，跟另一种可以随机应变的 flexible 明确分开。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它还有一条我很喜欢的收尾技能，verification-before-completion。原则就六个字，<strong style=\"font-weight:bold;\">先看证据，再下结论</strong>。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#2563eb;\">一个把选择权留给人，一个把纪律写进流程。</strong></p>\n\n<p style=\"margin:50px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2563eb;margin:14px 0 24px;border-bottom:3px solid #2563eb;padding-bottom:9px;\">装起来，门槛在哪</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 12px;\">两边都不难装，但路子不一样。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 20px;\">OpenSpec 是个 npm 包，需要 Node 20.19 以上。一条命令全局装，然后进项目初始化。</p>\n\n<p style=\"background:#1e1e2e;color:#e4e4f0;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.8;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\">npm install -g @fission-ai/openspec@latest<br/>cd your-project<br/>openspec init</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">它支持三十多种编程助手。斜杠命令的拼写随工具变，<span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c0392b;\">/opsx:propose</span> 是标准写法，Cursor 和 Copilot 里是 /opsx-propose，Amazon Q 是 @opsx-propose，Codex 是 $openspec-propose。init 会告诉你该用哪个。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Superpowers 走各家插件市场，Claude Code、Codex、Cursor、Copilot CLI、Gemini CLI、OpenCode、Factory Droid 都有入口，装完技能自动触发，不用额外配置。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">两边都会提模型。OpenSpec 建议用高推理的模型来做规划和实现。Superpowers 更细，它在子代理阶段按任务复杂度分配模型，纯机械的活交给便宜快的，架构和审查交给最强的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">有个细节能看出 Superpowers 的性格。它连该用哪个模型都想替你想好，省下来的都是钱。</p>\n\n<p style=\"margin:50px 0 0;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">6</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#2563eb;margin:14px 0 24px;border-bottom:3px solid #2563eb;padding-bottom:9px;\">到底选哪个</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">先说结论，这不是二选一。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/which.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">五个场景，各走各的门。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">想先对齐需求、快速迭代，用 OpenSpec。要 AI 长时间自主干活、你又在意代码质量，用 Superpowers。跨多个仓库、要让团队共用一份规格，看 OpenSpec 正在测试的 Stores。想强制 TDD、强制逐条审查，只有 Superpowers。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最顺的用法其实是叠起来。OpenSpec 负责把做什么钉死，Superpowers 负责把怎么做管住。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个管对齐，一个管纪律。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 20px;\">这两套东西摆在一起看，其实映出一个挺有意思的转折。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 20px;\">AI 写代码的能力，早就够用了。现在真正拖后腿的，不是它不够聪明，是它和你没对齐，是它一放手就跑偏。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 20px;\">OpenSpec 治第一种病，Superpowers 治第二种。</p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#2563eb;line-height:1.7;margin:8px 0 36px;\">规格和纪律，才是这条路上真正稀缺的东西。</p>\n\n<p style=\"text-align:center;margin:30px 0 12px;\"><span style=\"display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:bold;padding:10px 22px;border-radius:8px;\">OpenSpec · Fission AI&nbsp;&nbsp;|&nbsp;&nbsp;Superpowers · Prime Radiant</span></p>\n\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;line-height:1.7;margin:6px 0 24px;\">两套工具的事实、命令与流程均取自各自官方文档与仓库 README。两个项目均为 MIT 协议。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
