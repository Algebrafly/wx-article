<script id="post-data" type="application/json">
{
  "title": "MCP 协议演进趋势：从工具调用到 Agent 基础设施",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月22日 14:41",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 22px;\"><img src=\"assets/evolution.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">从 Function Calling 到通用连接层，MCP 用了一年半。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">去年这个时候，我还在给每个 Agent 项目写一堆 adapter。OpenAI 的函数调用是一种格式，Anthropic 是另一种，本地脚本又要自己解析参数。每接入一个新工具，至少要改三处：prompt 里的描述、运行时的调用、返回结果的处理。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">今年完全不一样了。MCP 这个词在开发者圈子里几乎绕不开。它不是什么新的大模型，也不是新的训练方法。它是一个协议，一个让 AI 应用统一调用外部工具的协议。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我想聊聊它的演进趋势。不是复述官方文档，而是回答一个我真正关心的问题——它会把我们带向哪里。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">它到底解决了什么问题</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">AI 应用要干实事，离不开工具。查数据库、读邮件、改代码、操作浏览器、调 Slack。问题是，每个工具的接口都不一样。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">以前的做法是，开发者自己把每个 API 包一层，写 schema，写 prompt 示例，写错误处理。然后把这个大包袱塞进 system prompt。模型能不能调对，全靠 prompt 写得好不好。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这带来两个后果。一是每个项目都在重复造轮子。二是工具一多，prompt 越来越长，模型越来越容易选错。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">MCP 的解法很直接。它把「工具长什么样、怎么调用、返回什么」标准化了。模型和工具之间不再是一对一的 adapter，而是统一协议。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#1a5fb4;\">你可以把它理解成 AI 应用的 USB-C。</strong>以前每个设备一根专用线，现在一个口能接键盘、显示器、硬盘、充电器。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">三条主线在同时推进</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">MCP 的演进不是单点的，是三条线同时拉长。看懂这三条线，基本就能判断它接下来往哪走。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第一条线，是能力模型在膨胀。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">最早 MCP 只有 tools，就是让模型调函数。很快加入了 resources，工具可以暴露文件、数据库记录、网页内容这类只读资源。后来又加了 prompts，允许 server 预置系统提示词和请求模板。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这个顺序很有意思。先解决「能做什么」，再解决「能读什么」，最后解决「该怎么说」。它把 Agent 的能力从「调用动作」扩展到「理解上下文」再到「塑造行为」。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第二条线，是 transport 在走出本地。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">2024 年底的 MCP 基本是 stdio，server 作为本地子进程跑在 Claude Desktop 或 Cursor 里。这种方式简单，但只能连本机工具。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">2025 年 remote transport 登场，SSE、Streamable HTTP 让 server 可以跑在云端。这意味着 SaaS 产品可以直接对外暴露 MCP 接口，用户不用下载任何东西。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第三条线，是从单 Agent 到多 Agent 编排。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">一个 Agent 接一个 MCP server 是起点。真正有用的是多个 Agent，每个 Agent 有自己的工具集，彼此之间还能协作。MCP 正在成为 Agent 编排层的基础设施。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/architecture.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">Host / Client / Server 三层解耦，transport 和能力是两条可以独立演进的边。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">生态已经挡不住了</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">判断一个协议能不能成，看生态比看设计更重要。MCP 的生态扩张速度，是我一开始没料到的。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">Claude Desktop 是第一家原生支持 MCP 的客户端。Cursor、Trae、OpenCode、Cline 这些 AI 编程工具很快跟上。它们的逻辑很简单：谁支持的 MCP server 多，谁的 Agent 就能干更多事。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">框架层也没闲着。LangChain、LlamaIndex、Pydantic AI 都接入了 MCP。FastMCP 让 Python 开发者几行代码就能写一个 server，mcp-go 和 mcp-rs 覆盖了另外两大语言栈。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">更意外的是平台层。Cloudflare 给 Workers 加了 MCP 支持，Smithery 和 Pulsemcp 在做 MCP server 市场，OpenRouter 把它融进模型路由，Zapier 则用 MCP 连接成千上万的自动化应用。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/ecosystem.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">从 IDE 到框架到云平台，MCP 正在变成默认接口。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这说明一件事。MCP 不再是某个厂商的私货，它正在成为 Agent 生态的「最小公约数」。不支持 MCP，等于把自己排除在 Agent 的工具网络之外。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">下一步，四个方向最值得关注</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">协议核心已经相对稳定。接下来真正的战争，发生在四个外围方向。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第一个方向是安全与权限。Agent 能调用数据库、能发邮件、能改代码，这种能力必须有边界。OAuth、scope、审计日志、危险操作拦截，都会成为 MCP 的标配。没有这些，企业不敢接。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第二个方向是网关与发现。现在找一个 MCP server，要去 GitHub 或各种 registry 翻。未来一定会有类似 npm 的中心化发现层，也会有企业内部网关，统一托管权限和连接。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第三个方向是多模态与状态。现在的 MCP 主要还是围绕文本。图片、音频、视频资源的传递，以及跨会话的状态管理，标准还在早期。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">第四个方向是编排与自动化。2026 年这个方向会落地最快。多 Agent 协作、工作流引擎、触发器，本质上都是把 MCP server 当作积木来拼装。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/roadmap.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;line-height:1.6;\">成熟度高低是暂时的，影响力大小取决于你处在哪一环。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">开发者现在能做什么</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">对普通开发者来说，MCP 最大的机会不是去写协议本身，而是把手里现有的系统包成 MCP server。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">你公司内部的 CRM、工单系统、监控平台、知识库，这些都可以是 server。一旦包好了，任何支持 MCP 的 Agent 都能直接调用，不需要再一对一集成。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">具体操作上，我建议从 FastMCP 或 mcp-go 开始。写一个 server 的成本，已经低到半小时就能跑通一个最小版本。</p>\n\n<p style=\"background:#12141a;color:#e6e8ee;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 20px;word-break:break-all;\"># 一个最小 MCP server（FastMCP）<br/>from mcp.server.fastmcp import FastMCP<br/><br/>mcp = FastMCP(\"my_tool\")<br/><br/>@mcp.tool()<br/>def get_user(name: str) -> str:<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"\"\"根据名字查询用户信息\"\"\"<br/>&nbsp;&nbsp;&nbsp;&nbsp;return f\"hello, {name}\"<br/><br/>if __name__ == \"__main__\":<br/>&nbsp;&nbsp;&nbsp;&nbsp;mcp.run()</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">当然也有坑。transport 选 stdio 还是 SSE，要看场景。本地工具用 stdio 最简单，远程服务必须上 HTTP。权限目前还不是特别完善，生产环境一定要自己加一层审计。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">另外，prompt injection 这类风险真实存在。如果 server 的 tool 描述写得太宽泛，模型可能被诱导调用不该调用的东西。描述要写精确，返回结果要校验。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a5fb4;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1a1a1a;margin:10px 0 26px;\">它真正改变的不是技术，而是分工</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">我把 MCP 理解成一个分界点。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">在此之前，做 AI 应用的人，很大一部分精力花在「让模型能调用外部世界」。写 schema、调 prompt、处理异常、维护 adapter。每个项目都是定制工程。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">在此之后，这些会沉淀成可组合的模块。模型负责判断，MCP server 负责执行，开发者负责设计能力和边界。分工变清晰了，创新反而更快。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\"><strong style=\"font-weight:bold;color:#1a5fb4;\">它不是在给模型增加能力，而是在给世界增加一个能被模型理解的接口。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">所以 MCP 的终局，也许不是某个协议一统天下，而是让「一切工具都能被 Agent 调用」变成默认假设。就像我们默认网页都有 URL、默认 API 都返回 JSON 一样。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">到那时候，竞争的重点会从「我能不能连上这个工具」，变成「我能不能设计出让 Agent 用得好的工具」。</p>\n\n<p style=\"border-left:4px solid #1a5fb4;padding:14px 18px;background:#f3f7ff;margin:26px 0 18px;line-height:1.8;color:#2b2b2b;font-size:15px;\">\n给模型造环境，而不是只给模型写 prompt。\n</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#2b2b2b;margin:0 0 18px;\">这句话可能是 MCP 带给我们的最大启示。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
