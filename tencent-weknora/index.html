  /* 说明：正文的强调、卡片、表格一律用「行内 style」写在 body.html 里，

  /* ---------- 响应式 ---------- */
  @media (max-width:720px){

  }
</style>

<script id="post-data" type="application/json">
{
  "title": "WeKnora：微信团队开源的\"活\"知识库 — RAG · ReAct Agent · Auto-Wiki 三合一",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月30日 15:04",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 14px;font-size:13px;letter-spacing:4px;color:#6b7a90;\">TENCENT · WENKORA</p>\n<p style=\"text-align:center;font-size:26px;font-weight:bold;color:#0f172a;margin:0 0 10px;line-height:1.3;\">WeKnora：微信团队开源的\"活\"知识库</p>\n<p style=\"text-align:center;font-size:15px;color:#475569;margin:0 0 30px;\">RAG · ReAct Agent · Auto-Wiki 三合一</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">过去两年 RAG（检索增强生成）几乎成了 AI 知识库的代名词。把文档切成 chunks，embed 进向量库，query 时相似度召回几个片段塞给 LLM —— 这个套路能跑通，但总觉得差了点什么。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">腾讯微信团队去年开源的 WeKnora，MIT 协议，现在 GitHub 上已经 3 万多颗星。它给了一个不太一样的答案：<span style=\"font-weight:bold;color:#1a73e8;\">知识库不应该只是一个向量库，而应该是一套\"能检索、能推理、能自己整理\"的系统。</span></p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">官方的一句话定位 —— Turn Documents into Living Knowledge with RAG, Agents and Auto-Wiki。关键词是那个 <span style=\"font-weight:bold;color:#1a73e8;\">Living</span>，\"活的\"。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/core.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 1 · 三大核心能力</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a73e8;color:#1a73e8;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #60a5fa;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a73e8;margin:18px 0 26px;\">先搞清楚：WeKnora 到底是什么</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">简单说，WeKnora 是一套完整的企业级知识库平台，三个关键词：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#1a73e8;\">RAG</span> —— 传统检索增强生成，但做得更细：多模态文档解析、BM25 + 向量混合召回、智能分块、切片可编辑可 diff 可回滚。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#06b6d4;\">ReAct Agent</span> —— 让知识库不仅能\"回答\"，还能\"动手\"。Agent 可以调用工具在沙箱里执行代码、读文件、写文档。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#22c55e;\">Auto-Wiki</span> —— 这是 WeKnora 最有辨识度的功能。不是让你自己切 chunks，而是让 Agent 读完文档后，自己写成一套互相链接的 Markdown 页面。Wiki 是给人看的知识资产，chunks 是给机器用的中间产物。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">技术栈也值得提一下：Go 后端 + Vue 前端 + Python 文档解析器。数据库底层用的是 ParadeDB —— PostgreSQL 上同时跑 BM25 全文检索和 pgvector 向量检索，一个库搞定混合召回。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/stack.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 20px;\">图 2 · 技术栈分层</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">可替换的组件特别多 —— 20+ LLM 供应商、8 种向量库、7 种对象存储。想全换自研完全可以。官方还提供了 PyPI 包 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:4px;\">tencent-weknora-mcp</span>，29 个工具，支持 stdio / SSE / HTTP 三种 transport，可以直接当 MCP server 让 Cursor、Claude Desktop 去调。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0ea5e9;color:#0ea5e9;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #22d3ee;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0ea5e9;margin:18px 0 26px;\">装起来：一条 docker compose 起全套</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">Docker compose 是最省事的方式。不到 5 行命令：</p>\n\n<p style=\"background:#0f172a;color:#e2e8f0;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\ngit clone https://github.com/Tencent/WeKnora.git<br/>\ncd WeKnora<br/>\ncp .env.example .env&nbsp;&nbsp;&nbsp;&nbsp;# 编辑 LLM key / DB 密码等<br/>\ndocker compose pull<br/>\ndocker compose up -d\n</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">起好之后，Web UI 访问 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0ea5e9;\">http://localhost</span>，后端 API 在 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0ea5e9;\">http://localhost:8080</span>。默认容器包含：前端、Go 后端、DocReader Python 解析器、PostgreSQL（ParadeDB）、对象存储（本地 / MinIO）。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">.env 里最关键的几个配置项：</p>\n\n<p style=\"background:#0f172a;color:#e2e8f0;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# LLM 供应商（OpenAI / Anthropic / 腾讯混元 / DeepSeek ...）<br/>\nLLM_PROVIDER=openai<br/>\nLLM_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxx<br/>\nLLM_MODEL=gpt-4o<br/><br/>\n# 向量存储（默认 ParadeDB 即 PostgreSQL + pgvector）<br/>\nVECTOR_STORE_TYPE=paradedb<br/>\nDATABASE_URL=postgresql://postgres:password@localhost:5432/weknora<br/><br/>\n# 沙箱后端（v0.8.0+ 推荐 Docker）<br/>\nSKILL_SANDBOX_BACKEND=docker\n</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">生产环境部署建议放内网，不要直接暴露公网。理由下面讲沙箱的时候再说。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #16a34a;color:#16a34a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #4ade80;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#16a34a;margin:18px 0 26px;\">上传文档就能用了？不止</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">WeKnora 支持多格式文档（PDF / Word / Excel / Markdown / HTML / PPT）和多源数据接入（飞书、Notion、微信对话开放平台的对话数据）。上传之后你可以选择三条路：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;\">传统 RAG 模式</span> —— 自动切片、embed、入库，直接开始 query。切片可以在界面上编辑，每个版本有快照、支持 diff 和回滚，改完自动重建索引。这点是所有做 RAG 的人都该抄的 —— 传统做法是\"改配置 → 重解析整个库\"，现在变成\"改一段文字 → 自动更新索引\"，反馈成本差几个数量级。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;\">Wiki 模式</span> —— 让 Agent 把文档读完，自动写成一套带内部链接的 Markdown 页面。每个页面有快照、可 diff、可回滚，还能直接在浏览器里编辑。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/compare.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 20px;\">图 3 · 传统 RAG vs WeKnora Wiki 模式</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">右边那个 Wiki 模式才是 WeKnora 的\"活\"字所在。上传 50 份 API 文档，传统 RAG 切成 3000 个片段存进向量库，查到了关键词但不知道段落之间是什么关系。Wiki 模式换了个思路：Agent 读完之后重新写成一套互相链接的页面，知识图谱里区分了 <span style=\"font-weight:bold;\">链接、实体、概念、综合、对比</span> 五种关系。页面不是黑盒 —— 你点开就能看，改了存快照，一键回滚。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;\">Agent 模式</span> —— 给知识库配上 ReAct Agent。这一步是 WeKnora 和传统 RAG 最大的区别。Agent 不只是\"从知识库里选片段来回答\"，而是可以先搜知识库、再读文档、再调工具、最后交付一个完整产物。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #dc2626;color:#dc2626;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f87171;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#dc2626;margin:18px 0 26px;\">一个真实例子：让 Agent 写一份 Word</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">有人实测过，在 WeKnora 里问了一句：<span style=\"font-style:italic;font-weight:bold;\">\"什么是人形机器人？把结果写到 Docx 文件中。\"</span></p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">Agent 没有回一段话。它做了这些事：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\">① 在自己的知识库里搜\"人形机器人\"关键词，拉回 4 篇文档</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\">② 读完文档片段，拼成大纲</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\">③ 读了一遍 docx 技能的说明（技能沙箱里有 docx 工具）</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\">④ 在沙箱里写了一个 JS 脚本跑通</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">⑤ 交付一份带封面、目录层级、正文结构的 Word 文件</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">全程 17 轮推理、20 次工具调用、2 分 38 秒。没有一次复制粘贴。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/sandbox.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 20px;\">图 4 · 沙箱执行流程五步法</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">这件事的关键叫 <span style=\"font-weight:bold;color:#dc2626;\">Skill Sandbox Runtime</span>（技能沙箱运行时）。它分两层：技能目录把散落在 Agent 里的技能集中管理（可以从 ClawHub、SkillHub、git 仓库、zip 包安装），沙箱是技能必须进去才能被调用的隔离环境。v0.8.0 支持 Docker、E2B、Cube 三种后端，而且是 <span style=\"font-weight:bold;color:#dc2626;\">会话级持久</span> 的 —— 上一轮沙箱里写下的文件、装好的 npm 包，下一轮还在。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">最值得提的是那个\"容易被当成降级\"的改动：v0.8.0 移除了 Local host-process 后端，Docker 改成需要显式开启（opt-in）。上一版允许技能直接在宿主机上跑进程，这一版把它砍了。<span style=\"font-weight:bold;color:#16a34a;\">先收紧执行边界、再放开能力 —— 这个顺序是对的。</span>国内不少项目是反过来的。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #7c3aed;color:#7c3aed;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #a78bfa;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#7c3aed;margin:18px 0 26px;\">一个极简实操示例</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">假设你是产品团队，想建一个\"产品需求 → 技术实现 → 运营数据\"一站式知识库。走完下面 5 步：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:4px;\">Step 1</span> 起 WeKnora（docker compose up -d），Web UI 登录后建一个 Knowledge Base 叫 \"product-ops\"。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:4px;\">Step 2</span> 上传产品 PRD（Markdown）、后端技术方案（PDF）、线上运营周报（Excel），开启 Wiki 模式让 Agent 自动写成互相链接的 Wiki 页面。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:4px;\">Step 3</span> 给沙箱装 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">docx</span> 技能和 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">python-data</span> 技能。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:4px;\">Step 4</span> 问 Agent：\"上个月月活增长最猛的那个功能是什么？把 PRD 里关于它的设计决策、技术方案里的实现细节、以及这个月活数据一起整理成一份 PDF 报告。\"</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:4px;\">Step 5</span> Agent 自动检索 PRD Wiki 页 + 技术方案 Wiki 页 + Excel 数据图，在沙箱里用 python-data 算增长率，用 docx 拼成 PDF。交付给你。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #334155;color:#334155;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #64748b;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#334155;margin:18px 0 26px;\">小结 &amp; 边界</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">WeKnora 补了两类传统 RAG 没覆盖好的缺口。一是 <span style=\"font-weight:bold;color:#06b6d4;\">可执行性</span> —— 让知识库不仅能回答，还能产出实际的文件、图表、报告。二是 <span style=\"font-weight:bold;color:#22c55e;\">可读性</span> —— Wiki 模式把机器用的 chunks 变成了人能直接读能直接改的知识资产。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">但也有几个要注意的边界：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;\">内网部署</span> —— 官方明确说生产环境不要直接暴露公网。沙箱能执行代码，这是把双刃剑。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;\">v0.8.0 之后安全收紧</span> —— 宿主机直接跑代码的后端被砍了，Docker 显式开启。这是对的，但意味着从旧版本升级的团队要注意配置迁移。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;\">切片可编辑是亮点也是复杂度</span> —— 你能手动改 chunk、diff、回滚，但改完自动重建索引，这个机制需要团队慢慢适应。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">最后回到那句\"Living Knowledge\"。知识库从\"一个向量库\"变成了\"一个能读写、能推理、能动手的系统\" —— 这件事最值得抄的不是功能列表，而是那个顺序：<span style=\"font-weight:bold;color:#dc2626;\">先把边界收紧（沙箱隔离、opt-in），再放开能力（技能库、Agent、Wiki）。</span>国内不少 AI 项目是反过来的。</p>\n\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:40px 0 0;padding-top:20px;border-top:1px solid #e2e8f0;\">参考链接：</p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 6px;\"><a href=\"https://github.com/Tencent/WeKnora\" style=\"color:#2563eb;text-decoration:none;\">GitHub 仓库（Tencent/WeKnora）</a></p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 6px;\"><a href=\"https://weknora.weixin.qq.com\" style=\"color:#2563eb;text-decoration:none;\">官方网站</a></p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 6px;\"><a href=\"https://weknora.weixin.qq.com/docs/\" style=\"color:#06b6d4;text-decoration:none;\">官方文档</a></p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 6px;\"><a href=\"https://cloud.tencent.com.cn/developer/article/2751140\" style=\"color:#22c55e;text-decoration:none;\">深度解读：WeKnora + BrowserSkill</a></p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 20px;\"><a href=\"https://pyshine.com/WeKnora-Tencent-Open-Source-Knowledge-Framework-RAG-Agents-Wiki/\" style=\"color:#7c3aed;text-decoration:none;\">PyShine 安装教程</a></p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
