<script id="post-data" type="application/json">
{
  "title": "别再让 AI 写紫色渐变了：unslop 把界面重做一遍",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月18日 15:35",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">先看这张图。上半排和下半排，是同一个财务看板。</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/frames.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">官方示例的八帧：前四帧是原始界面，红框标注和间距数字是它标出来的问题；后四帧是同屏逐步变干净的过程</p>\n\n<p style=\"margin:24px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第一次看到这个对比，我把自己的两个页面翻出来重看了一遍。紫色的渐变按钮、每张卡片一个 emoji、间距全靠模型当天心情——一模一样。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这就是 unslop 要处理的东西。它是一个给 Claude Code、Codex、Google Antigravity 用的 skill，作者是 Damir Sokolovsky（@heydamir），采用 CC BY 4.0。国内可以走 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">gitee.com/algebra/unslop</code> 这个镜像克隆。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它做的事情很窄：把 AI 生成的界面，改成像有人设计过的样子。不改功能，不改文案内容，不改板块顺序。</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">什么是 slop</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Slop 是英文里喂牲口的泔水，现在拿来指\"量大、廉价、看着像那么回事\"的 AI 产出。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">放在界面上，它有一套非常稳定的长相：</p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 紫到蓝的渐变铺满背景、卡片、按钮、选中项</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 渐变文字，标题、数字、logo 都来一遍</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 彩色发光阴影、内容背后的模糊色块</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 每个标题前一个 emoji，每个状态后一个 emoji</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">mt-[13px]</code>、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">py-[11px]</code> 这种随手写的间距</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 800、900 字重的标题，配全大写宽字距的标签</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">Welcome back, Damir! 👋</code> 这种问候式标题</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">Loved by 10,000+ teams</code> 这种查不到出处的背书</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">animate-pulse</code> 呼吸灯、<code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:13px;\">transition-all</code>、hover 放大</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这些不是审美偏好问题，是同一套默认值。模型训练数据里\"好看的网页\"长这样，它就照着抄。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">SKILL 里有一句话，把 slop 和 craft 的区别讲得很准：<b>区别在于\"丰富度\"放在哪。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">slop 把颜色和特效铺在 chrome 上——背景、按钮、边框、标签。craft 让 chrome 保持安静，把丰富度压进一两个内容瞬间里：一个渲染出来的实物、一张画得认真的图表、一张来自产品所属世界的图。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">所以它的验收标准不是\"变简洁了\"，而是五条更硬的东西：</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 一屏只有<b>一个亮点</b>，其余全部退后</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· chrome 安静，导航、按钮、文字只用中性色和一个 accent</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 一句话说得清这张视觉在展示什么、为什么属于这个产品</p>\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 标题落在留白处，一个主行动、最多一个次行动</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 预览像真产品，数字合理，物体有重量和光</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">最后还有一道自检：<b>把产品名换成另一个产品，这个界面还成立吗？</b>如果成立，说明方向推得不够，重来。</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">装上，然后第一句话说什么</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Claude Code 最简单，一行装成插件，所有项目可用：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">claude plugin install unslop --marketplace heydamir/unslop</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">版本旧一点、不认 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--marketplace</code>，拆成两步：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">claude plugin marketplace add heydamir/unslop<br/>claude plugin install unslop@heydamir</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">只想给团队里所有人用，在项目根目录加 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">--scope project</code>，把生成的 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">.claude/settings.json</code> 提交上去。装完开个新会话，或者在已开的会话里敲 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">/reload-plugins</code>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Codex 让它自己装：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:15px;color:#1d1d1f;line-height:1.9;\">$skill-installer install https://github.com/heydamir/unslop/tree/main/skills/unslop</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Antigravity 或者手工装，就是复制目录：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">git clone https://gitee.com/algebra/unslop<br/>mkdir -p ~/.agents/skills &amp;&amp; cp -r unslop/skills/unslop ~/.agents/skills/</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Antigravity 把目标目录换成 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">~/.gemini/config/skills/</code>。想只给单个项目用，就放进项目里的 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">.agents/skills/</code>。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有一件事：如果你以前把 unslop 手动拷进过 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">~/.claude/skills/</code>，现在要删掉那份。不然 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">/unslop</code> 会继续跑旧的那份，插件版本永远不生效。这个坑我踩了。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">用起来的语法就三种：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:2;\">/unslop this dashboard<br/>/unslop the hero of https://example.com<br/>/unslop my landing page and make the story video</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它支持三种输入：有源码（Next.js、React、Vue、Svelte、Tailwind、纯 HTML 都行）、只有一个线上链接、只有一张截图。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">只有链接的时候，它会先跑 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">scripts/snapshot.mjs</code> 把页面存成静态文件，同时留一张 <code style=\"background:#f2f2f7;padding:1px 5px;border-radius:3px;font-size:14px;\">original.live.png</code>，改完再截图对比。它会先滚一遍页面，懒加载的图和区块才拿得到。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">但脚本画的动态背景存不下来。这种情况它会在报告里按线上页的描述写，不会假装自己看见了。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">Playwright 和 ffmpeg 不是必装，只有要快照线上站、或者要做故事视频时才需要。</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">它不动手，先给你五句话</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这是我认为它最像\"设计师\"的地方：<b>它改之前会先停下来。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第一步是审计。它拿着自己那份 signs 清单，逐条列出屏幕上的问题，每条写清\"是什么\"和\"在哪\"。不是笼统说\"配色不好\"，而是\"激活的导航项用了紫蓝渐变，在侧边栏第 3 行\"。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第二步是判断改多少。它把情况分三档：</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">audit 结果</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">它怎么做</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">重度 slop<br/>（颜色、字体、图标、文案全线失守）</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">走完整九道 pass，重新定方向</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">轻度 slop<br/>（整体有设计，剩几个毛病）</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">打磨模式：只修审计出来的，方向沿用现有品牌，配色字体版式都不动</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">没有 slop</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">直接告诉你\"这屏已经不错了\"，最多给两三条带具体数值的小建议</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">第三档是整套逻辑里我最喜欢的地方。它明确写着：<b>永远不要为了让屏幕\"不一样\"而去改一个本来就不错的屏幕。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">方向那一步只写五行，但五行必须从产品本身推出来，不能从\"最近流行什么\"推出来。</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;width:26%;\">那一行</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">要回答什么</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">Product</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">它替谁做什么，一句大白话</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">Character</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">两三个具体的词，比如\"冷静、精确、有点温度\"。clean、modern、sleek、minimal、premium 这五个词禁止使用，因为它们描述的是所有模板</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">World</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">产品天生属于哪个场景或材质。笔记应用靠近纸与墨，监控工具靠近仪表与夜班，旅行应用靠近地图与窗光。这个\"世界\"决定中性色往哪边偏</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">Moments</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">一到两个\"允许变丰富\"的地方，比如预览里一张有材质的卡、一张每色代表一个序列的图</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">Signature</td>\n<td style=\"border:1px solid #e5e5ea;padding:11px 12px;color:#2b2b2b;\">一个只有这个产品会有的小细节，且只用一次。监控工具一个实时状态点，开发者工具一组键帽，教学应用一道手画下划线</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">写完这五行，它会把审计和方向一起给你，然后<b>停下等你确认</b>。理由写得很直白：方向改晚了，前面全白做。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这一步千万别急着催它\"别问了直接改\"。方向错了，九道 pass 跑得越顺，返工越狠。</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">九道 pass，顺序是有讲究的</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它像设计师做 redline review：一层一层过，一道 pass 全屏改完，再开始下一道。顺序不能换。</p>\n\n<table style=\"margin:16px 0 0;border-collapse:collapse;width:100%;font-size:14px;\">\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;width:22%;\">顺序</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;background:#f5f5f7;font-weight:bold;color:#1d1d1f;\">这道在改什么</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">1 Spacing</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">全部落到 4px 网格；同类元素同高同间距；组内间距小于组间；图标、标签、数字各对齐一列</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">2 Color</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">一条中性色 ramp、三种文本角色、一个 accent；删渐变文字、彩色发光、色块背景</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">3 Icons</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">emoji 全部换成线性图标；一套、一个尺寸（16 或 18px）、1.5 描边、跟随文本颜色</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">4 Copy</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">标题说清给谁做什么；去掉感叹号、问候语、超级词；变更要带对比基准；假数据换成合理数字</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">5 Type</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">字号从一套 scale 里取，字重 400 / 500，最多 600；层级靠字号和颜色，不靠字重</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">6 Layout</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">板块和顺序不动，板块内部的对齐和比例可以改；app 保持桌面比例，不缩成居中窄栏</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">7 Details</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">嵌套圆角、状态区分、键帽、图表层级、统计卡只放数字</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">8 Visuals</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">删掉装饰性 blob 和球；落地页换成真实场景图或产品预览；dashboard 基本不需要生成图</td>\n</tr>\n<tr>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#c2410c;font-weight:bold;\">9 Motion</td>\n<td style=\"border:1px solid #e5e5ea;padding:10px 12px;color:#2b2b2b;\">删呼吸灯、删 transition-all、删 hover 放大；只留能解释事情的动效</td>\n</tr>\n</table>\n\n<p style=\"margin:22px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">为什么是这个顺序，SKILL 里给了三条理由，我觉得都对：</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>间距第一</b>——节奏对了，其他东西读起来才是另一个样子。间距没定就调颜色，等于在歪的地基上刷墙。</p>\n\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>文案在字体和版式之前</b>——标题的长度决定它该多大、该放哪。先定字号再改文案，必然重排。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>视觉和动效最后</b>——它们要装进一个\"本来就能用\"的屏幕里。屏幕没有视觉也成立，动效才有资格加。</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/dashboard-after.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">官方示例里清理后的看板：chrome 全是中性灰，颜色只留给图表和一张实体卡片，侧边栏是唯一对齐的列</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">最值得抄走的三条规则</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">九道 pass 里规则很多，但真正能立刻用上的，我觉得是这三条。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">一、accent 不是主色，是\"只用一两次\"的颜色。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">chrome 里只允许一个 accent，它标记主行动、选中项，或者那一个真正重要的数字。很多人把它当品牌色，铺满所有按钮和标签，结果又变回 slop，只是从紫色换成了别的颜色。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">配套的细节也很实用：accent 上放文字，对比度要到 4.5:1；做不到就把 accent 压深，或者改用深色字。accent 当文字用在浅色底上，也得用它的深色版本。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">二、暗色主题的主按钮，可以是米白。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">深色界面上，主按钮不用非得上彩色。从 ramp 里取一个偏白的颜色当按钮底、配深色字，把 accent 让给选中项和关键数字，往往比一个彩色按钮更像想过的。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">这条我直接改在了自己的项目里，观感变化比想象中大。</p>\n\n<p style=\"margin:0 0 12px;font-size:16px;line-height:1.8;color:#2b2b2b;\"><b style=\"color:#c2410c;\">三、一屏只能有一张\"主图\"。</b></p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">图表要有层级，跟文字一样。一张主图明显是屏幕上最大的东西，画得最认真；其他展示数据的地方要小、要不同类——比如一个细条排名列表，而不是第二张同样大小的图。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">一张图里也只有一个 accent：当前月份、你在追的那条线、涨上去的那个套餐，上色；其余全走中性灰阶。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">还有一句我特别认同：<b>如果图表只是占位的噪声，就换成能说明问题的真数据。</b>彩虹柱换成一条主线，比调十次色板都有用。</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">那个十秒视频是怎么做出来的</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">文章开头那张八帧图，来自它自带的故事视频能力：一段方形、十秒以内、屏幕上每一处 slop 被逐个修掉的录像。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">技术上它没有\"前后两张图切换\"，那种做法一眼就是剪辑。它做的是<b>同一个页面只改 CSS，让所有值原地补间</b>：间距撑开、紫色褪掉、圆角变软，你都看得见过程。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">几个实现细节挺聪明：</p>\n\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 元素从左上往右下错开几十毫秒启动，变化像一道波扫过屏幕</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 文案替换是旧的模糊淡出、新字逐字升起，全片最多八处，多了就像两张图硬切</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 红色选择框标出 slop，间距的红线数字跟着元素实时从旧值数到新值</p>\n<p style=\"margin:0 0 8px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 方块裁得近，只拍变化最大的那块，手机上才看得清</p>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\">· 渐变不能补间，就把渐变单独一层，淡出它的透明度</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">渲染要 Playwright 和 ffmpeg：</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:16px 0;font-family:Menlo,Consolas,monospace;font-size:13px;color:#1d1d1f;line-height:1.9;\">npm install -D playwright<br/>npx playwright install chromium<br/>node scripts/story.mjs unslop-story/story.html unslop-story.mp4</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">它在 SKILL 里也提醒了：这会多花几分钟，所以只在你明确要的时候才做。别默认它每次都会给你出片。</p>\n\n<p style=\"text-align:center;margin:44px 0 0;\"><span style=\"display:inline-block;border:2px solid #1a1a1a;color:#1a1a1a;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #c2410c;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">用了几次之后，我的六点结论</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>1. 它的价值不在\"变好看\"，在\"每个值都有理由\"。</b>4px 网格、三种文本角色、一个 accent、一个亮点——这些不是风格，是约束。有了约束，下一屏你也能自己改对。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>2. 它不会碰你的功能。</b>板块顺序、功能、内容全保留。想改信息架构得自己先说明，它默认不做。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>3. 它拒绝为改而改。</b>屏幕本来就好的时候，它直接说\"已经不错了\"，给两三条具体建议就停。这条克制比能力更难得。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>4. 生成图是要花钱的。</b>真需要一张场景图时，它会把 prompt 拿给你看，每次付费生成之前都问你，也可以顺手把 fal、Replicate、OpenAI images 这类服务接成 MCP。</p>\n\n<p style=\"margin:0 0 12px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>5. 它明确反对\"换一种潮流\"。</b>删掉毛玻璃不等于换成颗粒噪点，删掉 bento 不等于换成另一种网格。这条在 SKILL 的\"Do not\"里写得很硬，也是很多\"设计师风格\"工具翻车的地方。</p>\n\n<p style=\"margin:0 0 16px;font-size:15px;line-height:1.8;color:#2b2b2b;\"><b>6. 只有链接也能用，但别指望完美。</b>动态背景存不下来，它会在报告里说明；页面结构复杂时，重建的静态副本可能跟线上有细微差别，交付的是\"可以交给真站负责人\"的代码，不是一键上线。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;line-height:1.7;padding:30px 0 6px;\">slop 的反面不是极简，<br/>是每个值都有人做过决定。</p>\n\n<p style=\"margin:14px 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">AI 现在不缺把页面写出来的能力。缺的是有人在旁边说：这个间距不对，这个紫色没有含义，这个 emoji 不该在这里。</p>\n\n<p style=\"margin:0 0 16px;font-size:16px;line-height:1.8;color:#2b2b2b;\">unslop 把这件事写成了九道可以重复执行的 pass。你可以用它，也可以只把它那份清单抄进自己的项目规范。</p>\n\n<p style=\"margin:24px 0 0;\"><img src=\"assets/hero-after.png\" style=\"width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"text-align:center;font-size:13px;color:#8e8e93;margin:10px 0 0;line-height:1.6;\">官方示例的落地页 hero：一张占据整屏的场景图，标题落在留白处，产品界面从底部升起</p>\n\n<p style=\"background:#f5f5f7;border-radius:8px;padding:16px 20px;margin:32px 0 0;font-size:14px;line-height:2;color:#2b2b2b;\">\n<b>相关链接</b><br/>\n· 国内镜像：gitee.com/algebra/unslop<br/>\n· 原仓库：github.com/heydamir/unslop<br/>\n· 作者：Damir Sokolovsky（@heydamir）<br/>\n· 许可：CC BY 4.0，可商用，需署名并回链\n</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
