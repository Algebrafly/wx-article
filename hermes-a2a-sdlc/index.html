<script id="post-data" type="application/json">
{
  "title": "A2A 协议配 Hermes Agent：把 SDLC 六阶段串成 Agent Pipeline",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月30日 14:49",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;margin:0 0 14px;font-size:13px;letter-spacing:4px;color:#6b7a90;\">HERMES AGENT · A2A</p>\n<p style=\"text-align:center;font-size:26px;font-weight:bold;color:#0a1420;margin:0 0 10px;line-height:1.3;\">A2A 协议配 Hermes Agent</p>\n<p style=\"text-align:center;font-size:15px;color:#4a5568;margin:0 0 30px;\">把 SDLC 六阶段串成一条 Agent Pipeline</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">很多人聊 multi-agent，聊到最后就是一个乱哄哄的群聊 —— 每个 agent 都在说话，没人干活，也没人知道谁对谁错。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">Hermes 对 multi-agent 的答案更硬一点：<span style=\"font-weight:bold;color:#c2410c;\">角色隔离 + 工具边界 + 可验证的交接。</span>每个 agent 只干一件事、只拿该拿的工具、交付物必须有可验证的凭据（文件路径、URL、测试结果）。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">如果多个 agent 跑在同一台机器上，Hermes 有 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c2410c;\">delegation</span>（进程内子 agent）和 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c2410c;\">kanban</span>（持久化任务队列）。但一旦要跨机器、跨框架协作 —— 比如桌面端的 Hermes 把任务甩给服务器上的 Research Agent，或者让 LangChain 里的 agent 调 Hermes 的 coding 能力 —— 就得靠 <span style=\"font-weight:bold;color:#c2410c;\">A2A 协议</span>。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">A2A（Agent2Agent）是 Linux Foundation 维护的开放协议 v1.0。Hermes 的 A2A 插件是<span style=\"font-weight:bold;\">双向的</span> —— 你的 agent 能调别人的，也能被别人调。</p>\n\n<p style=\"text-align:center;margin:30px 0 0;\"><img src=\"assets/sdlc_flow.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 30px;\">图 1 · SDLC 六阶段 Agent Pipeline</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #c2410c;color:#c2410c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #f97316;\">1</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#c2410c;margin:18px 0 26px;\">先把 A2A Gateway 跑起来</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">启用 A2A 很简单，一条命令或者改 config.yaml 都行。交互式向导会把端口、token 一起帮你填好。</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 方式一：交互式向导\nhermes gateway setup&nbsp;&nbsp;&nbsp;&nbsp;# 选 A2A<br/><br/>\n# 方式二：直接改 ~/.hermes/config.yaml\ngateway:<br/>\n&nbsp;&nbsp;platforms:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;a2a:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;enabled: true<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;extra:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;port: 9900\n</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">gateway 只是入站端 —— 让别人能调你。要让你的 agent 能主动调别人，还得启用出站工具集 <span style=\"font-family:Consolas,Menlo,monospace;font-size:14px;color:#c2410c;\">a2a</span>，默认是关的：</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# 给 CLI / TUI 会话启用出站\nhermes tools enable a2a --platform cli<br/><br/>\n# 给某个 IM 平台启用\nhermes tools enable a2a --platform wecom<br/><br/>\n# 让入站 A2A 任务也能调 peer（agent chain）\nhermes tools enable a2a --platform a2a\n</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">两个都开了，才算双向打通。入站提供服务，出站调用别人。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #1d4ed8;color:#1d4ed8;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #3b82f6;\">2</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1d4ed8;margin:18px 0 26px;\">A2A 协议到底在传什么</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">Hermes 的 A2A gateway 暴露三样东西：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#1d4ed8;background:#dbeafe;padding:2px 8px;border-radius:4px;\">Agent Card</span> —— <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">GET /.well-known/agent-card.json</span>，相当于 agent 的\"身份证\"，声明它有什么技能、需要什么认证。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#1d4ed8;background:#dbeafe;padding:2px 8px;border-radius:4px;\">JSON-RPC 2.0</span> —— <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">POST /</span>，标准方法包括 SendMessage、GetTask、CancelTask、SubscribeToTask。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#1d4ed8;background:#dbeafe;padding:2px 8px;border-radius:4px;\">SSE Streaming</span> —— SendStreamingMessage 用 Server-Sent Events 逐帧推回复，适合长任务。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">入站任务被注入到 gateway 的活动会话里 —— 同一个 agent、同一份记忆、同一套工具，回复作为 task result 返回给调用方。对话通过 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#1d4ed8;\">contextId</span> 做 key，所以 peer 可以发起多轮对话。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/a2a_arch.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 20px;\">图 2 · Orchestrator 双向调度各阶段 Agent</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #15803d;color:#15803d;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #22c55e;\">3</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#15803d;margin:18px 0 26px;\">五个出站工具怎么调</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">开了出站工具集之后，agent 多五个函数：</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/a2a_tools.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 20px;\">图 3 · 出站工具集 + 入站接口</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">用法很直觉。<span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">a2a_discover(url)</span> 先看看对方有什么技能。<span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">a2a_call</span> 发任务拿回复，支持 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">context_id</span> 做多轮。<span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">a2a_orchestrate</span> 可以按能力扇出 —— 比如对所有打了 research 标签的 peer 同时发同一个 query，mode 选 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">all</span>（全要）、<span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">first</span>（第一个回就停）或 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">best</span>（Agent 自己挑最好的）。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">常用 peer 可以预先写进 config.yaml 的 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#15803d;\">a2a_agents</span> 块，省得每次传 URL 和 token。agent 直接叫名字就行：\"让 research agent 总结一下今天的 arXiv 新帖子。\"</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\na2a_agents:<br/>\n&nbsp;&nbsp;researcher:<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;url: \"http://research-box.local:9900\"<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;auth: { type: bearer, token: \"...\" }<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;timeout: 120<br/>\n&nbsp;&nbsp;&nbsp;&nbsp;capabilities: [web_search, research]\n</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #7e22ce;color:#7e22ce;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #a855f7;\">4</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#7e22ce;margin:18px 0 26px;\">SDLC 六阶段各挂一个 Agent</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">拿 SDLC 举个具体的例子。我们把 Plan、Design、Build、Test、Deploy、Maintain 六个阶段各挂一个 Hermes Agent，每个 agent 独立进程、独立模型、独立记忆和工具。一个 Orchestrator 通过 A2A 串起来。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#c2410c;\">Plan Agent</span> —— 接收自然语言需求，产出结构化 plan.txt + plan.json（里程碑、验收标准、风险）</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#1d4ed8;\">Design Agent</span> —— 读 plan，产出 PRD + API spec + wireframes（用浏览器工具截图）</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#15803d;\">Build Agent</span> —— 按 spec 实现代码 + 跑 lint + 基础单测</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#7e22ce;\">Test Agent</span> —— 集成测试 + edge case 扫描 + 性能 benchmark</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#0e7490;\">Deploy Agent</span> —— 打包 + 推容器镜像 + 走 CD pipeline + smoke test</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;color:#b45309;\">Maintain Agent</span> —— 读监控日志 + 生成周报 + 触发修复任务</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">每个 agent 的工具是受限的。Plan Agent 只有文件和 web search。Build Agent 有终端和 git。Deploy Agent 只能走预定义的 deploy 脚本，不能随便 shell。这样即使 Build Agent 被 prompt injection 骗了，也没法直接改生产。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #0891b2;color:#0891b2;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #06b6d4;\">5</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#0891b2;margin:18px 0 26px;\">Plan Agent 怎么和 Design Agent 握手</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">好，具体来看两个 agent 之间是怎么通过 A2A 交互的。我们看 Plan Agent 交付给 Design Agent 这一步。</p>\n\n<p style=\"text-align:center;margin:20px 0 0;\"><img src=\"assets/plan_design.png\" style=\"width:100%;border-radius:10px;display:block;margin:0 auto;\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#9ca3af;margin:10px 0 20px;\">图 4 · Plan → Design 的 A2A 五段式交互</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">分五步走：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0891b2;background:#cffafe;padding:2px 8px;border-radius:4px;\">Step 01</span> —— Orchestrator 调 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0891b2;\">a2a_call(\"plan-agent\", \"需求：做一个多 agent SDLC 平台...\")</span>。Plan Agent 收到任务 brief。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0891b2;background:#cffafe;padding:2px 8px;border-radius:4px;\">Step 02</span> —— Plan Agent 跑完，输出 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">plan.txt</span> + <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">plan.json</span>。Design Agent 拿到 plan，生成 PRD + API spec + wireframes。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0891b2;background:#cffafe;padding:2px 8px;border-radius:4px;\">Step 03</span> —— Design Agent 把交付物 URL 和路径回传给 Plan Agent（其实是回给 Orchestrator，Orchestrator 转发）。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0891b2;background:#cffafe;padding:2px 8px;border-radius:4px;\">Step 04</span> —— Plan Agent 读 design artifacts，检查是否满足 plan.json 里的验收标准。不满足就退回。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#0891b2;background:#cffafe;padding:2px 8px;border-radius:4px;\">Step 05</span> —— 签字放行。Orchestrator 把 Design Agent 的 artifacts 交给 Build Agent，进入下一阶段。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">注意第 4 步 —— Plan Agent 不是被动接受交付物，而是反过来验证。这就是 Hermes multi-agent 不是群聊的核心：<span style=\"font-weight:bold;color:#c2410c;\">交接必须可验证。</span>Plan Agent 有 plan.json 里的验收标准，Design Agent 有 PRD 和 wireframes，两边对一下就知道有没有漏。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #b91c1c;color:#b91c1c;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #ef4444;\">6</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#b91c1c;margin:18px 0 26px;\">安全模型别大意</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">A2A 默认只绑 localhost（127.0.0.1）。对外暴露需要先设 token，再改 A2A_HOST。这是强制的 —— 没有 token 你没法把 A2A 接口开到外网。</p>\n\n<p style=\"background:#0a1420;color:#cbd5e1;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;padding:16px 18px;border-radius:8px;margin:0 0 18px;word-break:break-all;\">\n# ~/.hermes/.env<br/>\nA2A_HOST=0.0.0.0&nbsp;&nbsp;&nbsp;&nbsp;# 必须先设 token 才能改<br/>\nA2A_PORT=9900<br/>\nA2A_BEARER_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxx<br/>\n# 或者用更细粒度的 per-peer token<br/>\nA2A_PEER_TOKENS=\"plan-agent:tok1,design-agent:tok2,orchestrator:tok3\"\n</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">还有几道防火墙：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#b91c1c;\">Prompt injection 过滤</span> —— 入站文本被标记为不可信 peer 输入，对方不能触发斜杠命令。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#b91c1c;\">出站脱敏</span> —— API key、JWT、token 等凭证形状的字符串在回复里会被替换掉。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#b91c1c;\">反环机制</span> —— 每个 context 有 turn cap（默认 5，最多 20），防止两个 agent ping-pong 永远循环。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;color:#b91c1c;\">审计日志</span> —— 每次交换追加到 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">~/.hermes/a2a_audit.jsonl</span>。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">设了 per-peer token 之后，每个 peer 的身份自动参与 rate limiting 和信任判定。<span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;color:#b91c1c;background:#fee2e2;padding:2px 8px;border-radius:4px;\">A2A_TRUSTED_PEERS</span> 可以做 allowlist。</p>\n\n<p style=\"text-align:center;margin:50px 0 0;\"><span style=\"display:inline-block;border:2px solid #334155;color:#334155;font-size:19px;font-weight:bold;width:42px;height:42px;line-height:42px;box-shadow:6px 6px 0 #64748b;\">7</span></p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#334155;margin:18px 0 26px;\">什么时候用 A2A，什么时候不用</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">最后理清楚边界。Hermes 有三个多 agent 机制，各管各的：</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;\">同机器、进程内</span> —— 用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">delegation</span>，最快，子 agent 跑完自动回收上下文。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 8px;\"><span style=\"font-weight:bold;\">同机器、持久化队列</span> —— 用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">kanban</span>，任务挂起后可以等 cron 或另一个 agent 来捡。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\"><span style=\"font-weight:bold;\">跨机器 / 跨框架</span> —— 用 <span style=\"font-family:Consolas,Menlo,monospace;font-size:13px;\">A2A</span>。桌面端调服务器，Hermes 调 LangChain，任何符合 A2A v1.0 的 peer 都能对接。</p>\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;\">A2A 最有价值的场景其实就是 SDLC 这种流水线 —— 每个阶段一个独立 agent，独立进程、独立模型、独立工具权限，用 A2A 串成一条清晰的交接链。Orchestrator 只做调度和最终验证，不做具体工作。</p>\n\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:40px 0 0;padding-top:20px;border-top:1px solid #e2e8f0;\">本文基于 Hermes Agent 官方 A2A 文档和 multi-agent 博客整理：</p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 6px;\"><a href=\"https://hermes-agent.nousresearch.com/docs/user-guide/messaging/a2a\" style=\"color:#c2410c;text-decoration:none;\">A2A 配置文档（英文）</a></p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 6px;\"><a href=\"https://hermes-agent.nousresearch.com/docs/zh-Hans/user-guide/messaging/a2a\" style=\"color:#1d4ed8;text-decoration:none;\">A2A 配置文档（中文）</a></p>\n<p style=\"font-size:14px;line-height:1.8;color:#64748b;margin:0 0 20px;\"><a href=\"https://hermes-agent.ai/blog/hermes-agent-multi-agent\" style=\"color:#7e22ce;text-decoration:none;\">Multi-Agent Workflows 博客</a></p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
